; The Kargu base's swarm (TurkiyeReforged.ini), Turkiye's superweapon. Five minutes, the Scud
; Storm's clock, between the Particle Cannon's four and the nuke's six, and the Scud Storm's enum,
; so every player hears the superweapon announcements. The siren sounds where it is aimed, since the
; drones take about fifteen seconds to cross a map. The skirmish scripts know no such power; the AI
; fires it when it is ready (AIPlayer::doReadySpecialPowers).

SpecialPower SuperweaponTurkiyeKarguSwarm
  Enum                    = SPECIAL_SCUD_STORM
  ReloadTime              = 300000
  InitiateAtLocationSound = AirRaidSiren
  PublicTimer             = Yes
  ViewObjectDuration      = 30000
  ViewObjectRange         = 350
  RadiusCursorRadius      = 350
  ShortcutPower           = Yes
  AcademyClassify         = ACT_SUPERPOWER
  AIFiresWhenReady        = Yes
End
