; Gunfire that reads at play zoom. EA's machine gun flash was a 10-unit flare gone in two frames,
; and the tank's flame started half a unit across; at the default camera both were a few pixels.
; These are EA's muzzle systems at about one and a half times the size, the machine gun flare held
; one frame longer and the tank flame thrown further with more puffs. Every weapon that names one
; of them gets it bigger, the Gattling building and the Quad Cannon included. The tank's flare
; (TankMuzzleFlare) goes the other way. EA's was a white glow 40 across, growing 15 a frame and
; drifting 4 a frame ahead of the barrel, which at the default camera is a white blob 200 pixels
; wide in front of the gun at 720p, and at one and a half times it blew the barrel out entirely.
; Now it is a third the size, holds at the barrel tip, starts orange-white and burns down to
; orange in a quarter of a second: a muzzle blast rather than a light.

