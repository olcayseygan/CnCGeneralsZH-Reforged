  ParticleSystem
    Name = ReforgedVehicleShrapnel
    Count = 2
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = OverlordExplosionSmoke
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = OverlordSubExplosionSmoke
    FootprintBox = 1.0
    Height = 0 20 UNIFORM
    InitialDelay = 167 667 UNIFORM
  End
  ParticleSystem
    Name = OverlordExplosionDebris
    Count = 2
    FootprintBox = 0.8
  End
  ParticleSystem
    Name = OverlordExplosionLenzflare
    Offset = X:0.0 Y:0.0 Z:10.0
  End
  ParticleSystem
    Name = ReforgedTankBlastFire
    Offset = X:0.0 Y:0.0 Z:8.0
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = ReforgedTankBlastSparks
    Offset = X:0.0 Y:0.0 Z:10.0
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = OverlordExplosionShockwave
  End
  ViewShake 
    Type = STRONG
  End
  TerrainScorch
    Type = RANDOM 
    Radius = 15
  End
  Sound
    Name = TankDie
  End 
  LightPulse
    Color = R:255 G:150 B:70
    Radius = 85
    IncreaseTime = 0
    DecreaseTime = 450
  End
End

