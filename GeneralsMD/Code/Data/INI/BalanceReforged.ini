; ---- the rank ladder ------------------------------------------------------------------------------
;
; Every rank in the art is a grade: 28 promotions for America (E-1 to General of the Army), 19 for
; China (Private to General), 20 for GLA (Recruit to Supreme Liberator), 21 for Turkiye (Er to
; Maresal). Grade 0 is unranked on every side, with no insignia and no bonus; America's E-1 and
; Turkiye's Er wear nothing anyway, and China's Private and GLA's Recruit are a first promotion. The grade comes from a unit's experience and E, its own regular ExperienceValue
; (what killing a regular copy of itself pays). The step to grade g costs E x r^(g-1), so the first
; promotion is one same-class kill, and r is solved so the top grade costs Top x E. One gain, a kill
; or a heal, lifts one grade at most. docs/plans/RANK-LADDER.md in the wrapper has the tables.
;
; EA's four levels follow the grade: a unit is Veteran from VeteranPin on, and so on. A pilot, map
; objects, the rank cheat and scripts land on a pin; a veterancy crate gives CrateGrades grades
; instead of one level, never past the Heroic pin, and the trainings and the generals' born veterans
; give their StartingGrades (the blocks just above). A hero's insignia starts on
; HeroStart and reaches the top with the hero's last grade; its stats are its grade's like anyone's.
;
; Stats come from the grade in place of EA's VETERAN, ELITE and HERO lines and HealthBonus_*. Worth
; (rate of fire x damage x health) is 1 + WorthGain x sqrt(experience / Top E) at the grade's
; experience, the same curve on every side, and each side splits it in its own proportions, reached
; at the top: every stat at a grade is its top value raised to ln(worth) / ln(1 + WorthGain). Range
; and Speed multiply as the others do; SelfRepair is the share of max health healed a second once the
; unit has gone SelfRepairDelay milliseconds unhurt. A side's WeaponBonus lines add what a grade
; does not carry and count from the Veteran pin on.
;
;   America: rate of fire and health, range to 107%.
;   China:   health, and ranked men in a horde fire 10% faster.
;   GLA:     rate of fire, speed to 114%, self repair to 2% a second.
;   Turkiye: health first, then rate of fire, range to 112%.
;
; A grade can carry perks besides its stats, one Perk_<side> line each: grade, kind, strength, and
; for an aura its own radius and who it reaches. A grade holds every perk of the grades below it,
; and of one kind the strongest, so Turkiye's sight goes 110%, 120%, 130% with each line replacing
; the last. A line as strong as the one before replaces it with its radius and receivers; a line with
; no radius keeps the one before it. A grade with no line is stats only. No aura sits below its
; side's Elite pin: squads of corporals ringing and buffing each other read as noise, so a sergeant's
; old aura is now the same bonus on himself, or gone where no self kind exists. The site's /wiki/ranks
; describes the America, China and GLA ladders below.
;
;   SIGHT 110%          its own shroud clearing, past the half-again-its-weapon cap
;   STILL_GUARD 10%     10% less damage taken while it is not walking a path
;   MEND 1%             heals 1% of max health a second once SelfRepairDelay unhurt
;   SPOTTER             sees and is jammed the way the Gozcu timi is (SpotterSight)
;   SCATTER 15%         its own weapons scatter 15% less
;   DEATH_RALLY 15%     when it dies, allies within its aura radius take 15% less damage for RallyTime
;   DETECT 100          stealthed enemies within 100 are detected
;   AURA_RADIUS 200%    every aura radius it gives doubled, DETECT's excepted
;   RATE_OF_FIRE 5%     its own rate of fire +5% on top of the grade's
;   RANGE 3%            its own range +3% on top of the grade's
;   HEALTH 8%           its max health +8% on top of the grade's
;   SPEED 5%            its speed +5% on top of the grade's
;   LAST_STAND 25%      its rate of fire +25% while under 35% health
;   SCAVENGE 10%        each kill it scores pays its player 10% of the victim's cost
;   DESIGNATE 2         what it hurts wears FAERIE_FIRE for 2 s: everyone shooting at it fires at
;                       GameData's TARGET_FAERIE_FIRE rate (150%)
;   DESIGNATE_REVEAL    the mark detects a stealthed target for as long
;   SALVAGE_CRATE       on death it leaves a SalvageCrate
;   AURA_<kind> n% [radius] [INFANTRY | STRUCTURES]
;                       friendly units within the radius (AuraRadius without one): RATE_OF_FIRE
;                       added to rate of fire (never past AuraRateOfFireCap), SIGHT on shroud
;                       clearing, GUARD off damage taken, RANGE on an artillery weapon's range
;                       (AcquiresBeyondVision, or a minimum range), MEND heals a second hurt or not,
;                       PACE on speed, DRILL n teaches DrillRate of a unit's E a second up to grade n
;                       of its own ladder, STEADY off a timed paralysis or EMP and on subdual wearing
;                       off, CAPTURE off the time to take a building, SPOILS a share of the victim's
;                       cost for each kill a unit in range scores (the larger of it and SCAVENGE)
;
; Auras are refilled once a second. A unit in range of several leaders takes the strongest of each
; kind; kinds multiply. A leader's aura never reaches the leader, and buildings take none unless the
; line says STRUCTURES. Turkiye's AuraRadius is 150, the reach of a tank gun: a Maresal's 300 covers
; a company. The other three sides give each aura line its own radius, the wiki's. Each kind with an
; AuraRing_<kind> draws a ring on the ground under every leader the player can see, selected or
; not, friend or enemy (client only).

Veterancy
  ;              America  China  GLA    Turkiye
  Grades       = 28       19     20     21
  Top          = 120      120    120    120
  VeteranPin   = 4        4      4      4        ; E-4 Corporal, Sergeant, Raider, Uzman Cavus
  ElitePin     = 13       10     10     11       ; W-1 Warrant Officer, Second Lieutenant, Raid Captain, Tegmen
  HeroicPin    = 22       15     15     16       ; O-5 Lieutenant Colonel, Colonel, Warlord, Albay
  HeroStart    = 23       15     15     16       ; O-6 Colonel (Burton), Colonel, Warlord, Albay (the Maroon Beret)
  RateOfFire   = 142%     130%   148%   142%
  Damage       = 119%     119%   114%   119%
  Health       = 142%     155%   142%   142%
  Range        = 107%     100%   100%   112%
  Speed        = 100%     100%   114%   100%
  SelfRepair   = 0%       0%     2%     0%
  AuraRadius   = 0        0      0      150
  WorthGain    = 1.4
  CrateGrades  = 3
  SelfRepairDelay = 5000
  WeaponBonus_China = HORDE RATE_OF_FIRE 110%

  Perk_Turkiye = 3  SIGHT 110%              ; Cavus
  Perk_Turkiye = 4  STILL_GUARD 10%         ; Uzman Cavus
  Perk_Turkiye = 6  MEND 1%                 ; Astsubay Kidemli Cavus
  Perk_Turkiye = 8  SIGHT 120%              ; Astsubay Kidemli Ustcavus
  Perk_Turkiye = 10 RATE_OF_FIRE 5%         ; Astsubay Kidemli Bascavus
  Perk_Turkiye = 11 SPOTTER                 ; Tegmen
  Perk_Turkiye = 13 AURA_SIGHT 10%          ; Yuzbasi
  Perk_Turkiye = 14 SCATTER 15%             ; Binbasi
  Perk_Turkiye = 16 AURA_RATE_OF_FIRE 10%   ; Albay
  Perk_Turkiye = 17 DEATH_RALLY 15%         ; Tuggeneral
  Perk_Turkiye = 18 SIGHT 130%              ; Tumgeneral
  Perk_Turkiye = 18 DETECT 100
  Perk_Turkiye = 19 AURA_GUARD 10%          ; Korgeneral
  Perk_Turkiye = 20 AURA_RANGE 5%           ; Orgeneral
  Perk_Turkiye = 21 AURA_RADIUS 200%        ; Maresal

  Perk_America = 1  RATE_OF_FIRE 5%                 ; E-2 Private: Drilled
  Perk_America = 2  RANGE 3%                        ; E-3 Private First Class: Steady hands
  Perk_America = 3  MEND 0.5%                       ; E-4 Specialist: Field kit
