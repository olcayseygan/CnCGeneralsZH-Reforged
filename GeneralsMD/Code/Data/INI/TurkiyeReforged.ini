Object TurkiyePowerPlant
  Side       = Turkiye
  DisplayName = OBJECT:TurkiyePowerPlant
  ; Its own model: concept A, the Silahtaraga turbine hall. A long whitewashed hall in the First
  ; National style with two rows of tall pointed windows, a cornice over brackets and a lead-grey
  ; hipped roof with a glazed clerestory; a boiler house with a parapet terrace and one stout square
  ; stone chimney; a small office under a red-tile hip; a switchyard of three transformers under two
  ; steel portals. TRPWRPLT, its upgraded form TRPWRPLT_U (the hall's windows lit), its damaged,
  ; burning and rubble states TRPWRPLT_D, _E and _R and the construction scaffold TRPWRPLT_SC in
  ; Code/Data/Art/W3D, the TRPwrPlt_*.tga and ZHCA_TRPwrPlt.tga textures in Code/Data/Art/Textures,
  ; all made by experiments/proofs/2026-11-04/powerplant in the workspace. The logic is retail
  ; AmericaPowerPlant's untouched: footprint, GeometryHeight, the Advanced Control Rods upgrade. Two
  ; draw modules take the place of retail's five: the plant and the scaffold. Night and snow draw
  ; the day models. Steam rises from the chimney; the upgraded plant sparks on its portals.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Turkiye
      OkToChangeModelColor = Yes
      ConditionState       = NONE
        Model              = TRPWRPLT
        Animation          = TRPWRPLT.TRPWRPLT
        AnimationMode      = LOOP
        ParticleSysBone    = STEAM01 SteamVent
      End
      ConditionState       = POWER_PLANT_UPGRADED
        Model              = TRPWRPLT_U
        Animation          = TRPWRPLT_U.TRPWRPLT_U
        AnimationMode      = LOOP
        ParticleSysBone    = STEAM01 SteamVent
        ParticleSysBone    = SPARK01 LiveWireSparks
        ParticleSysBone    = SPARK02 LiveWireSparks02
        ParticleSysBone    = SPARK03 LiveWireSparks
        ParticleSysBone    = SPARK04 LiveWireSparks02
        ParticleSysBone    = SPARK05 LiveWireSparks
        ParticleSysBone    = SPARK06 LiveWireSparks02
      End
      ConditionState       = AWAITING_CONSTRUCTION
        Model              = NONE
      End
      AliasConditionState  = AWAITING_CONSTRUCTION DAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION REALLYDAMAGED
      AliasConditionState  = SOLD
      AliasConditionState  = SOLD DAMAGED
      AliasConditionState  = SOLD REALLYDAMAGED
      AliasConditionState  = SOLD POWER_PLANT_UPGRADED
      AliasConditionState  = SOLD DAMAGED POWER_PLANT_UPGRADED
      AliasConditionState  = SOLD REALLYDAMAGED POWER_PLANT_UPGRADED
      ConditionState       = DAMAGED
        Model              = TRPWRPLT_D
        Animation          = TRPWRPLT_D.TRPWRPLT_D
        AnimationMode      = LOOP
        ParticleSysBone    = STEAM01 SteamVent
        ParticleSysBone    = SPARK02 LiveWireSparks
        ParticleSysBone    = SPARK05 LiveWireSparks
      End
      ConditionState       = DAMAGED POWER_PLANT_UPGRADED
        Model              = TRPWRPLT_D
        Animation          = TRPWRPLT_D.TRPWRPLT_D
        AnimationMode      = LOOP
        ParticleSysBone    = STEAM01 SteamVent
        ParticleSysBone    = SPARK01 LiveWireSparks
        ParticleSysBone    = SPARK02 LiveWireSparks02
        ParticleSysBone    = SPARK04 LiveWireSparks
        ParticleSysBone    = SPARK05 LiveWireSparks02
      End
      ConditionState       = REALLYDAMAGED
        Model              = TRPWRPLT_E
        ParticleSysBone    = STEAM01 SmolderingSmoke
        ParticleSysBone    = SPARK01 LiveWireSparks
        ParticleSysBone    = SPARK05 LiveWireSparks02
      End
      AliasConditionState  = REALLYDAMAGED POWER_PLANT_UPGRADED
      ConditionState       = RUBBLE
        Model              = TRPWRPLT_R
      End
      AliasConditionState  = REALLYDAMAGED RUBBLE
      AliasConditionState  = RUBBLE POWER_PLANT_UPGRADED
      AliasConditionState  = REALLYDAMAGED RUBBLE POWER_PLANT_UPGRADED
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
        Model              = TRPWRPLT
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
