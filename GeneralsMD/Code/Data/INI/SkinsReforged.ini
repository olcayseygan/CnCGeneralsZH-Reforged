; Zero Hour Reforged unit skins, an online player's account entitlement (TankSkin.h).
;
; Skin <id>: the id is the one zerohour.gg uses and never changes or comes back for another skin.
; Unit names the unit, and a loadout holds one skin a unit.  UnitLabel and Label are the unit's and
; the skin's names in the string table, as the game's Skins screen shows them, and Earned the line
; under a card the account lacks: how it comes to own the skin (a code, a supporter grade, a badge),
; the site's rule told in words, never checked here.  Model lists every model the skin
; dresses, damaged states included.  Texture is a pair: a sheet one of those models draws, then the
; sheet drawn in its place.  A replacement missing on disk keeps the original, so the rebuilt models'
; sheets (*_R) and the retail ones (Classic Graphics, Detailed Models off) each swap only where their
; skin sheets are installed.  A house colour sheet (ZHC*) swaps only for one whose name keeps the ZHC
; part after the skin's prefix (SkinThx_ZHCA_UIWorker.tga), painted the same way, so the team colour
; still goes on it.  Rare = Yes marks the one of a kind, drawn in gold on the Skins screen.
;
; Ids run 1 to 63.  A wreck or a flying piece wears its unit's skin when it is listed here: the hulk
; and debris objects a death's ObjectCreationList makes, and a helicopter's FinalRubbleObject, belong
; to the player whose unit died, so his seat's skins reach them.  A model or sheet another unit draws
; too (the Crusader hulk every crushed tank leaves, the rotor blades, the crates) stays out.
;
; Drawing only: loaded without the multiplayer INI checksum, and the logic never reads it.

; The splinter camo: each tank in hard-edged shards of three tones from its own side's paint (USA urban
; grey, China olive, GLA desert), painted by experiments/skins-1k/build_livery.py in the wrapper.  The
; sheet names keep the Skin1K prefix of the gold paint they replaced.

; Crusader, the Superweapon General's too.  Not the Laser General's (the owner's call), and
; not the wreck: DeadCrusaderHulk's AVLeopard_D1 is what a crushed Paladin, Medic or Scud leaves too.
Skin 1
  Unit    = Crusader
  UnitLabel = OBJECT:Crusader
  Label   = SKIN:Splinter
  Earned  = SKIN:EarnedCode
  Model   = AVLeopard AVLeopard_D
  Texture = AVCrusader_R.tga   Skin1K_AVCrusader_R.tga
  Texture = AVCrusaderD_R.tga  Skin1K_AVCrusaderD_R.tga
  Texture = avleopard.tga      Skin1KC_avleopard.tga
  Texture = avleopard_d.tga    Skin1KC_avleopard_d.tga
End

