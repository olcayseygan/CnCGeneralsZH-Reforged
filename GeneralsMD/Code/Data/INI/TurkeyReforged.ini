  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY TurkeyFirtinaShellLong
  End
  WeaponSet
    Conditions = CRATEUPGRADE_ONE
    Weapon = PRIMARY TurkeyFirtinaShellGuided
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE CRATEUPGRADE_ONE
    Weapon = PRIMARY TurkeyFirtinaShellLongGuided
  End
  ReplaceModule ModuleTag_02
    Body = ActiveBody ModuleTag_02_Turkey
    MaxHealth              = 340.0
    InitialHealth          = 340.0
    SubdualDamageCap = 360
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
    End
  End
