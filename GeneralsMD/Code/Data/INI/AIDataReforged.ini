; Zero Hour Reforged AI data for the fork's factions, loaded after AIData.ini with
; INI_LOAD_MULTIFILE. A SideInfo named again is edited, a new one is added; every
; SkirmishBuildList here is added.
;
; This file lands in the multiplayer INI checksum.

; Turkiye's AI plays the SkirmishAmerica scripts, and those queue buildings by name:
; AISkirmishPlayer::buildSpecificAIBuilding compares the script's name with the build list's as
; strings. So Turkiye's build list is America's, American names and all. Each Turkiye object is a
; reskin of the American one (TurkiyeReforged.ini), so a Turkiye engineer or factory asked for the
; American name puts up its own button's Turkiye building or unit instead
; (BuildAssistant::findBuildButtonTemplate), and the command center adjustBuildList rebuilds in
; place of the starting one comes out Turkish too (ThingFactory::newObject). The Strategy Center
; keeps its spot and comes out as the Harekat Merkezi. America's uplink and drop zones have no
; Turkiye copy; four of their spots hold two radar towers and two Siper bunkers, which no script
; asks for and so are AutomaticallyBuild. The AI's guards sit in the Sipers
; (AIPlayer::garrisonBuildings).

AIData

  SideInfo Turkiye
    ResourceGatherersEasy     = 2
    ResourceGatherersNormal   = 2
    ResourceGatherersHard     = 2
    BaseDefenseStructure1     = AmericaPatriotBattery
    ; the Firtina and Sakarya fire past their own sight. America's scripts name a Tomahawk in no Easy
    ; team and in Medium's only from the third wave, so a share of the attack teams with no gun takes
    ; one of these (AIDifficultyProfile ArtilleryShare: all of Easy's, half of Medium's, a quarter of
    ; Hard's), and an attack team trains ArtillerySpotters of the Spotter when its gun comes out (1, 1, 2)
    Artillery                 = TurkiyeVehicleFirtina TurkiyeVehicleSakarya
    Spotter                   = TurkiyeInfantrySpotter

    ; Two seven-point paths through the rank tree, bought in list order, each tier after the one
    ; before it. The first is the radar and missile general: wider radars, the recon flight, the UAV
    ; swarm to five munitions, then Tayfun and the map-wide guidance that lets it hit anywhere. The
    ; second fights on the ground: painted targets, the recon flight, Gokbey Landing to its Kirpi,
    ; the commando raid and Tayfun.
    SkillSet1
      Science = SCIENCE_TurkiyeEarlyWarning
      Science = SCIENCE_TurkiyeUavRecon
      Science = SCIENCE_TurkiyeSwarmMunition
      Science = SCIENCE_TurkiyeSwarmMunition2
      Science = SCIENCE_TurkiyeSwarmMunition3
      Science = SCIENCE_TurkiyeTayfun
      Science = SCIENCE_TurkiyeSatelliteGuidance
    End

    SkillSet2
      Science = SCIENCE_TurkiyeLaserDesignation
      Science = SCIENCE_TurkiyeUavRecon
      Science = SCIENCE_TurkiyeRapidDeployment
      Science = SCIENCE_TurkiyeRapidDeployment2
      Science = SCIENCE_TurkiyeRapidDeployment3
      Science = SCIENCE_TurkiyeCommandoRaid
      Science = SCIENCE_TurkiyeTayfun
    End

  End

