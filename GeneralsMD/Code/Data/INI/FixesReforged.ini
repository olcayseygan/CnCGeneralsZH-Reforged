; The American generals' promotion screen offered the Pathfinder and the Stealth Fighter through
; the plain USA buttons, whose tooltip reads its "Requires" line from the plain unit: an Airfield
; or a Barracks these generals never build. CommandSetReforged.ini gives them their own buttons.

; The China Command Centers each carry one carpet bomber. The Nuke bomber and the early one share
; a shortcut type, so a Nuke player holding a captured China or Infantry Command Center could have
; the shortcut pick a building without his bomber, and the button went dead. The computer's China,
; Infantry and Nuke players buy the Tank General's carpet bomb science and fire the Tank General's
; bomber, which only his Command Center had, so their fifth promotion point did nothing. Every
; China Command Center now carries all three; each fires only for the science its owner holds.

Object ChinaCommandCenter
  AddModule
    Behavior = OCLSpecialPower ModuleTag_22Tank_Fix
      SpecialPowerTemplate = SuperweaponChinaCarpetBomb
      OCL                  = SUPERWEAPON_ChinaCarpetBomb
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    End
  End
  AddModule
    Behavior = OCLSpecialPower ModuleTag_22Nuke_Fix
      SpecialPowerTemplate = Nuke_SuperweaponChinaCarpetBomb
      OCL                  = Nuke_SUPERWEAPON_ChinaCarpetBomb
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    End
  End
End

