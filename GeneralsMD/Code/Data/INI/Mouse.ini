;------------------------------------------------------------------------------
;Mouse cursors
;
; EA's Mouse.ini from INIZH.big with every cursor on the Reforged set: Data/Cursors/Reforged*.ani,
; drawn by Tools/cursors.py at 48x48 with a 32x32 beside it. A loose file replaces the archive's
; whole, so the Mouse block is EA's, unchanged. Mouse::parseIni loads this with no Xfer: it is
; outside the multiplayer INI checksum. Texture is the .ani name Win32Mouse and SdlMouse load; Image
; only serves the polygon redraw mode, which this build never picks, and stays EA's.
;
; The last nine name cursors EA had no art for (Build, InvalidBuild) or no MouseCursor at all:
; orders that borrowed another's cursor until Mouse.h gave them their own.
;------------------------------------------------------------------------------

Mouse
  ; tooltips
  TooltipFontName = Arial
  TooltipFontSize = 8
  TooltipFontIsBold = No
  TooltipAnimateBackground = No                     ; does the background scroll out with the text?
  TooltipFillTime = 250                             ; time in milliseconds for text to scroll out
  TooltipDelayTime = 800                            ; time in milliseconds for tooltip to appear
  TooltipTextColor       = R:220 G:220 B:220 A:255
  TooltipHighlightColor  = R:255 G:255 B:0 A:255
  TooltipShadowColor     = R:0 G:0 B:0 A:255
  TooltipBorderColor     = R:60 G:60 B:155 A:255
  TooltipBackgroundColor = R:20 G:20 B:20 A:255
  TooltipWidth = 20                                 ; in percent screen width
  UseTooltipAltTextColor = No                       ; use player colors for tooltip text?
  UseTooltipAltBackColor = Yes                      ; use player colors for tooltip backgrounds?
  AdjustTooltipAltColor  = Yes                      ; alter (brighten/darken) use player colors for tooltips?

  ; 3D camera parameters
  OrthoCamera = Yes
  OrthoZoom = 0.5

  DragTolerance = 25                                ; How many pixels should we allow before it is a drag?
  DragTolerance3D = 25                              ; How many feet in worldspace should we allow before it is a drag?
  DragToleranceMS = 250                             ; if the mouse is held down for this long, we consider it a drag, not a click.
End

; "Normal" is not quite correct, as it shouldn't ever be used.  Just seems to be a spare entry. :P - MDC

MouseCursor Normal
  Texture             = ReforgedPointer
  Image               = SCCPointer
End

