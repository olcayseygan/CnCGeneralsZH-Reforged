; Zero Hour Reforged: weapons for the Turkiye faction, loaded after Weapon.ini (INI_LOAD_OVERWRITE)
; so that new names are allowed. Each is EA's weapon it is named after in the comment, with the
; fields the plan sets (docs/plans/TURKIYE-FRAKSIYON-KONSEPT.md section 5) written over it.
; The RadarBlindHit fields are the fork's and make a rocket radar-guided: aimed where no radar of
; its player or an ally reaches (RadarCoverageBehavior in TurkiyeReforged.ini), a shot keeps its
; target only RadarBlindHitChance of the time, or RadarBlindHitUpgradeChance once the player has
; RadarBlindHitUpgrade, and the rest come down on the ground beside the target (Weapon.cpp).
;
; This file lands in the multiplayer INI checksum.

