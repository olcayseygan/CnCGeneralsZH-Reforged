; The wreck pieces a vehicle's death throws as models (turrets, wheels, doors, hull plates; the
; ParticleSystem line of their CreateDebris in ObjectCreationListReforged.ini) trail the same dark
; ribbon as the shrapnel above, with a small flame on each of its points that is gone in a quarter
; of a second, so the fire stays at the piece (ReforgedShrapnelFlame, the ribbon's slave: its Size
; and SizeRate are factors on the ribbon's). The system lives just under two seconds and then stops: a piece
; is in the air for one to one and a half, and for the rest it smoulders where it lies, its new
; points rising off it on the drift into a short column. Only the large named pieces carry it, two to five a vehicle, never the
; scrap bits.

