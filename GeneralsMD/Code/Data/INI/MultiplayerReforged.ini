; Zero Hour Reforged player colours, loaded after Multiplayer.ini. A slot, a replay and a preference
; hold a colour as its place in the list, so EA's eight keep theirs and these follow them. Each block
; appends: the parser compares a block's name with a colour's TooltipName, and those never match.
;
; This file lands in the multiplayer checksum.

; Night colours follow EA's pairing: a colour bright enough to read on a night map keeps its day
; value, a dark one (EA's Purple) is lifted so it does not sink into the dark.

MultiplayerColor ColorTeal
  RGBColor = R:0 G:140 B:130
  RGBNightColor = R:0 G:180 B:165
  TooltipName = Color:Teal
End

