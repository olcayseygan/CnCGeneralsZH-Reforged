; Zero Hour Reforged's own weapons, loaded right after Weapon.ini and before any object names one.
;
; BalanceReforged.ini and FixesReforged.ini edit weapons in place and cannot add one: a block for a
; name nobody defined is read and dropped. A weapon they hand to an object therefore has to exist
; before they load, and this file makes sure it does. A block for a name the loaded data already
; has is read and dropped, so the data's own definition always stands.
;
; This file lands in the multiplayer INI checksum.

; The Paladin's anti-personnel laser, the second PointDefenseLaserUpdate that BalanceReforged.ini
; gives every Paladin. It borrowed EA's WatchTowerMachineGun, which nothing else fires; with a
; Weapon.ini that leaves that one out the module got no weapon and the Paladin crashed the game at
; the first infantry in reach. These are EA's fields with BalanceReforged's changes on them.
Weapon Reforged_PaladinInfantryLaser
  PrimaryDamage          = 100.0
  PrimaryDamageRadius    = 0.0
  AttackRange            = 65.0
  DamageType             = LASER
  DeathType              = LASERED
  WeaponSpeed            = 999999.0
  ProjectileObject       = NONE
  RadiusDamageAffects    = ALLIES ENEMIES NEUTRALS
  DelayBetweenShots      = 250
  ClipSize               = 2
  ClipReloadTime         = 4000
  AcceptableAimDelta     = 180
