  ; the rank 10 card's warhead reaches 112.5 (TalentsReforged.ini)
  UpgradeRadiusCursorRadius = SCIENCE_TurkiyeTalent10A 125
  ShortcutPower           = Yes
  AcademyClassify         = ACT_SUPERPOWER
  AIFiresWhenReady        = Yes
End

SpecialPower SuperweaponTurkiyeElectronicBlinding
  Enum                = SPECIAL_EMP_PULSE
  ReloadTime          = 240000
  RequiredScience     = SCIENCE_TurkiyeElectronicBlinding
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  RadiusCursorRadius  = 300
  ShortcutPower       = Yes
  AcademyClassify     = ACT_SUPERPOWER
