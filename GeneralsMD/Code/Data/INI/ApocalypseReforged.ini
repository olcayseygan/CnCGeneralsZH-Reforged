; ==== Weapons =====================================================================================

; The zombie: 40 a second, the claw on ZBZOMB_ATA at its own speed (hit at 0.5 s, a 1 s loop).
Weapon ApocalypseZombieClaw
  PrimaryDamage = 40.0
  PrimaryDamageRadius = 0.0
  AttackRange = 3.0
  DamageType = SMALL_ARMS
  DeathType = NORMAL
  WeaponSpeed = 999999.0
  ProjectileObject = NONE
  FireFX = NONE
  FireSound = HeroUSAKnifeAttack
  DelayBetweenShots = 1000
  ClipSize = 0
  ClipReloadTime = 0
  PreAttackDelay = 500
  PreAttackType = PER_ATTACK
End

; The runner: a weaker, quicker claw, the loop played at 1.25 (hit at 0.4 s, a 0.8 s loop).
Weapon ApocalypseZombieRunnerClaw
  PrimaryDamage = 22.0
  PrimaryDamageRadius = 0.0
  AttackRange = 3.0
  DamageType = SMALL_ARMS
  DeathType = NORMAL
  WeaponSpeed = 999999.0
  ProjectileObject = NONE
  FireFX = NONE
  FireSound = HeroUSAKnifeAttack
  DelayBetweenShots = 800
  ClipSize = 0
  ClipReloadTime = 0
  PreAttackDelay = 400
  PreAttackType = PER_ATTACK
End

; The brute: a heavy blow with a longer reach, the loop played at 0.667 (hit at 0.75 s, a 1.5 s loop).
Weapon ApocalypseZombieBruteClaw
  PrimaryDamage = 220.0
  PrimaryDamageRadius = 0.0
  AttackRange = 4.5
  DamageType = EXPLOSION  ; a brute tears into armour and walls, which shrug off small arms
  DeathType = NORMAL
  WeaponSpeed = 999999.0
  ProjectileObject = NONE
  FireFX = NONE
  FireSound = HeroUSAKnifeAttack
  DelayBetweenShots = 1500
  ClipSize = 0
  ClipReloadTime = 0
  PreAttackDelay = 750
  PreAttackType = PER_ATTACK
End

; ==== Zombies =====================================================================================

Object ApocalypseZombie
  Draw = W3DModelDraw ModuleTag_01
    IgnoreConditionStates = PREATTACK_A FIRING_A BETWEEN_FIRING_SHOTS_A RELOADING_A
    DefaultConditionState
      Model = ZBZOMB_SKN
      Animation = UIMOB01_SKL.ZBZOMB_STA
      AnimationMode = LOOP
      AnimationSpeedFactorRange = 0.85 1.15
      Flags = RANDOMSTART
      TransitionKey = TRANS_Stand
    End
    ConditionState = USING_WEAPON_A
      Animation = UIMOB01_SKL.ZBZOMB_ATA
      AnimationMode = LOOP
      TransitionKey = TRANS_Attack
    End
    ConditionState = MOVING
      Animation = UIMOB01_SKL.ZBZOMB_WKA 9.9
      AnimationMode = LOOP
      Flags = RANDOMSTART
      TransitionKey = None
      ParticleSysBone = None InfantryDustTrails
    End
    AliasConditionState = MOVING USING_WEAPON_A
    ConditionState = DYING
      Animation = UIMOB01_SKL.UIMOB01_DA1
      Animation = UIMOB01_SKL.UIMOB01_DA2
      AnimationMode = ONCE
      TransitionKey = TRANS_Dying
    End
    TransitionState = TRANS_Dying TRANS_Flailing
      Animation = UIMOB01_SKL.UIMOB01_A_ADTE1
      Animation = UIMOB01_SKL.UIMOB01_D_ADTE1
      AnimationMode = ONCE
    End
    ConditionState = DYING EXPLODED_FLAILING
      Animation = UIMOB01_SKL.UIMOB01_A_ADTE2
      Animation = UIMOB01_SKL.UIMOB01_D_ADTE2
      AnimationMode = LOOP
      TransitionKey = TRANS_Flailing
    End
    ConditionState = DYING EXPLODED_BOUNCING
      Animation = UIMOB01_SKL.UIMOB01_A_ADTE3
      Animation = UIMOB01_SKL.UIMOB01_D_ADTE3
      AnimationMode = ONCE
      TransitionKey = None
    End
  End

