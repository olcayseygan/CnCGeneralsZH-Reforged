  ; the covered vehicle gate and its garage inside the block, the flag in front and a guard post on
  ; the exit lane. TRCMDHQ and its damaged, burning and rubble states TRCMDHQ_D, _E and _R,
  ; the gate leaves TRCMDHQ_DR and the construction scaffold TRCMDHQ_SC in Code/Data/Art/W3D, the
