; The heat ring of a big blast: a ring of heat-haze smudges that runs out along the ground and
; thins as it goes. W3DParticleSystemManager draws any system whose texture name starts with
; "SMUD" as screen distortion instead of a billboard (the 0x44554D53 test in W3DParticleSys.cpp),
; so the texture named here is never loaded. It draws only where the smudge manager reports
; hardware support and Heat Effects are on in the options; elsewhere it draws nothing at all.
; Large runs out for about a second and a half, Huge for two, and both hold three quarters of their
