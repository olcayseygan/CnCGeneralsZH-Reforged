; Zero Hour Reforged special powers, loaded after SpecialPower.ini. A power EA defined is edited
; in place and a block holds only what changes; a new name is a new power.
;
; This file lands in the multiplayer INI checksum.

; Frenzy is a buff on your own troops and left a 250 radius window open for 30 seconds wherever
; it was clicked, so a Frenzy fired into the fog scouted an enemy base. Emergency Repair, the
; other buff, opens nothing.

SpecialPower SuperweaponFrenzy
  ViewObjectDuration = 0
  ViewObjectRange    = 0
End

SpecialPower Early_SuperweaponFrenzy
  ViewObjectDuration = 0
  ViewObjectRange    = 0
End

; The Demolitions General's Rebel Ambush, behind his own sciences in ScienceReforged.ini. The
; computer still buys the plain science and fires the plain power, which his Command Center keeps.

SpecialPower Demo_SuperweaponRebelAmbush
  Enum                    = SPECIAL_AMBUSH
  ReloadTime              = 240000
  RequiredScience         = Demo_SCIENCE_RebelAmbush1
  PublicTimer             = No
  InitiateAtLocationSound = RebelAmbushActivated
  SharedSyncedTimer       = Yes
  RadiusCursorRadius      = 50
  ShortcutPower           = Yes
  AcademyClassify         = ACT_SUPERPOWER
End

; Turkey's minefield: China's Cluster Mines behind Turkey's own science (ScienceReforged.ini).

SpecialPower SuperweaponTurkeyMinefield
  Enum                = SPECIAL_CLUSTER_MINES
  ReloadTime          = 240000
  RequiredScience     = SCIENCE_TurkeyMinefield
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  ViewObjectDuration  = 30000
  ViewObjectRange     = 250
  RadiusCursorRadius  = 100
  ShortcutPower       = Yes
  AcademyClassify     = ACT_SUPERPOWER
End
