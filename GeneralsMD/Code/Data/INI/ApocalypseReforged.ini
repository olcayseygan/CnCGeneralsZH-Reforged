  Acceleration = 40
  AccelerationDamaged = 30
  Braking = 80
  MinTurnSpeed = 0
  ZAxisBehavior = NO_Z_MOTIVE_FORCE
  Appearance = TWO_LEGS
  StickToGround = Yes
  GroupMovementPriority = MOVES_FRONT
End

