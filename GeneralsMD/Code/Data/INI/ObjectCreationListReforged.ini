; ==== Scud Storm ==================================================================================

; The storms carried their missiles in the PRIMARY slot, and a storm could be made to launch all
; nine before its timer was up. The storms' weapon moved to SECONDARY in FixesReforged.ini, and
; the power fires that slot.

ObjectCreationList SUPERWEAPON_ScudStorm
  Attack
    WeaponSlot = SECONDARY
    NumberOfShots = 9
    DeliveryDecalRadius = 200 ; align with SpecialPower.ini's RadiusCursorRadius
    DeliveryDecal
      Texture           = SCCScudStorm_GLA
      Style             = SHADOW_ALPHA_DECAL
      OpacityMin        = 25%
      OpacityMax        = 50%
      OpacityThrobTime  = 500
      Color             = R:33 G:255 B:67 A:255
      OnlyVisibleToOwningPlayer = Yes
    End
  End
End

; ==== Saboteur on a Combat Bike ===================================================================

; The Stealth Combat Bike throws its Saboteur rider with this list, and EA never wrote it, so the
; rider vanished. The body is the Saboteur's, thrown with the Worker's falls.

ObjectCreationList OCL_SaboteurFlyingOffBikeDeathStart
  ApplyRandomForce
    MinForceMagnitude = 60
    MaxForceMagnitude = 100
    MinForcePitch = 70
    MaxForcePitch = 90
    SpinRate = 120
  End
  CreateDebris
    ModelNames = UISabotr_SKN
    AnimationSet = UIWRKR_SKL.UIWRKR_ADTE1 UIWRKR_SKL.UIWRKR_ADTE2 UIWRKR_SKL.UIWRKR_ADTE3
    FXFinal = FX_TechnicalGunnerHitsGround
    OkToChangeModelColor = Yes
    IgnorePrimaryObstacle = Yes
    Mass = 5.0
    Disposition = RANDOM_FORCE INHERIT_VELOCITY
    OrientInForceDirection = Yes
    ExtraBounciness = -1.0
    MinForceMagnitude = 12
    MaxForceMagnitude = 15
    MinForcePitch = 70
    MaxForcePitch = 80
  End
End

