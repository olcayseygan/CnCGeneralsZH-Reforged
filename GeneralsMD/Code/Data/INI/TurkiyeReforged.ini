  ; TRALPAGU_SKN in Code/Data/Art/W3D on the Red Guard's skeleton (NICNSC_SKL), the Mehmetcik's
  ; idles, gaits, deaths and drop, and his own flag carrier TRALPAG_F_SKN (drone still on his back)
  ; on the Red Guard flag carrier's skeleton, so he moves as the Mehmetcik does. The drone rides on his
  ; back (sub-object DRONE). His own animations: TRALPAGU_S2K kneels, TRALPAGU_PLC takes the drone off
  ; and sets it on the ground in front of him, TRALPAGU_CTL is the kneeling controller loop with the
  ; drone gone, TRALPAGU_C2K goes from the controller back to placing the next one, TRALPAGU_C2S stands
  ; up. The drone leaves from MUZZLE01, which the last frame of PLC puts on the set-down drone; the
  ; logic reads it there (PRISTINE_BONE_POS_IN_FINAL_FRAME). No USING_WEAPON_A state, so the rifle
  ; firing poses never cover the drone ones.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Turkiye
      OkToChangeModelColor = Yes
