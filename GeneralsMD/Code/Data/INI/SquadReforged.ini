; ==== China's two squads a press ==================================================================

; EA's China barracks make two Red Guards a press through QuantityModifier, which matches a template
; and its equivalents: the computer's single Red Guard copy keeps the soldier's two, and the squad is
; listed beside it. The Tank Hunter's squads reskin the other nexus base, so they are no equivalent
; of the Red Guard's and still come one a press.

Object ChinaBarracks
  ReplaceModule ModuleTag_10
    Behavior = ProductionUpdate ModuleTag_10_Squad
      QuantityModifier = ChinaInfantryRedguard 2
      QuantityModifier = ChinaInfantryRedguardSquad 2
    End
  End
End

Object Nuke_ChinaBarracks
  ReplaceModule ModuleTag_10
    Behavior = ProductionUpdate ModuleTag_10_Squad
      QuantityModifier = Nuke_ChinaInfantryRedguard 2
      QuantityModifier = Nuke_ChinaInfantryRedguardSquad 2
    End
  End
End

Object Tank_ChinaBarracks
  ReplaceModule ModuleTag_10
    Behavior = ProductionUpdate ModuleTag_10_Squad
      QuantityModifier = Tank_ChinaInfantryRedguard 2
      QuantityModifier = Tank_ChinaInfantryRedguardSquad 2
    End
  End
End
