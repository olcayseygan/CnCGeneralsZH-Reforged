; ==== Tank General ===============================================================================

; The Emperor's loudspeaker waits for Upgrade_ChinaOverlordPropagandaTower, an object upgrade
; the Emperor is never given, so it never heals faster or pulses harder after Subliminal
; Messaging. The Overlord's speaker tower waits for Subliminal Messaging.

; Its Gattling upgrade creates the plain China turret; Tank_OCL_OverlordGattlingCannon and the
; Veteran Tank_ChinaTankOverlordGattlingCannon it makes were written for it and never named. The
; speaker-tower icon names an object upgrade the Emperor cannot be given, and ordering it onto an
; aircraft said nothing.

Object Tank_ChinaTankEmperor
  UpgradeCameo4  = None
  UpgradeCameo5  = Upgrade_ChinaSubliminalMessaging
  VoiceAttackAir = OverlordTankVoiceAttack
  ReplaceModule ModuleTag_07
    Behavior = ObjectCreationUpgrade ModuleTag_07_Fix
      UpgradeObject = Tank_OCL_OverlordGattlingCannon
      TriggeredBy   = Upgrade_ChinaOverlordGattlingCannon
    End
  End
  ReplaceModule ModulePropaganda_04
    Behavior = PropagandaTowerBehavior ModulePropaganda_04_Fix
      Radius                        = 150.0
      DelayBetweenUpdates           = 2000
      HealPercentEachSecond         = 1%
      PulseFX                       = FX_OverlordPropagandaTowerPropagandaPulse
      UpgradeRequired               = Upgrade_ChinaSubliminalMessaging
      UpgradedHealPercentEachSecond = 2%
      UpgradedPulseFX               = FX_OverlordPropagandaTowerSubliminalPulse
      AffectsSelf                   = Yes
    End
  End
End

