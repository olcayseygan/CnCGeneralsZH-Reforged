; ----------------------------------------------
; Gunfire that reads at play zoom. EA's machine gun tracers were a third of a unit wide and ten
; long, about one pixel at the default camera height, and an instant-hit gun showed nothing where
; it hit, because it has no projectile to carry a detonation FX there. These are EA's gun FXLists
; with the tracer twice as wide and three times as long, a stronger muzzle light, and a spark and a
; dirt puff played AtTarget, where the tracer lands. The muzzle flares themselves are larger in
; ParticleSystemReforged.ini. Colours stay EA's. Speeds do not: EA's 300 to 600 a second put a rifle
; tracer half a second over a 150 range, a dash crawling to the target, and a gattling's 1200 still
; took five frames over 200. Rifles and machine guns now fly 1500 a second and gattlings 1800, which
; crosses 150 to 200 in three or four frames, and the streak is 32 long so the faster round still
; reads as a line. The Comanche, Ranger, sentry drone and Spectre blocks after the Technical's are
; here only for the tracer, with no impact puffs added.
FXList WeaponFX_GenericMachineGunFire
  LightPulse
    Color = R:255 G:255 B:128
    Radius = 20
    IncreaseTime = 0
    DecreaseTime = 200
  End
  ParticleSystem
    Name = GattlingCannonLenzflare
    OrientToObject = Yes
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  ParticleSystem
    Name = FallingShells
    OrientToObject = Yes
    Offset = X:0.0 Y:0.0 Z:0.0
  End
  Tracer
    DecayAt = 1
    Length = 32
    Width = 0.7
    Color = R:255 G:255 B:255
    Speed = 1500
    Probability = 0.7
  End
  ParticleSystem
    Name = ReforgedBulletImpactSpark
    AtTarget = Yes
    Radius = 0 3 UNIFORM
  End
  ParticleSystem
    Name = ReforgedBulletImpactDust
    AtTarget = Yes
    Radius = 0 4 UNIFORM
    CreateAtGroundHeight = Yes
  End
End

