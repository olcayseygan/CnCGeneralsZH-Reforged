; Zero Hour Reforged's Turkiye faction, loaded after FixesReforged.ini with INI_LOAD_MULTIFILE.
;
; Every Turkiye object is an ObjectReskin of an existing one, followed by a patch block on the new
; name. The reskin copies the source template whole, as Balance and Fixes left it, and the patch
; then sets Side = Turkiye and whatever the plan (docs/plans/TURKIYE-FRAKSIYON-KONSEPT.md in the
; workspace, section 5) changes: cost, build time, health, vision, the weapon set and the command
; set. The weapons are new and live in TurkiyeWeaponReforged.ini, which loads before every object.
;
; A reskin counts as its source wherever the engine asks ThingTemplate::isEquivalentTo: a Turkiye
; War Factory meets a prerequisite that names AmericaWarFactory, and a Turkiye factory asked for an
; America-named unit by the skirmish scripts makes the Turkiye one its button names
; (BuildAssistant::findBuildButtonTemplate). That is what lets a Turkiye AI run the SkirmishAmerica
; scripts unchanged, so the units the scripts ask for by name are reskins of exactly those American
; units: Mehmetcik of the Ranger, Altay of the Crusader, Firtina of the Tomahawk and so on. The few
; that are not (the engineer, the supply truck, the radar tower, the Siper, the mine) the AI
; reaches through the dozer and harvester scans or its build list.
;
; ThingFactory::newObject turns any object made for a Turkiye player into the one Turkiye reskin of
; it, so there is never more than one Turkiye reskin of a source template.
;
; These are placeholders: the source models, voices and cameos under Turkish names.
;
; This file lands in the multiplayer INI checksum.

; ==== Buildings ===================================================================================

ObjectReskin TurkiyeCommandCenter AmericaCommandCenter
End

Object TurkiyeCommandCenter
  Side       = Turkiye
  DisplayName = OBJECT:TurkiyeCommandCenter
  CommandSet = TurkiyeCommandCenterCommandSet
  ; the radar circle the faction's rockets keep their lock in (TurkiyeWeaponReforged.ini). Every
  ; Turkiye radar takes Erken Ihbar's quarter and the Radar Tower's Hedef Siniflandirma.
  AddModule
    Behavior = RadarCoverageBehavior ModuleTag_TurkiyeRadarCoverage
      Radius          = 600
      RadiusUpgrade   = Upgrade_TurkiyeEarlyWarning 1.25
      ClassifyUpgrade = Upgrade_TurkiyeTargetClassification
    End
  End
  ; The rank powers (ScienceReforged.ini, SpecialPowerReforged.ini). A power's enum is one per
  ; object, so the American powers whose enums these take go: the Daisy Cutter (20), the Spy Drone
  ; (21), the spy satellite scan (24), the crate drop (25), the A-10 (26), Emergency Repair (27), the
  ; Spectre (32, 33) and the leaflet drop (34). None had a Turkiye button.
  RemoveModule ModuleTag_20
  RemoveModule ModuleTag_21
  RemoveModule ModuleTag_24
  RemoveModule ModuleTag_25
  RemoveModule ModuleTag_26
  RemoveModule ModuleTag_27
  RemoveModule ModuleTag_32
  RemoveModule ModuleTag_33
  RemoveModule ModuleTag_34
  ; Rank 1, SIHA Kesfi: a recon marker at the point
  AddModule
    Behavior = OCLSpecialPower ModuleTag_TurkiyeUavRecon
      SpecialPowerTemplate = SuperweaponTurkiyeUavRecon
      OCL                  = SUPERWEAPON_TurkiyeUavRecon
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  ; Rank 3, SIHA Surusu: one, three or five loitering munitions on the dearest targets in the circle
  AddModule
    Behavior = SwarmStrikeSpecialPower ModuleTag_TurkiyeSwarmMunition
      SpecialPowerTemplate = SuperweaponTurkiyeSwarmMunition
      Radius               = 200
      TargetCount          = 1
      UpgradeTargetCount   = SCIENCE_TurkiyeSwarmMunition3 5
      UpgradeTargetCount   = SCIENCE_TurkiyeSwarmMunition2 3
      Weapon               = TurkiyeSwarmMunitionWeapon
      TargetFX             = WeaponFX_ComancheAntiTankMissileDetonation
    End
  End
  ; Rank 3, Elektronik Harp: every enemy with a building in the circle loses its radar for 30 s, and
  ; the circle is jammed as long: enemy drones and spotters in it go blind and guided missiles lose
  ; their lock (TurkiyeElectronicWarfareMarker, below)
  AddModule
    Behavior = RadarJamSpecialPower ModuleTag_TurkiyeElectronicBlinding
      SpecialPowerTemplate = SuperweaponTurkiyeElectronicBlinding
      Radius               = 300
      Duration             = 30000
      FX                   = WeaponFX_EMPPulseImpact
      OCL                  = SUPERWEAPON_TurkiyeElectronicWarfare
    End
  End
  ; Rank 3, Gokbey Indirmesi, in the American paradrop's place
  ReplaceModule ModuleTag_22
    Behavior = OCLSpecialPower ModuleTag_22_Turkiye
      SpecialPowerTemplate = SuperweaponTurkiyeRapidDeployment
      UpgradeOCL           = SCIENCE_TurkiyeRapidDeployment3 SUPERWEAPON_TurkiyeRapidDeployment3
      UpgradeOCL           = SCIENCE_TurkiyeRapidDeployment2 SUPERWEAPON_TurkiyeRapidDeployment2
      OCL                  = SUPERWEAPON_TurkiyeRapidDeployment
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
      OCLAdjustPositionToPassable = Yes
    End
  End
  ; Rank 5, Uydu Gudum: no target; its marker covers the whole map
  AddModule
    Behavior = OCLSpecialPower ModuleTag_TurkiyeSatelliteGuidance
      SpecialPowerTemplate = SuperweaponTurkiyeSatelliteGuidance
      OCL                  = SUPERWEAPON_TurkiyeSatelliteGuidance
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  ; Rank 5, Tayfun: a ballistic missile out of the Command Center
  AddModule
    Behavior = OCLSpecialPower ModuleTag_TurkiyeTayfun
      SpecialPowerTemplate = SuperweaponTurkiyeTayfun
      OCL                  = SUPERWEAPON_TurkiyeTayfun
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  ; Rank 5, Bordo Bere Baskini: a Maroon Beret and two spotter teams by parachute, an eye behind the lines
  AddModule
    Behavior = OCLSpecialPower ModuleTag_TurkiyeCommandoRaid
      SpecialPowerTemplate = SuperweaponTurkiyeCommandoRaid
      OCL                  = SUPERWEAPON_TurkiyeCommandoRaid
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
      OCLAdjustPositionToPassable = Yes
    End
  End
  ; Its own model: a whitewashed command palace in the First National style, symmetric along its long
  ; front: two lead-capped corner towers, two pavilions (the vehicle gate and its garage in one, a
  ; matching shut gate in the other) and the portal tower in the middle carrying the drone
  ; ground-control dish, a red-tiled central wing between flat parapet terraces, the flag and badge
  ; sign in the yard and a guard post on the exit lane. TRCMDHQ and its damaged, burning and rubble
  ; states TRCMDHQ_D, _E and _R,
  ; the gate leaves TRCMDHQ_DR and the construction scaffold TRCMDHQ_SC in Code/Data/Art/W3D, the
  ; TRCmdHQ_*.tga and ZHCA_TRCmdHQ.tga textures in Code/Data/Art/Textures, all made by
  ; experiments/proofs/2026-11-02/hq in the workspace. Three draw modules take the place of retail's
  ; eight. The building: the flag waves and the dish re-aims in every state, night and snow draw the
  ; day model, and construction sinks it into the ground as retail's does, with the flag, the radio
  ; mast, the dish, the guard post and the badge sign (POST) hidden until it is finished. The gate
  ; leaves, opened and shut by ProductionUpdate's door states. The scaffold, standing at full height
  ; while the building rises inside it. The American fence, crane, radar dish and Officers Club flag
  ; go.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Turkiye
      OkToChangeModelColor = Yes
      ConditionState       = NONE
        Model              = TRCMDHQ
        Animation          = TRCMDHQ.TRCMDHQ
        AnimationMode      = LOOP
        ShowSubObject      = FLAGPOLE MAST FLAG01 FLAG02 FLAG03 FLAG04 DISH POST
      End
      ConditionState       = AWAITING_CONSTRUCTION
        Model              = NONE
      End
      AliasConditionState  = AWAITING_CONSTRUCTION DAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION REALLYDAMAGED
      AliasConditionState  = SOLD
      AliasConditionState  = SOLD DAMAGED
      AliasConditionState  = SOLD REALLYDAMAGED
      ConditionState       = DAMAGED
        Model              = TRCMDHQ_D
        Animation          = TRCMDHQ_D.TRCMDHQ_D
        AnimationMode      = LOOP
        ShowSubObject      = FLAGPOLE MAST FLAG01 FLAG02 FLAG03 FLAG04 DISH POST
      End
      ConditionState       = REALLYDAMAGED
        Model              = TRCMDHQ_E
        Animation          = TRCMDHQ_E.TRCMDHQ_E
        AnimationMode      = LOOP
        ShowSubObject      = FLAGPOLE MAST FLAG01 FLAG02 FLAG03 FLAG04 DISH POST
      End
      ConditionState       = RUBBLE
        Model              = TRCMDHQ_R
        Animation          = TRCMDHQ_R.TRCMDHQ_R
        AnimationMode      = LOOP
      End
      AliasConditionState  = REALLYDAMAGED RUBBLE
      ; the same model as the finished state, so the finished state shows what this one hid
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
        Model              = TRCMDHQ
        Animation          = TRCMDHQ.TRCMDHQ
        AnimationMode      = LOOP
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
        HideSubObject      = FLAGPOLE MAST FLAG01 FLAG02 FLAG03 FLAG04 DISH POST
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED DAMAGED
        Model              = TRCMDHQ_D
        Animation          = TRCMDHQ_D.TRCMDHQ_D
        AnimationMode      = LOOP
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
        HideSubObject      = FLAGPOLE MAST FLAG01 FLAG02 FLAG03 FLAG04 DISH POST
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED REALLYDAMAGED
        Model              = TRCMDHQ_E
        Animation          = TRCMDHQ_E.TRCMDHQ_E
        AnimationMode      = LOOP
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
        HideSubObject      = FLAGPOLE MAST FLAG01 FLAG02 FLAG03 FLAG04 DISH POST
      End
    End
  End
  ; the vehicle gate's two leaves, shut by default; damage leaves them as they are, rubble has no gate.
  ; The best match counts the bits a state shares with the object's, so damage on its own would pick
  ; the AWAITING_CONSTRUCTION DAMAGED alias (no model) over the default: every door state names its
  ; damaged forms outright.
  ReplaceModule ModuleTag_04
    Draw = W3DModelDraw ModuleTag_04_Turkiye
      OkToChangeModelColor = Yes
      DefaultConditionState
        Model              = TRCMDHQ_DR
        Animation          = TRCMDHQ_DR.TRCMDHQ_DR
        AnimationMode      = MANUAL
        Flags              = START_FRAME_FIRST
      End
      ConditionState       = DAMAGED
        Model              = TRCMDHQ_DR
        Animation          = TRCMDHQ_DR.TRCMDHQ_DR
        AnimationMode      = MANUAL
        Flags              = START_FRAME_FIRST
      End
      AliasConditionState  = REALLYDAMAGED
      ConditionState       = DOOR_1_OPENING
        Model              = TRCMDHQ_DR
        Animation          = TRCMDHQ_DR.TRCMDHQ_DR
        AnimationMode      = ONCE
        Flags              = START_FRAME_FIRST
      End
      AliasConditionState  = DOOR_1_OPENING DAMAGED
      AliasConditionState  = DOOR_1_OPENING REALLYDAMAGED
      ConditionState       = DOOR_1_WAITING_OPEN
        Model              = TRCMDHQ_DR
        Animation          = TRCMDHQ_DR.TRCMDHQ_DR
        AnimationMode      = MANUAL
        Flags              = START_FRAME_LAST
      End
      AliasConditionState  = DOOR_1_WAITING_OPEN DAMAGED
      AliasConditionState  = DOOR_1_WAITING_OPEN REALLYDAMAGED
      ConditionState       = DOOR_1_CLOSING
        Model              = TRCMDHQ_DR
        Animation          = TRCMDHQ_DR.TRCMDHQ_DR
        AnimationMode      = ONCE_BACKWARDS
        Flags              = START_FRAME_LAST
      End
      AliasConditionState  = DOOR_1_CLOSING DAMAGED
      AliasConditionState  = DOOR_1_CLOSING REALLYDAMAGED
      ConditionState       = RUBBLE
        Model              = NONE
      End
      AliasConditionState  = REALLYDAMAGED RUBBLE
      AliasConditionState  = RUBBLE DOOR_1_OPENING
      AliasConditionState  = RUBBLE DOOR_1_WAITING_OPEN
      AliasConditionState  = RUBBLE DOOR_1_CLOSING
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
        Model              = TRCMDHQ_DR
        Animation          = TRCMDHQ_DR.TRCMDHQ_DR
        AnimationMode      = MANUAL
        Flags              = START_FRAME_FIRST ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION
        Model              = NONE
      End
      AliasConditionState  = AWAITING_CONSTRUCTION DAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION REALLYDAMAGED
      AliasConditionState  = SOLD
      AliasConditionState  = SOLD DAMAGED
      AliasConditionState  = SOLD REALLYDAMAGED
    End
  End
  ; the scaffold: only while the building goes up or comes down for a sale, never height-adjusted
  ReplaceModule ModuleTag_05
    Draw = W3DModelDraw ModuleTag_05_Turkiye
      DefaultConditionState
        Model              = NONE
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
        Model              = TRCMDHQ_SC
      End
    End
  End
  ; units are made deep in the garage behind the gate, out of the camera's sight with the leaves
  ; open, and walk out through it to the same natural rally point
  ReplaceModule ModuleTag_13
    Behavior = DefaultProductionExitUpdate ModuleTag_13_Turkiye
      UnitCreatePoint      = X:-6.0  Y:34.5  Z:0.0
      NaturalRallyPoint    = X:60.0  Y:35.0  Z:0.0
    End
  End
  RemoveModule ModuleTag_02
  RemoveModule ModuleTag_03
  RemoveModule ModuleTag_06
  RemoveModule ModuleTag_07
  RemoveModule ModuleTag_OfficersClub
End

