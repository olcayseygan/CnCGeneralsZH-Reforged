; Zero Hour Reforged factions, loaded after PlayerTemplate.ini with INI_LOAD_MULTIFILE: a new name
; is added after EA's templates, an existing one is edited in place.
;
; This file lands in the multiplayer INI checksum.

; Turkiye has its own roster (TurkiyeReforged.ini) on American bodies and buys the American general
; powers: BaseSide USA, the American sciences on top of its own SCIENCE_Turkiye, and America's load
; screen, music and pictures until it has its own. It starts with a Combat Engineer team, not a dozer.
; RandomExcluded keeps it out of a plain Random; a lobby's Custom Selection can still tick it in.

PlayerTemplate FactionTurkiye
  Side              = Turkiye
  BaseSide          = USA
  PlayableSide      = Yes
  StartMoney        = 0
  PreferredColor    = R:255 G:0 B:0
  IntrinsicSciences = SCIENCE_AMERICA SCIENCE_Turkiye
  ; the talent cards, 6A 6B 7A 7B 8A 8B 9A 9B 10A 10B (ScienceReforged.ini)
  TalentSciences    = SCIENCE_TurkiyeTalent6A SCIENCE_TurkiyeTalent6B SCIENCE_TurkiyeTalent7A SCIENCE_TurkiyeTalent7B SCIENCE_TurkiyeTalent8A SCIENCE_TurkiyeTalent8B SCIENCE_TurkiyeTalent9A SCIENCE_TurkiyeTalent9B SCIENCE_TurkiyeTalent10A SCIENCE_TurkiyeTalent10B
  PurchaseScienceCommandSetRank1  = SCIENCE_Turkiye_CommandSetRank1
  PurchaseScienceCommandSetRank3  = SCIENCE_Turkiye_CommandSetRank3
  PurchaseScienceCommandSetRank8  = SCIENCE_Turkiye_CommandSetRank8
  SpecialPowerShortcutCommandSet  = SpecialPowerShortcutTurkiye
  SpecialPowerShortcutWinName     = GenPowersShortcutBarUS.wnd
  SpecialPowerShortcutButtonCount = 10
  DisplayName       = INI:FactionTurkiye
  StartingBuilding  = TurkiyeCommandCenter
  StartingUnit0     = TurkiyeInfantryEngineer
  ScoreScreenImage  = America_ScoreScreen
  LoadScreenImage   = SAFactionLogoPage_US
  LoadScreenMusic   = Load_USA
  ScoreScreenMusic  = Score_USA
  FlagWaterMark     = WatermarkUSA
  EnabledImage      = SSObserverUSA
  BeaconName        = MultiplayerBeacon
  SideIconImage     = GameinfoAMRCA
  GeneralImage      = USA_Logo
  OldFaction        = No
  RandomExcluded    = Yes
  ArmyTooltip       = TOOLTIP:BioStrategyLong_Turkiye
  Features          = GUI:BioFeatures_Turkiye
  MedallionRegular  = USAGeneral_slvr
  MedallionHilite   = USAGeneral_blue
  MedallionSelect   = USAGeneral_orng
End

