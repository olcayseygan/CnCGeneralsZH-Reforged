; The jet: a thin long flame shot out of the barrel (ReforgedMuzzleJet, 4 by 4 frames played once over
; the card's nine frames, the jet's root at the middle of the card's top edge and the flame running
; down it). The card lies flat (IsGroundAligned) and turns its top edge towards the emitter
; (IsParticleUpTowardsEmitter; the engine aims it at birth, and its exact-axis case is fixed in the
; Reforged picture). A flat card is twice its Size across (the ground quad takes Size as its half side,
; pointgr.cpp) and has to stay ahead of the bone or the turn to the emitter flips it; the Muzzle bone
; sits about nine ahead of the barrel's mouth (the shell starts there too), and the art's root is 0.07
; of the card below its top edge. Born 0.3 ahead with Size 10.5 the root falls about 8.6 behind the
; bone, on the mouth (filmed in tank-death-v6 it started a shell's length ahead with ground between);
; the small guns' 7 by the same reckoning. The art's later frames burn down to a puff at the root, so
; it plays at 8 frames a second and the first few hold. Lifetime is game time (15 is ten logic frames at
; game speed 150; the first 9 showed for about four and were cut short by the fade). Oranger than the
; first version's wide yellow tongue. This replaces the one-lobe hot core that stood here, so no
; additive core is left on the muzzle.
