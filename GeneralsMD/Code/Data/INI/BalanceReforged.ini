; ---- a plane shot down blows up and burns where it lands -----------------------------------------
;
; ObjectCreationListReforged.ini says when a crash goes off; this is what goes off. All three
; objects are ObjectReskins of EA's FireFieldSmall, the napalm missile's patch of fire, because a
; reskin may be a new name in this file where a plain Object may not. A reskin changes only the
; draw module, so a second block under each name swaps the rest.
;
; Reforged_JetCrashFire fires Reforged_JetCrashFireWeapon, EA's SmallFireFieldWeapon (5 FLAME
; across 30 every quarter second, BURNED) that spares the plane's own player and its allies, as
; the blasts do, and burns 6 seconds where the napalm field burns 2.5: 120 to a
; tank's hull before armour, 180 to a man in HumanArmor who stays in it. Its flames are EA's
; inferno burst for the first moments, then the burning-building fire and smoke for as long as it
; stands; the smoke drifts off after it goes. Reforged_JetCrashImpact and Reforged_BigJetCrashImpact
; draw nothing, fire their one-shot blast from WeaponReforged.ini the frame they appear and are gone
; a second later.
;
; The Aurora, the Stealth Fighter and every big plane had no list for hitting the ground, so their
; death module is restated with one. Every other line is EA's, the same in each general's copy. A
; big plane is also given its crash for dying on the ground, which none of them ever does: they are
; made at cruising height and leave the map at it. The campaign's CINE_ copies are left alone.

ObjectReskin Reforged_JetCrashFire FireFieldSmall
  Draw = W3DModelDraw ModuleTag_01_Crash
    DefaultConditionState
      Model = NONE
      ParticleSysBone = None InfernoCannonFire
      ParticleSysBone = None InfernoCannonFlare
      ParticleSysBone = None InfernoCannonRing
      ParticleSysBone = None FireFactionLarge
      ParticleSysBone = None SmokeFactionLarge
    End
  End
End

Object Reforged_JetCrashFire
  ReplaceModule ModuleTag_03
    Behavior = FireWeaponUpdate ModuleTag_03_Crash
      Weapon = Reforged_JetCrashFireWeapon
    End
  End
  ReplaceModule ModuleTag_04
    Behavior = DeletionUpdate ModuleTag_04_Crash
      MinLifetime = 6000
      MaxLifetime = 6000
    End
  End
End

ObjectReskin Reforged_JetCrashImpact FireFieldSmall
  Draw = W3DModelDraw ModuleTag_01_Crash
    DefaultConditionState
      Model = NONE
    End
  End
End

Object Reforged_JetCrashImpact
  ReplaceModule ModuleTag_03
    Behavior = FireWeaponUpdate ModuleTag_03_Crash
      Weapon = Reforged_JetCrashBlast
    End
  End
  ReplaceModule ModuleTag_04
    Behavior = DeletionUpdate ModuleTag_04_Crash
      MinLifetime = 1000
      MaxLifetime = 1000
    End
  End
End

ObjectReskin Reforged_BigJetCrashImpact FireFieldSmall
  Draw = W3DModelDraw ModuleTag_01_Crash
    DefaultConditionState
      Model = NONE
    End
  End
End

