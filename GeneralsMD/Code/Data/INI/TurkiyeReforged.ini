Object TurkiyePowerPlant
  Side       = Turkiye
  DisplayName = OBJECT:TurkiyePowerPlant
  ; Its own model: a present-day gas-fired plant. A sheet-steel turbine hall with a window ribbon
  ; and a flat roof carrying the air inlet filter house and two cooler fans; the heat-recovery boiler
  ; and its steel stack behind it, a slim bypass stack beside; a switchyard of three step-up
  ; transformers between fire walls under two steel portals; a concrete control building on the
  ; near corner. TRPWRPLT, its upgraded form TRPWRPLT_U (the window ribbons lit), its damaged,
  ; burning and rubble states TRPWRPLT_D, _E and _R and the construction scaffold TRPWRPLT_SC in
  ; Code/Data/Art/W3D, the TRGasPlt_*.tga and ZHCA_TRGasPlt*.tga textures in Code/Data/Art/Textures.
  ; The object keeps retail AmericaPowerPlant's footprint, GeometryHeight and Advanced Control Rods
  ; upgrade. Two draw modules take the place of retail's five: the plant and the
  ; scaffold. Night and snow draw the day models. Steam rises from the stack; the upgraded plant
  ; sparks on its portals.
