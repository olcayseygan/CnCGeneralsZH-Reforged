;//////////////////////////////////////////////////////////////////////////////
; Bigger blasts and falling buildings. EA's FXLists below had no light, or for
; the Spectre, firebase and strategy centre shells one of radius 30, which lit
; about a tank's width; each is re-declared whole with a LightPulse, and the big
; ones also carry the white-hot core, the heat ring and a scorch from
; ParticleSystemReforged.ini. The dust cloud a falling building threw up is gone:
; it grew past a hundred units across and hung olive-grey for six seconds after
; every structure and civilian building death, so a busy match was never clear of it.
; A light sized by the blast: about 85 for a shell, 150 for a bomb truck or a
; Scud launcher, 220 for a High Explosive bomb truck or a bunker buster, 260 for
; the MOAB and the Daisy Cutter, 320 for a nuke. The terrain takes the first 20
; dynamic lights it finds (MAX_ENABLED_DYNAMIC_LIGHTS), so a long fade is kept
; for the blasts that are rare.
;
; ViewShake sums every shake in range and W3DView::shake resets the sum to 3.0
; when it passes MaxShakeIntensity (10), so a run of SEVERE (5.0) hits shakes
; less than one does. The Scud Storm's missiles and the carpet bomb's bombs come
; down in a run and shake STRONG (2.5) each, which four can stack.
;//////////////////////////////////////////////////////////////////////////////

; ----------------------------------------------
; A building's fireballs, dust and shards spread over its own footprint and turn with it
; (FootprintBox, as on the tank death), so an airfield goes up along its whole length. Each size
; covers a band of buildings: Tiny is tank-sized (a Gattling Cannon, 8 by 8 half-extents), Small
; runs from a fuel tank (11 by 28) to a Chinese supply centre (52 by 47), Medium from a firebase
; (26 by 26) to an airfield (112 by 74). The fractions keep the smallest of a band about as wide
; as EA's round patch was, and stop where EA's fireballs, 50 to 75 across and growing, still
; cover the biggest one's box; the dust is hollow, so two thirds of it rises along the box's edge.
; Large has no building of EA's on it and takes Medium's fractions.
; Only the shards are thin enough to go sparse, and they come twice on the Small and bigger deaths.
; The flash, the shockwave, the heat ring and the smoke column stay round, at the centre.
FXList FX_StructureTinyDeath
  ParticleSystem
    Name = StructureTransitionTinySmoke
    FootprintBox = 0.8
  End
  ParticleSystem
    Name = StructureTransitionTinyExplosion
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = StructureTransitionTinyShockwave
  End
  ParticleSystem
    Name = StructureTransitionTinyFlare
  End
  Sound
    Name = BuildingDie
  End
  ViewShake
    Type = SUBTLE
  End
  TerrainScorch
    Type = RANDOM
    Radius = 20
  End
  LightPulse
    Color = R:255 G:140 B:60
    Radius = 90
    IncreaseTime = 0
    DecreaseTime = 500
  End
End

