; The Kizilelma's afterburner, on its Engine01 and Engine02 bones. It wore the Raptor's JetLenzflare,
; a white card 20 across lit for three frames at the bone and rising 0.25 a frame, with a cloud left
; behind for every card (JetLenzflareExhaust) growing to as much as 29 across. The bones sit about
; 6 above the runway on the takeoff roll, so the card's lower half went into the ground and its
; sides showed past the fins as two glows leaning off the tail, and the clouds lay on the runway.
; The card here is 8 across and does not rise, still thrown aft along the bone's heading, and each
