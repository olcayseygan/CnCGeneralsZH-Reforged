; The Harekat Merkezi, Turkiye's technology building: the Strategy Center under a Turkish name, its
; gun, its three battle plans and its 2500 price, and what opens the Kargu base, the way the
; Strategy Center opens the Particle Cannon. Being that reskin, it is what the engineer puts up
; where America's scripts ask for a Strategy Center, and the tech building AIPlayer::doSuperweapons
; raises before the superweapon. It researches the two American upgrades the Turkish units carry
; unchanged from their sources, Advanced Training and Chemical Suits. Composite Armor stays off its
; bar because the Factory's Reinforced Hull already covers the tanks, and Supply Lines because
; nothing Turkish gathers by Chinook. CIA Intelligence needs an American science.

ObjectReskin TurkiyeHarekatMerkezi AmericaStrategyCenter
End

