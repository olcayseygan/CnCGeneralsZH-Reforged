    Behavior = AIUpdateInterface ModuleTag_03_Turkey
      Turret
        TurretTurnRate = 60
        TurretPitchRate = 60
        FirePitch = 70
        AllowsPitch = Yes
        ControlledWeaponSlots = PRIMARY
      End
      AutoAcquireEnemiesWhenIdle = Yes NotWhileAttacking
    End
  End
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_TurkeyRange
      TriggeredBy = Upgrade_TurkeyExtendedRange
    End
  End
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_TurkeyGuidance
      TriggeredBy   = Upgrade_TurkeyPrecisionGuidance
      WeaponSetFlag = CRATEUPGRADE_ONE
    End
  End
End

