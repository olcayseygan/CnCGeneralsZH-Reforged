; Zero Hour Reforged AI data for the fork's factions, loaded after AIData.ini with
; INI_LOAD_MULTIFILE. A SideInfo named again is edited, a new one is added; every
; SkirmishBuildList here is added.
;
; This file lands in the multiplayer INI checksum.

; Turkey's AI plays the SkirmishAmerica scripts, and those queue buildings by name:
; AISkirmishPlayer::buildSpecificAIBuilding compares the script's name with the build list's as
; strings. So Turkey's build list is America's, American names and all. Each Turkey object is a
; reskin of the American one (TurkeyReforged.ini), so a Turkey dozer or factory asked for the
; American name puts up its own button's Turkey building or unit instead
; (BuildAssistant::findBuildButtonTemplate), and the command center adjustBuildList rebuilds in
; place of the starting one is picked by side (AIPlayer::buildStructureNow).

AIData

