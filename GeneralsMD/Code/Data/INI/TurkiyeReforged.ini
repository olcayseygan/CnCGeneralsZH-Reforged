End

Object TurkiyeVehicleBayraktar
  Side       = Turkiye
  DisplayName = OBJECT:TurkiyeVehicleBayraktar
  BuildCost  = 500
  BuildTime  = 10.0
  VisionRange         = 400
  ShroudClearingRange = 400
  SpotterSight        = Yes
  Prerequisites
    Object = TurkiyeAirfield
  End
  ; Fuel Cell raises CRATEUPGRADE_ONE and Rank 1's Fuel Resupply CRATEUPGRADE_TWO, which both mean
  ; more munitions per sortie; Swarm Software raises PLAYER_UPGRADE, munitions that pick the
  ; dearest target in reach. A helicopter has no fuel, so its time over the target is its rack.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarMunition
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = CRATEUPGRADE_ONE
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarMunitionFuel
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = CRATEUPGRADE_TWO
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarMunitionResupply
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = CRATEUPGRADE_ONE CRATEUPGRADE_TWO
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarMunitionFuelResupply
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarSwarm
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE CRATEUPGRADE_ONE
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarSwarmFuel
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE CRATEUPGRADE_TWO
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarSwarmResupply
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
