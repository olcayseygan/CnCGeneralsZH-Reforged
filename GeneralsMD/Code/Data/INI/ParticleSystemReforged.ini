; The wrecks' own flames. A dead or nearly dead vehicle's fire is no system of its own: EA hangs a
; smoke on its Smoke bones (SmokeSmallContinuous01 on the hulls and the Overlord-class wrecks, a puff
; every frame from a ball four across, 0.5 to 3 big; SmallLightSmokeColumn on the Crusader-class, a
; puff every two frames), and the fork hung a flame on every puff as its slave. A slave takes the
; puff's place, size and throw, so the wreck's flame was a new card each frame, 4 to 27 across,
; drifting off with its smoke: the stub that regrows several times a second in the round 21 film.
; Round 21 hung the flames off an invisible anchor at random (one card in about forty puffs): where a
; fire burned it was one steady flame, but some wrecks drew none and others went out between cards.
; Round 22: SlaveEmitsOnItsOwn (source 87e60487). The smoke makes one flame system as its slave and
; no longer feeds it a card per puff; the flame emits by its own clock at the smoke's bone, follows it
; and ends with it. One card of 200 frames at birth and the next 170 frames later (a burst every
; BurstDelay + 1 updates), so the wreck always burns and two cards meet only in the 30-frame
; crossfade. One size, one spot (the foot lifted to the bone by the line's height), one shared film.
; CRITICAL, as every single-card fire above: a 200-frame card is the oldest particle on the field, and
; at the particle cap a lower priority's oldest card goes first, so a fire at WEAPON_EXPLOSION, EA's
; own priority for the building fires, lost its one card to the next blast and stood dark until the
; next burst; and a frame-rate cut that refuses a low priority's burst would skip its only card.
; Round 23: a card stays where it was born while its smoke moves on. A wreck is thrown and lands, and
; a dying vehicle's last card outlives it (its system ends with its master, its cards do not), so a
; 200-frame card born in the air hung over the wreck until the hand-over showed two flames stacked
; and a smaller one going on below. Short cards now: 60 frames, the next every 45, so a card born
; where the smoke no longer is goes within about a second. Each is fully in by its sixth frame, so
; the fire shows with the smoke's first puff, and the old card fades over the last 15 frames on top
; of the new one at full strength: the same picture on the same spot at the same size, nothing to see.
