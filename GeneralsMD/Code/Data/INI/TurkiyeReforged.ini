    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY TurkiyeKizilelmaMissileGokdogan
  End
  ReplaceModule ModuleTag_02
    Body = ActiveBody ModuleTag_02_Turkiye
    MaxHealth              = 160.0
    InitialHealth          = 160.0
    End
  End
  ; the Airfield's Gokdogan missile
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_TurkiyeGokdogan
      TriggeredBy   = Upgrade_TurkiyeGokdogan
      WeaponSetFlag = PLAYER_UPGRADE
    End
  End
  ; Its own model, shaped after photos of the real jet: a long drooping nose and a hump spine with no
  ; canopy, small canards behind the nose, side intakes under the chine, a big low cranked delta,
  ; flat tail booms either side of one nozzle and two fins leaning out hard. TRKIZILELMA and its
  ; damaged state TRKIZILELMA_D, the falling jet TRKIZILELMA_D1B, the
  ; hulk TRKIZILELMA_D1 and the pieces it throws, TRKIZILELMA_D2 to _D4, in Code/Data/Art/W3D; the
  ; ZHCA_TRKizilelma*.tga and TRKizilelma_*.tga textures in Code/Data/Art/Textures; all made by
  ; experiments/proofs/2026-11-02/kizilelma in the workspace. The bones keep the Raptor's names, so
  ; this is the Raptor's draw with the models swapped, plus GEAR01: the wheels show while the jet
  ; is parked or taxiing, and on air locomotion while it is less than LandingGearUpHeight above the
  ; terrain: the takeoff roll and the climb out, the last of the final and the landing rollout. No
  ; condition state names the gear: JETEXHAUST comes on as the takeoff roll starts, and the jet slid
  ; down the runway on its belly. A state's
  ; Show/HideSubObject also shows or hides every mesh on a bone under that mesh's bone, and GEAR01
  ; sits on CHASSIS01, the flames' parent, so a state that named the gear lit the flames on the
  ; parked jet and put them out under the afterburner. The flame: none on the ground (no
  ; JETEXHAUST while parked or taxiing), the hot core BURNERFX02 in flight, the whole plume under
  ; the afterburner (takeoff roll, attack runs), with a glow 8 across at the nozzle
  ; (KizilelmaLenzflare) where the Raptor's 20-wide one dipped into the runway on the takeoff roll.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Turkiye
      LandingGearSubObject  = Gear01
      LandingGearUpHeight   = 30.0
      DefaultConditionState
        Model               = TRKIZILELMA
        HideSubObject       = BurnerFX01 BurnerFX02
        WeaponLaunchBone    = PRIMARY WeaponA
      End
      ConditionState        = JETEXHAUST
        ShowSubObject       = BurnerFX02
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
      End
      ConditionState        = JETEXHAUST JETAFTERBURNER
        ShowSubObject       = BurnerFX01 BurnerFX02
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
        ParticleSysBone     = Engine01 KizilelmaLenzflare
        ParticleSysBone     = Engine02 KizilelmaLenzflare
      End
      ConditionState        = REALLYDAMAGED
        Model               = TRKIZILELMA_D
        ParticleSysBone     = Smoke01 JetSmoke
        ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      End
      ConditionState        = REALLYDAMAGED JETEXHAUST
        Model               = TRKIZILELMA_D
        ShowSubObject       = BurnerFX02
        ParticleSysBone     = Smoke01 JetSmoke
        ParticleSysBone     = Engine01 JetEngineDamagedSmoke
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
      End
      ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
        Model               = TRKIZILELMA_D
        ShowSubObject       = BurnerFX01 BurnerFX02
        ParticleSysBone     = Smoke01 JetSmoke
        ParticleSysBone     = Engine01 JetEngineDamagedSmoke
        ParticleSysBone     = Engine01 KizilelmaLenzflare
        ParticleSysBone     = Engine02 KizilelmaLenzflare
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
      End
      ConditionState        = RUBBLE
        Model               = TRKIZILELMA_D1B
        HideSubObject       = None
        ShowSubObject       = None
      End
      ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
        Model               = TRKIZILELMA_D1B
        HideSubObject       = None
        ShowSubObject       = None
        ParticleSysBone     = Engine01 JetExhaust
        ParticleSysBone     = Engine02 JetExhaust
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
      End
      OkToChangeModelColor  = Yes
    End
  End
  ; It dies into its own pieces: the left wing shot off in the air, then the fin, the canard and the
  ; wing again where it hits the ground, and its own burnt-out hulk. The Raptor's values otherwise.
  ReplaceModule ModuleTag_05
    Behavior = JetSlowDeathBehavior ModuleTag_05_Turkiye
      FXOnGroundDeath                = FX_JetOnGroundDeath
      OCLOnGroundDeath               = OCL_TurkiyeKizilelmaDeathFinalBlowUp
      DestructionDelay               = 99999999
      RollRate                       = 0.2
      RollRateDelta                  = 100%
      PitchRate                      = 0.0
      FallHowFast                    = 110.0%
      FXInitialDeath                 = FX_RaptorDeathInitial
      OCLInitialDeath                = OCL_TurkiyeKizilelmaDeathInitial
      DelaySecondaryFromInitialDeath = 500
      FXSecondary                    = FX_JetDeathSecondary
      OCLSecondary                   = OCL_RaptorDeathSecondary
      FXHitGround                    = FX_JetDeathHitGround
      OCLHitGround                   = OCL_TurkiyeKizilelmaDeathHitGround
      DelayFinalBlowUpFromHitGround  = 200
      FXFinalBlowUp                  = FX_JetDeathFinalBlowUp
      OCLFinalBlowUp                 = OCL_TurkiyeKizilelmaDeathFinalBlowUp
    End
  End
  ; Inertial Guidance's mark, as on the Firtina
  AddModule
    Behavior = StatusBitsUpgrade ModuleTag_TurkiyeGuidance
      TriggeredBy = Upgrade_TurkiyePrecisionGuidance
    End
  End
End

