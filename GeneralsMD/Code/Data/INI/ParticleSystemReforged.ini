; The Scud's and the Tomahawk's nozzle flares. A slave's Size, SizeRate and SizeRateDamping are
; factors on its master's particle, and one flare is born per exhaust particle where that particle
; stands. EA's flare lived 10 frames and grew 25 a frame to about 150 across, and its orange smoke
; column hid most of it. Over the white ribbon above, bursting every frame, ten of them stacked
; into a white ball bigger than the launcher, left hanging in the air behind the missile, and the
; D3D11 bloom made it bigger still. Now each lives 3 frames like the small rockets' flares, about
; 16 (Scud) or 12 (Tomahawk) across, growing 1 a frame, so it sits on the nozzle.

