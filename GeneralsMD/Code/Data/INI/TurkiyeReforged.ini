; The Gozcu timi: 500 vision and a carbine that is for show. It is the eye on the ground that the
; Cobra no longer is: the best sight a 700 buys. The Pathfinder's camouflage is gone (ModuleTag_09):
; a hidden eye for guns that hit at 600 left the enemy nothing to shoot back at but the guns, so the
; spotter is a target now. The Maroon Beret, one at a time, is the camouflaged eye.
; A unit's sight is capped at half as far again as its weapon reaches (Object::look), which would
; leave this one 90; SpotterSight lifts the cap, and the Cobra, the Bayraktar and the Beret carry it.

ObjectReskin TurkiyeInfantrySpotter AmericaInfantryPathfinder
End

