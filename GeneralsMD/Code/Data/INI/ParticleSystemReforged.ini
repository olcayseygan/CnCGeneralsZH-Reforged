; Fires that burn in place, on the looping flame atlases (the fire flipbook above plays a burst once;
; these loop): ReforgedFlame is a wide bush of tongues, ReforgedFlameB one narrow teardrop tongue, both
; 64 frames of a simulated flame that loops without a seam. EA drew every one of these with additive
; cards (EXexplo03, EXFire01, EXfthrower02) rising and shrinking under the fire look, which lifts
; young flame to white; a wrecked tank's or a damaged building's fire was a pale glow that pulsed.
; Each card here stands still and upright, starts on a random frame and plays the loop, so the
; flame's motion is the simulation's; a few cards overlap at once (emission spread against the
; lifetime, which is EA's or shorter) and fade in and out so a card's coming and going does not pop.
; They are ALPHA drawn Emissive: the flame covers what is behind it and never adds up past its own
; colour. The flame's foot sits at 0.92 of the cell, so the card's centre is raised 0.42 of its size
; (VolLine at that height) and the flame stands on its bone rather than straddling it; the line runs
; along the bone's X for a little spread. Classic Graphics keeps EA's systems (an edit of EA's system
; is not read under it).
;
; TankFire is a tank that dies burning (FX_CrusaderCatchFire, EA's random second death on the
; Crusader, Paladin and kin, and the Quad Cannon's): seven seconds of fire on the hull, where EA's
; additive cards made the cream-white column of fx-ingame-final (overlord-blast: 253851 white texels
; over ten frames, 13145 with it hidden); its emitter is already on the hull roof, so its line sits at
; 2.5 rather than 0.42 of its size, which filmed with a gap of ground under the flame. SmolderingFire and its Tower, Large and Huge copies are the
; fire every really damaged vehicle and building shows on its Flame bones, each with a
; SmolderingFlameCore tongue on the same bone: the bush and a teardrop over it. FireFaction* are the
; building fires on the FireS, FireM and FireL bones, GLAPowerPlantFlame and GLATowerFlame the GLA's.
; FireSmallContinuous is EA's small ground fire and the Burnt Ground option's flames (which shrink it
; and darken its keys over its last second and a half), FireBurningBarricade* the burning props', the
; FireTree* a burning tree's, anchored lower since the bone is in the crown and kept a little thin.
ParticleSystem TankFire
  Shader = ALPHA
  Emissive = Yes
  FireLook = No
