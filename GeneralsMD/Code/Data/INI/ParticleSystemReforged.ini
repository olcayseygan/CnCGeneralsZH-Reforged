; fx-final (2026-11-14), filmed on Twilight Flame, the faults its frames showed.
;
; The tank gun's jet sat 8.6 behind its bone. Read off the models, the Overlord's Muzzle bone is 4.3
; ahead of its barrel's mouth and the Crusader's TurretMS and the Battlemaster's Muzzle sit on theirs,
; so on the Crusader most of the jet lay under its own barrel and only its tail showed. Born 4.6 ahead
; the root falls on the Overlord's mouth and 4.3 behind the Crusader's (its muzzle brake); the small
; guns' jet already read and is left. The fat yellow blob in front of the Crusader's gun is not a
; particle: it is EA's flash mesh (TURRETFX01, EXTnkMzl01) that the model shows for the recoil's first
; frames, centred 7.8 ahead of the mouth, 16 long and 9 tall.
; Round 5: with that mesh gone the jet alone was faint on the Crusader, half behind the shell. The
; card is 12.5 (the flame about 3 longer), born 6.3 ahead so its root stays where it was (0.86 of the
; card behind the centre), full alpha until it fades and three frames longer. Its colours are as they
; were, never white.
; Round 6: the jet card lies flat at the barrel's height, and seen barrels-on from the game camera
; its later frames, which burn down to lobes in the dull end colour, lay ahead of the Overlord's gun
; as orange patches on the ground, bigger than round 5's. Half way back: 11.5 (born 5.5 ahead, root
; unchanged), its old fifteen frames, near full alpha until frame 9.
; Round 7: still patches. Only the young jet shows now: full alpha and its bright colour for four
; frames, gone by frame 9, before the art's lobes and the dull end colour. The Crusader fires the same
; list as the Overlord (WeaponFX_GenericTankGunNoTracer names TankMuzzleFlare for both, and the list is
; in the checksum), so the two guns cannot get different jets here. Its size and place are set by the
; upright jet below (IsAlongEmitterAxis); the life and keys here still hold.
ParticleSystem TankMuzzleFlare
  Lifetime = 9.00 9.00
  Alpha2 = 1.00 1.00 4
  Alpha3 = 0.00 0.00 9
  Color2 = R:255 G:175 B:95 4
  Color3 = R:200 G:95 B:40 9
End

ParticleSystem HeroicTankMuzzleFlare
  Lifetime = 9.00 9.00
  Alpha2 = 1.00 1.00 4
  Alpha3 = 0.00 0.00 9
  Color2 = R:255 G:175 B:95 4
  Color3 = R:200 G:95 B:40 9
End

; The muzzle star's tongues were flat cards (IsGroundAligned, the only way a card points its root at
; the muzzle), and flat from the game camera they read as orange patches lying on the ground in front
; of the gun: small they were not seen, twice the size they were the patches (re-film, 2026-11-14).
; The ring of fire is upright billboards now: small fireball puffs (the fire v2 atlas, mirrored, one of
; four runs each) thrown out level in world axes, stopped hard (a quarter a frame kept), no gravity,
; so they sit at muzzle height, and burn out in about a quarter of a second. ALPHA drawn Emissive in
; the jet's colours, never white. The grey puffs still follow them.
;
; Round 3 filmed one orange ball ahead of and below the Overlord's mouth, for two reasons. A chain
; lays its burst at its master particle's birth place, and the master was the jet card, whose centre
; is born 4.6 ahead of the bone (its root, not its centre, is at the mouth): the ring sat about 9 ahead
; of the Overlord's mouth. And puffs 6 to 8 across on a ring of radius 4 overlap into one ball. The
; chain now hangs off the muzzle flash flame, otherwise off since the lobes went: one invisible
; particle (no size, no alpha) born on the barrel's line 2 behind the bone, which puts the ring 2.3
; ahead of the Overlord's mouth and 2 behind the Crusader's, on its muzzle brake; the small gun's on
; its bone, the Battlemaster's mouth. The jets feed nothing now. The puffs are 4.4 to 5.6 across on a
; ring of radius about 7 (small: 3.2 to 4 on about 5), so they read apart.
