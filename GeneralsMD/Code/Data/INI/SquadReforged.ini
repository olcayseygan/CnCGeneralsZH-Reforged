; Infantry squads, a prototype: every side's basic rifle and anti-tank soldier, the generals' too,
; trained as five men in one unit, the way C&C3 does it, under the soldier's own button and name.
; Specialists and heroes stay single, and so does every soldier that arrives some other way (a Troop
; Crawler, a paradrop, a tunnel, a map). Loaded after TalentsReforged.ini with INI_LOAD_MULTIFILE,
; so every reskin below copies its source as Balance, Fixes and the talents left it.
;
; The pattern is EA's Angry Mob. A squad is an invisible, invulnerable nexus (a reskin of
; GLAInfantryAngryMobNexus, through one of the two bases below) whose SpawnBehavior buds five
; members at its feet. The engine does the
; rest: clicking one member selects the whole squad (SpawnBehavior::computeAggregateStates), the
; squad wears one health bar summed over the members, orders reach the members through the
; selection and through MobMemberSlavedUpdate, which follows the nexus and takes its target, and
; when the last member dies the nexus goes with it (SpawnBehavior::onSpawnDeath). OneShot means a
; dead member is never replaced.
;
; Balance starts from the original unit split five ways: each member fires a weapon with a fifth of
; the damage (WeaponReforged.ini), and the squad costs and trains like one soldier. A fifth of the
; health is not neutral, because a squad loses firepower as its members fall, and the Ranger member
; carries 40 rather than 36 for it. Measured with equal-money armies (3600 a side, both start points,
; six seeds) against Crusaders, Battlemasters, Scorpions, Rebels, Red Guards, Toxin Tractors, Dragon
; Tanks, Gattling Tanks and Inferno Cannons, as enemy value destroyed per value lost against the same
; fight fought by the original soldier; the Missile Defender's fifth already trades like him.
; Veterancy needs a fifth of the experience per member, since each member only earns from its own
; kills and the squad shares the highest rank among them.
;
; The members are IGNORED_IN_GUI like mob members: no health bar of their own, no voice, and their
; deaths score nothing (Object::scoreTheKill); the killer of the last one takes the whole unit's
; experience and score through the nexus.
;
; Every squad after the plain Ranger's was generated from its soldier as the loaded data has it: a
; member reskins the soldier, with a fifth of its cost, health, experience, talent health and weapons
; (WeaponReforged.ini, the Reforged_Sq_ weapons); the nexus carries the soldier's name, portrait,
; voices, command set, price and build time, a harmless weapon at the reach of each of the soldier's
; (Reforged_SqNexus_), and the powers the command bar fires: capture, TNT and booby trap on the
; nexus alone, the laser-guided missile on the nexus and every member.
;
; This file lands in the multiplayer INI checksum.

; ==== Two nexus bases ============================================================================

; Every squad reskins one of these, never the Angry Mob nexus itself: squads reskinned from one
; source are equivalent (ThingTemplate::isEquivalentTo), and a squad equivalent to the mob was
; counted as an Angry Mob by the computer's teams and its build-button lookup. The second base
; keeps China's Tank Hunter squads apart from its Red Guard squads, so the barracks'
; QuantityModifier that makes a Red Guard press give two does not reach the Tank Hunter.

ObjectReskin ReforgedSquadNexus GLAInfantryAngryMobNexus
End

ObjectReskin ReforgedSquadNexusSingle GLAInfantryAngryMobNexus
End

; ==== Ranger Squad ================================================================================

ObjectReskin AmericaInfantryRangerSquadMember AmericaInfantryRanger
End

Object AmericaInfantryRangerSquadMember
  BuildCost          = 45               ; a fifth of the Ranger's 225, what tally and score count
  TransportSlotCount = 0
  ExperienceValue    = 4 4 8 12
  ExperienceRequired = 0 8 12 24        ; the Ranger's 0 40 60 120 over five
  KindOf             = +IGNORED_IN_GUI -SCORE -CAN_RAPPEL
  ; both sets, since the first set a reskin's patch states clears the copied ones. Flash-Bang
  ; Grenades switch a member to the upgraded set, the Ranger's with each weapon at a fifth. The
  ; Ranger's LockWeaponCreate holds the rifle until the squad's grenade button unlocks the slot.
  WeaponSet
    Conditions = None
    Weapon     = PRIMARY Reforged_RangerSquadRifle
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon     = PRIMARY Reforged_RangerSquadRifle
    Weapon     = SECONDARY Reforged_RangerSquadFlashBang
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI DEFAULT_SWITCH_WEAPON
    AutoChooseSources = SECONDARY FROM_SCRIPT FROM_AI
    WeaponLockSharedAcrossSets = Yes
  End
  ReplaceModule ModuleTag_03
    Body = ActiveBody ModuleTag_03_Squad
      MaxHealth     = 40.0              ; the Ranger's 180 over five is 36; the header says why more
      InitialHealth = 40.0
    End
  End
  ; the nexus captures for the squad (below); a member keeps the Ranger's modules, as a reskin
  ; must, but its capture stays paused for good, so five members never walk off to the building
  ; one by one and fight their own formation the whole way
  ReplaceModule ModuleTag_18
    Behavior = SpecialAbility ModuleTag_18_Squad
      SpecialPowerTemplate = SpecialAbilityRangerCaptureBuilding
      UpdateModuleStartsAttack = Yes
      InitiateSound = RangerVoiceCapture
      StartsPaused = Yes
    End
  End
  ReplaceModule ModuleTag_20
    Behavior = UnpauseSpecialPowerUpgrade ModuleTag_20_Squad
      SpecialPowerTemplate = SpecialAbilityBoobyTrap
      TriggeredBy = Upgrade_InfantryCaptureBuilding
    End
  End
  ; Talent 7B, the Ranger's +45 a fifth each: 250 for the squad of 200, where the copied module
  ; gave every member the full +45
  ReplaceModule ModuleTag_USATalent7B
    Behavior = MaxHealthUpgrade ModuleTag_USATalent7B_Squad
      TriggeredBy  = Upgrade_USATalent7B
      AddMaxHealth = 10.0
      ChangeType   = ADD_CURRENT_HEALTH_TOO
    End
  End
  ; to catch up with the squad when left behind, and on the march to win back a place in the formation:
  ; the nexus walks at the Ranger's own pace, so the walk alone could never close a gap. In an AI
  ; module of the member's own: a reskin shares its source's AI module data, so a bare Locomotor
  ; line here wrote the run into the Ranger's, and the next reskin of him met it as a set stated twice
  ReplaceModule ModuleTag_06
    Behavior = AIUpdateInterface ModuleTag_06_Squad
      AutoAcquireEnemiesWhenIdle = Yes
    End
    Locomotor = SET_NORMAL BasicHumanLocomotor
    Locomotor = SET_PANIC AngryMobPanicLocomotor
  End
  ; MustCatchUpRadius is the weapon's reach, not the mob's 40: a member shooting from its own spot
  ; more than 40 from the nexus counted as lost and walked back into formation, and the formation
  ; centres on where the nexus is going, which in a fight is the target. One member walked up to a
  ; Crusader that way and stood under its gun (MinTargetPitch), and the tank never fired again.
  AddModule
    Behavior = MobMemberSlavedUpdate ModuleTag_SquadMember
      MustCatchUpRadius     = 100
      NoNeedToCatchUpRadius = 15
      Squirrelliness        = 0.05
      CatchUpCrisisBailTime = 30
      ; slots three body radii apart where the mob's ten stand 2.2: five men two radii apart walked
      ; into each other whenever the line of march put two of them on neighbouring lanes
      FormationSpacing      = 3.0
    End
  End
End

ObjectReskin AmericaInfantryRangerSquad ReforgedSquadNexus
End

Object AmericaInfantryRangerSquad
  SelectPortrait     = SARanger_L
  ButtonImage        = SARanger
  UpgradeCameo1      = Upgrade_AmericaRangerFlashBangGrenade
  UpgradeCameo2      = Upgrade_AmericaAdvancedTraining
  UpgradeCameo3      = Upgrade_InfantryCaptureBuilding
  UpgradeCameo4      = Upgrade_AmericaChemicalSuits
  DisplayName        = OBJECT:Ranger
  CommandSet         = AmericaInfantryRangerCommandSet
  Side               = America
  BuildCost          = 225
  BuildTime          = 5.0
  VisionRange        = 100
  ExperienceValue    = 20 20 40 60      ; the Ranger's, paid out when the last member falls
  Prerequisites
    Object = AmericaBarracks
  End
  ; The squad's buttons sit on the nexus, the one object the command bar reads, so the grenade
  ; switch needs a secondary here too: a harmless one at the grenade's reach, which walks the nexus
  ; into throwing range while the members throw. The lock keeps the nexus on its rifle reach until
  ; the player switches, as the Ranger's LockWeaponCreate does.
  WeaponSet
    Conditions = None
    Weapon     = PRIMARY Reforged_RangerSquadNexusWeapon
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon     = PRIMARY Reforged_RangerSquadNexusWeapon
    Weapon     = SECONDARY Reforged_RangerSquadNexusFlashBang
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI DEFAULT_SWITCH_WEAPON
    AutoChooseSources = SECONDARY FROM_SCRIPT FROM_AI
    WeaponLockSharedAcrossSets = Yes
  End
  VoiceSelect        = RangerVoiceSelect
  VoiceMove          = RangerVoiceMove
  VoiceGuard         = RangerVoiceMove
  VoiceAttack        = RangerVoiceAttack
  VoiceTaskComplete  = RangerVoiceCaptureComplete
  SoundAmbient       = NoSound
  UnitSpecificSounds
    VoiceCreate              = RangerVoiceCreate
    VoicePrimaryWeaponMode   = RangerVoiceModeGun
    VoiceSecondaryWeaponMode = RangerVoiceModeFlashBang
  End
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_SquadFlashBang
      TriggeredBy = Upgrade_AmericaRangerFlashBangGrenade
    End
  End
  AddModule
    Behavior = LockWeaponCreate ModuleTag_SquadLock
      SlotToLock = PRIMARY
    End
  End
  ; Capture Building, the Ranger's three modules on the nexus. The nexus walks to the building and
  ; the members follow it in formation, then guard it while it works; it is invulnerable, so the
  ; capture breaks when the squad's last member dies or the player gives the squad another order.
  ; The members' own capture stays paused (above), so the order reaches one capturer.
  AddModule
    Behavior = SpecialAbility ModuleTag_SquadCapture
      SpecialPowerTemplate     = SpecialAbilityRangerCaptureBuilding
      UpdateModuleStartsAttack = Yes
      StartsPaused             = Yes    ; unpaused by the upgrade below
      InitiateSound            = RangerVoiceCapture
    End
  End
  AddModule
    Behavior = SpecialAbilityUpdate ModuleTag_SquadCaptureUpdate
      SpecialPowerTemplate = SpecialAbilityRangerCaptureBuilding
      StartAbilityRange    = 5.0
      UnpackTime           = 3000
      PreparationTime      = 20000
      PackTime             = 2000
      DoCaptureFX          = Yes
      AwardXPForTriggering = 15
    End
  End
  AddModule
    Behavior = UnpauseSpecialPowerUpgrade ModuleTag_SquadCaptureUnpause
      SpecialPowerTemplate = SpecialAbilityRangerCaptureBuilding
      TriggeredBy          = Upgrade_InfantryCaptureBuilding
    End
  End
  ; the Ranger's own pace rather than the mob's slower nexus, so the squad marches as fast as a Ranger
  ReplaceModule ModuleTag_03
    Behavior = AIUpdateInterface ModuleTag_03_Squad
      AutoAcquireEnemiesWhenIdle = Yes
    End
    Locomotor = SET_NORMAL BasicHumanLocomotor
    Locomotor = SET_WANDER BasicHumanLocomotor
    Locomotor = SET_PANIC BasicHumanLocomotor
  End
  ReplaceModule ModuleTag_05
    Behavior = SpawnBehavior ModuleTag_05_Squad
      SpawnNumber        = 5
      SpawnReplaceDelay  = 0
      SpawnTemplateName  = AmericaInfantryRangerSquadMember
      ExitByBudding      = Yes
      InitialBurst       = 5
      OneShot            = Yes          ; no replacements
      AggregateHealth    = Yes          ; one health bar, and the squad dies with its last member
      SlavesHaveFreeWill = No
    End
  End
End

