; ---- Turkiye's talents, ranks 6 to 10 ----

; FactionTurkiye's TalentSciences (PlayerTemplateReforged.ini) names these ten as the pairs 6A 6B to
; 10A 10B, so they are defined here, before that file is read. Cost 0 keeps them out of the
; general's powers; the rank science is the only gate against a forged message, so every card names
; it. IsGrantable No keeps a script from handing both cards of a row. The effects sit in
; TalentsReforged.ini, keyed on the upgrade a card grants, or on the science itself for 10B.

