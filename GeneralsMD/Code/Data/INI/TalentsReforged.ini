  ReplaceModule ModuleTag_08
    Behavior = FireWeaponWhenDeadBehavior ModuleTag_08_GLATalent
      DeathWeapon   = ScudStormDamageWeaponTalent
      StartsActive  = Yes
      ConflictsWith = Upgrade_GLAAnthraxBeta
    End
  End
  ReplaceModule ModuleTag_09
    Behavior = FireWeaponWhenDeadBehavior ModuleTag_09_GLATalent
      DeathWeapon   = ScudStormDamageWeaponUpgradedTalent
      StartsActive  = No
      TriggeredBy   = Upgrade_GLAAnthraxBeta
    End
  End
End

