; Zero Hour Reforged's own weapons, loaded right after Weapon.ini and before any object names one.
;
; BalanceReforged.ini and FixesReforged.ini edit weapons in place and cannot add one: a block for a
; name nobody defined is read and dropped. A weapon they hand to an object therefore has to exist
; before they load, and this file makes sure it does. A block for a name the loaded data already
; has is read and dropped, so the data's own definition always stands.
;
; This file lands in the multiplayer INI checksum.

; The Paladin's anti-personnel laser, the second PointDefenseLaserUpdate that BalanceReforged.ini
; gives every Paladin. It borrowed EA's WatchTowerMachineGun, which nothing else fires; with a
; Weapon.ini that leaves that one out the module got no weapon and the Paladin crashed the game at
; the first infantry in reach. These are EA's fields with BalanceReforged's changes on them.
Weapon Reforged_PaladinInfantryLaser
  PrimaryDamage          = 100.0
  PrimaryDamageRadius    = 0.0
  AttackRange            = 65.0
  DamageType             = LASER
  DeathType              = LASERED
  WeaponSpeed            = 999999.0
  ProjectileObject       = NONE
  RadiusDamageAffects    = ALLIES ENEMIES NEUTRALS
  DelayBetweenShots      = 250
  ClipSize               = 2
  ClipReloadTime         = 4000
  AcceptableAimDelta     = 180
  LaserName              = PointDefenseLaserBeam
  LaserBoneName          = LASER
  FireFX                 = WeaponFX_PaladinPointDefenseLaser
  VeterancyFireFX        = HEROIC WeaponFX_PaladinPointDefenseLaser
End

; Where a shot-down plane hits the ground. BalanceReforged.ini's Reforged_JetCrashImpact and
; Reforged_BigJetCrashImpact fire one of these once from the impact point and are gone; the fire
; that burns on after them is Reforged_JetCrashFireWeapon on Reforged_JetCrashFire. The crash
; objects belong to the plane's player (the OCL hands them its team), so a crash spares that
; player and its allies and hurts enemies and neutrals: a Supply Drop plane shot down over its own
; base used to wreck it. The fighter's blast plays FX_RaptorCrashExplosion, which EA named for a
; Raptor crash and never gave to anything. B-52s, B-3s, the cargo planes, the carpet bomber and
; the Spectre take the big one.
Weapon Reforged_JetCrashBlast
  PrimaryDamage          = 80.0
  PrimaryDamageRadius    = 35.0
  AttackRange            = 10.0
  DamageType             = EXPLOSION
  DeathType              = EXPLODED
  WeaponSpeed            = 99999.0
  ProjectileObject       = NONE
  FireFX                 = FX_RaptorCrashExplosion
  RadiusDamageAffects    = ENEMIES NEUTRALS
  DelayBetweenShots      = 0
  ClipSize               = 1
  ClipReloadTime         = 0
  AutoReloadsClip        = No
End

Weapon Reforged_BigJetCrashBlast
  PrimaryDamage          = 160.0
  PrimaryDamageRadius    = 70.0
  AttackRange            = 10.0
  DamageType             = EXPLOSION
  DeathType              = EXPLODED
  WeaponSpeed            = 99999.0
  ProjectileObject       = NONE
  FireFX                 = FX_SpectreHowitzerExplosion
  RadiusDamageAffects    = ENEMIES NEUTRALS
  DelayBetweenShots      = 0
  ClipSize               = 1
  ClipReloadTime         = 0
  AutoReloadsClip        = No
End

; EA's SmallFireFieldWeapon with the friendly side left out. The napalm fire fields keep EA's,
; which still burns every side.
Weapon Reforged_JetCrashFireWeapon
  PrimaryDamage          = 5.0
  PrimaryDamageRadius    = 30.0
  AttackRange            = 15.0
  MinimumAttackRange     = 10.0
  DamageType             = FLAME
  DeathType              = BURNED
  WeaponSpeed            = 600
  RadiusDamageAffects    = ENEMIES NEUTRALS
  DelayBetweenShots      = 250
End

