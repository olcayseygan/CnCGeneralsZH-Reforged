; Fires. ZH Enhanced draws every flame the same way: a flame born at full size that fades over
; thirty frames while it shrinks, rotated at random. Here that shape plays ReforgedFireLoop, 64
; frames of a licking flame in EXFire01's own colours, each flame from a frame of its own, in place
; of EA's still EXFire01, and in EA's keys: black, white on frame 9, black on 27 (EA's 5 and 15 of
; a 15 frame life, stretched to these 24 to 30). The texture's yellow is the brightest it reaches.
; The small fires that burn on damaged and dying things and on Burnt Ground (FireSmallContinuous),
; the building fires (FireBuildingSmall, FireSmall, FireLarge01), a damaged tank's (FireTankSmall).
; They live longer than EA's 15 frames, so they are born less often to keep the count. The
; smouldering ones keep EA's card and keys, out of the fire look list.
;
; TankFire, the flame of a tank that catches fire before it blows, takes the same flame at its own
; size (its block is beside the tank death smoke above) and carries a heat shimmer
; (ReforgedTankFireHeat, its slave) that rises off each flame.

