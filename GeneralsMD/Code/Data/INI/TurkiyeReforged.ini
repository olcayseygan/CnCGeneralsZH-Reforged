  RemoveModule SpyTag_1
  RemoveModule SpyTag_2
End

; The Kapalicarsi, Turkiye's black market: GLA's under a Turkish name, 2500, paying 20 every 2
; seconds as it does for GLA, open once a Factory stands. It sells the two bought upgrades whose
; modules the Turkish units carry from their sources: Countermeasures for the Bayraktar, the Akinci
; and the Kizilelma (the Comanche's, Aurora's and Raptor's flares and armour), and Worker Shoes for
; the engineers, who are the GLA Worker. GLA's other black market upgrades reach no Turkish unit.
; Its rebuild hole goes (ModuleTag_08): the hole sends a GLA Worker to put it back up, and Turkiye's
