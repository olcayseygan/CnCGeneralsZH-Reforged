; ---- tanks and cars keep EA's locomotors ----------------------------------------------------------
;
; From 2026-10-03 every ground vehicle had its own Acceleration, Braking and TurnRate here, for the
; eased drive in Locomotor::moveTowardsPositionVehicle. Players found tanks and cars slow against
; Zero Hour's, so they drive EA's treads and wheels on EA's Locomotor.ini numbers again and the lean,
; the suspension and an eased heading are drawn on top (Drawable::calcPhysicsXformGround).
; Scenarios/retailpace.txt has the timings.

; ---- jets taxi on a nose wheel ---------------------------------------------------------------------
;
; EA taxied every jet on treads with a Braking of 999999: it stopped dead off its landing roll and at
; every corner of the taxiway, spun on the spot to the next leg at 180 degrees a second, and spun again
; on its parking spot. On four wheels it drives the vehicle drive (Locomotor::isGroundVehicle), which
; is now the jet's alone:
; it brakes for a corner and rounds it, crawls round one too tight for its turning circle instead of
; spinning, and slows to a stop at the end of the taxi. Turning on its spot to its parking heading or
; onto the runway eases in and out (Locomotor::locoUpdate_moveTowardsAngle). Speed is EA's.
; Scenarios/jetrunway.txt has the numbers.

Locomotor BasicJetTaxiLocomotor
  Appearance          = FOUR_WHEELS ; EA: TREADS
  Braking             = 50          ; EA: 999999
  TurnRate            = 120         ; EA: 180
  TurnRateDamaged     = 120         ; EA: 180
End

; ---- missile defence: point defense lasers in clips, and a burst where they hit ------------------
;
; EA gave the Air Force General's King Raptor, Aurora, Stealth Fighter, B-3 and both Chinooks, the
; Boss Raptor, the Paladin, the Avenger and the Superweapon General's drone a point defense laser
; that burns down missiles near them. From 2026-10-03 to 2026-10-07 the aircraft dropped flares
; instead, fitted from birth; players did not want them, so nothing here touches an aircraft any
; more and EA's lasers fly again, at EA's rate and with no clip, and the Countermeasures upgrade is
; EA's again too.
;
; The Paladin and the Avenger keep their lasers in clips. From 2026-10-03 to 2026-10-06 they fired an
; invisible charge instead (LaserName emptied, a launch puff for FireFX); players lost the beam, so
; EA's beam, bone and fire FX are back and only the clip stays. The weapons keep their reach and the
; laser's damage, which a missile cannot survive. The point defense module counts the clip itself
; (PointDefenseLaserUpdate), since it fires a fresh copy of its weapon every shot.
;
; A missile picks its death by DeathType, the same three ways in every missile EA made: LASERED
; plays FX_GenericMissileDisintegrate and throws a scrap of debris (OCL_GenericMissileDisintegrate),
; DETONATED plays nothing (it is how a missile that reached its target leaves the world), and
; anything else plays a full Explosion with ExplosionSmoke, a grey cloud the size of a tank that
; stacked into a column under repeated intercepts. Every point defense laser keeps EA's LASERED and
; adds FX_PointDefenseLaserBurst as its ProjectileDetonationFX, which PointDefenseLaserUpdate plays
; where the target was: a flash bang with sparks over EA's red flash, and still no cloud.
;
; The Paladin's laser also burns down infantry that come within 65. A second laser with its own clip
; does that, so a Tank Hunter's missile and the Tank Hunter himself do not share one gun. That needs
; a second weapon and a MULTIFILE file cannot add one. It borrowed AirF_RaptorPointDefenseLaser,
; which the King Raptor fires again now, then EA's WatchTowerMachineGun, and with a Weapon.ini that
; leaves that one out the module had no weapon and the game crashed. It is
; Reforged_PaladinInfantryLaser in WeaponReforged.ini now, the Paladin's beam from its LASER bone
; and no burst.
;
; The Paladin's laser had already been slowed to one shot in two seconds, because at EA's one a
; second it shot down every Patriot missile: Paladins killed a Patriot four times of four for 0.28
; of its price. Two shots a quarter second apart and a four second reload is 0.47 shots a second
; against the laser's 0.5, spent in a pair; the Patriot duel was not run again. The numbers are in
; Scenarios/missiledefence.txt: the Avenger bursts fewer missiles than EA's and dies on the same
; frame, the Paladin's two fights did not move.

Weapon PaladinPointDefenseLaser
  DelayBetweenShots      = 250    ; EA: 1000
  ClipSize               = 2      ; EA: 0
  ClipReloadTime         = 4000
  ProjectileDetonationFX = FX_PointDefenseLaserBurst
End

Weapon AvengerPointDefenseLaserOne
  DelayBetweenShots      = 250    ; EA: 500
  ClipSize               = 4      ; EA: 0
  ClipReloadTime         = 3000
  ProjectileDetonationFX = FX_PointDefenseLaserBurst
End

Weapon AvengerPointDefenseLaserTwo
  DelayBetweenShots      = 250    ; EA: 500
  ClipSize               = 4      ; EA: 0
  ClipReloadTime         = 3000
  ProjectileDetonationFX = FX_PointDefenseLaserBurst
End

Weapon AirF_PointDefenseLaser
  ProjectileDetonationFX = FX_PointDefenseLaserBurst
End

Weapon AirF_RaptorPointDefenseLaser
  ProjectileDetonationFX = FX_PointDefenseLaserBurst
End

Weapon SupW_PointDefenseDroneLaserWeapon
  ProjectileDetonationFX = FX_PointDefenseLaserBurst
End

