; 40 to 55 across, an orange-grey column wider than the launcher. Each is a STREAK on EXJetSmoke
; now, for the reasons MissileExhaustTrail gives: one white ribbon with no gaps, 2.75 (Scud), 2
; (Tomahawk) or 1.4 (TOW) wide at the nozzle and about 12, 10 or 6 at the tail, warm for the
; first 8 frames, every number fixed so the ribbon does not come out lumpy. The head fades in over
; 3 frames, then the ribbon holds 0.8 to 0.55 opacity for most of its life so it reads white over
; sand rather than a thin grey wash. The Scud and the Tomahawk burst every frame instead of every
