; ==== The computer's single soldiers ==============================================================

; Every Barracks' rifle and anti-tank buttons train the squads now, and the skirmish AI's teams name
; the single soldiers, which ride Chinooks and Humvees and hold buildings and a squad does neither
; yet. A factory trains only what a button in its set names or reskins
; (BuildAssistant::findBuildButtonTemplate), so the set keeps a hidden SCRIPT_ONLY button for each
; (CommandSetReforged.ini) naming these copies. Only_By_AI keeps them from people: the group panel's
; build tray hides them and Player::canBuild refuses a human's order for one. Being reskins, they fill
; a team that names the soldier and count as him wherever a script counts.

ObjectReskin AmericaInfantryRangerAI AmericaInfantryRanger
End

Object AmericaInfantryRangerAI
  Buildable = Only_By_AI
End

ObjectReskin AmericaInfantryMissileDefenderAI AmericaInfantryMissileDefender
End

