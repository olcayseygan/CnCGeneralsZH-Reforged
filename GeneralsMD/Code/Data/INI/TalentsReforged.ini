; ---- 7A Altay +20% health: 620 to 744, stacking with the War Factory's armour pack ----

Object TurkiyeTankAltay
  AddModule
    Behavior = MaxHealthUpgrade ModuleTag_TurkiyeTalent7A
      TriggeredBy  = Upgrade_TurkiyeTalent7A
      AddMaxHealth = 124.0
      ChangeType   = ADD_CURRENT_HEALTH_TOO
    End
  End
End

; ---- 7B Bayraktar and Akinci +25% sight: 550 to 687.5 and 400 to 500 ----
; SightUpgrade sets both ranges outright, so it names both.

Object TurkiyeVehicleBayraktar
  AddModule
    Behavior = SightUpgrade ModuleTag_TurkiyeTalent7B
      TriggeredBy         = Upgrade_TurkiyeTalent7B
      VisionRange         = 687.5
      ShroudClearingRange = 687.5
    End
  End
End

Object TurkiyeJetAkinci
  AddModule
    Behavior = SightUpgrade ModuleTag_TurkiyeTalent7B
      TriggeredBy         = Upgrade_TurkiyeTalent7B
      VisionRange         = 500
      ShroudClearingRange = 500
    End
  End
End

