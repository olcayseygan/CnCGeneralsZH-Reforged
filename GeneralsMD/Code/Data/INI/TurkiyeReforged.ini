  ; (TireRotationMultiplier 0.38 = 1 / the tyre radius 2.64, so they roll without sliding). The
  ; locomotor stays the Paladin's tracked one, so the front tyres never steer and the truck turns in
  ; place as the Paladin does. The pods are modelled level, muzzles forward, the travel position;
  ; TurretPitch raises them to the FirePitch of 45. Each of the six rounds in a salvo leaves its own
  ; tube, TurretMS01 to 06 alternating between the pods. Laser is the Paladin's point-defence beam,
  ; from the cab roof. The Paladin's ModuleTag_01_Reforged is a W3DTankDraw, and a ReplaceModule
  ; must keep the class, so the old draw is removed and this one added.
  RemoveModule ModuleTag_01_Reforged
  AddModule
    Draw = W3DTruckDraw ModuleTag_01_Turkiye
      OkToChangeModelColor  = Yes
      StabilizedTurretPitch = Yes
      BarrelArtPitch        = 0.0
      ExtraPublicBone       = Laser
      DefaultConditionState
        Model               = TRSAKARYA
        Turret              = Turret01
        TurretPitch         = Barrel01
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponLaunchBone    = PRIMARY TurretMS
      End
      ConditionState        = REALLYDAMAGED
        Model               = TRSAKARYA_D
        Turret              = Turret01
        TurretPitch         = Barrel01
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponLaunchBone    = PRIMARY TurretMS
      End
      AliasConditionState   = RUBBLE
      TrackMarks            = EXTireTrack.tga
      Dust                  = ScudLauncherDust
      DirtSpray             = RocketBuggyDirtSpray
      PowerslideSpray       = RocketBuggyDirtPowerSlide
      LeftFrontTireBone     = Tire01
      RightFrontTireBone    = Tire04
      MidLeftRearTireBone   = Tire02
      MidRightRearTireBone  = Tire05
      LeftRearTireBone      = Tire03
      RightRearTireBone     = Tire06
      TireRotationMultiplier = 0.38
    End
  End
  ; It dies into its own wreck, not the Paladin's: the hulk, the launcher thrown off it, two wheels.
  ReplaceModule ModuleTag_05
    Behavior = SlowDeathBehavior ModuleTag_05_Turkiye
      DeathTypes               = ALL -CRUSHED -SPLATTED
      ProbabilityModifier      = 50
      DestructionDelay         = 500
      DestructionDelayVariance = 100
      FX                       = INITIAL FX_GenericTankDeathEffect
      FX                       = FINAL FX_GenericTankDeathExplosion
      OCL                      = FINAL OCL_TurkiyeSakaryaDeathEffect
    End
  End
  ReplaceModule ModuleTag_06
    Behavior = SlowDeathBehavior ModuleTag_06_Turkiye
      DeathTypes               = ALL -CRUSHED -SPLATTED
      ProbabilityModifier      = 50
      DestructionDelay         = 2000
      DestructionDelayVariance = 300
      FX                       = INITIAL FX_CrusaderCatchFire
      OCL                      = FINAL OCL_TurkiyeSakaryaDeathEffect
      FX                       = FINAL FX_GenericTankDeathExplosion
    End
  End
  ReplaceModule ModuleTag_14
    Behavior = CreateObjectDie ModuleTag_14_Turkiye
      DeathTypes   = NONE +CRUSHED +SPLATTED
      CreationList = OCL_TurkiyeSakaryaCrushEffect
    End
  End
  ReplaceModule ModuleTag_02
    Body = ActiveBody ModuleTag_02_Turkiye
    MaxHealth              = 300.0
    InitialHealth          = 300.0
    SubdualDamageCap = 1000
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
    End
  End
  ; The Paladin's turret fires level, and a rocket leaving it level never reached a target: the
  ; salvo went off and nothing was hit. It pitches up the way the Firtina's launcher does, and since
  ; the Paladin's barrel pitches (BalanceReforged.ini, whose AI module this replaces) the drawn
  ; launcher stands at the 45 degrees the rockets leave at.
  ReplaceModule ModuleTag_03_Reforged
    Behavior = AIUpdateInterface ModuleTag_03_Turkiye
      Turret
        TurretTurnRate = 180
        TurretPitchRate = 60
        FirePitch = 45
        AllowsPitch = Yes
        ControlledWeaponSlots = PRIMARY
      End
      AutoAcquireEnemiesWhenIdle = Yes
    End
  End
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_TurkiyeRange
      TriggeredBy = Upgrade_TurkiyeExtendedRange
    End
  End
  ; Inertial Guidance's mark, as on the Firtina
  AddModule
    Behavior = StatusBitsUpgrade ModuleTag_TurkiyeGuidance
      TriggeredBy = Upgrade_TurkiyePrecisionGuidance
    End
  End
End

