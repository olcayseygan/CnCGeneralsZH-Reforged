; ---- the nuke and the Scud Storm climb out of the picture -----------------------------------------
;
; Pulled all the way out, the camera sits 992 over the ground (MaxCameraHeight 310 times the 3.2 of
; W3DView.cpp's ZOOM_OUT_LIMIT_FACTOR) and looks down at 37.5 degrees. The top edge of the picture is
; a ray 14.7 degrees above that at 16:9 and 19.3 degrees above it at 4:3. A missile rising from the
; bottom edge of the screen leaves at the top once it is 668 over the ground at 16:9, 709 at 16:10,
; 778 at 4:3 and 802 at 5:4; from the middle of the screen 448 is enough at 16:9. EA's nuke flew at
; 500 and its Scud topped out at 634, so a silo low on the screen kept the whole flight in view. Both
; now climb about 900 before they turn, which clears 5:4 with a missile's length to spare, and the
; turn itself happens at 700 to 800, over the top edge at 16:9 and 16:10.
;
; The nuke goes straight up, across to a point 900 over the target (EA: 500) and straight down as
; before. It flies faster to keep its time: RelativeSpeed over ForwardDamping is its top speed, 30 a
; frame against EA's 20, and the stronger damping lines the flight up with the nose quickly enough
; that it no longer overshoots the point over a near target and loops back. It comes down at half
; that, 450 a second (EA: 300). The slow lift out of the silo, SpecialSpeedHeight and
; SpecialSpeedTime, is EA's.
;
; The Scud cruises at 900 instead of 240 and comes down the quarter sine of
; Locomotor::moveTowardsPositionThrust from 450 out instead of 200, about EA's shape at more than
; twice the height. Its locomotor is a new one because EA's SCUDStormMissileLocomotor also flies the
; Superweapon General's Tomahawk. The Locomotor line sits inside the ReplaceModule, where the new AI
; module has no set yet and takes it; outside it the set is already there (FixesReforged.ini says
; why) and the load stops.
;
; Scenarios/missileapex.txt, seed 1, times from the missile leaving the silo to impact:
;   nuke at 1442:   apex 500 to 907, 5.73 s to 5.67 s
;   nuke at 520:    apex 515 to 923, 4.20 s to 4.63 s
;   Scud at ~1730:  apex 634 to 973, 9.10 s to 9.15 s (mean of nine)
;   Scud at ~700:   apex 634 to 973, 6.06 s to 6.58 s

Locomotor SCUDStormMissileHighLocomotor
  Surfaces                  = AIR
  Speed                     = 400   ; EA's SCUDStormMissileLocomotor: 300
  SpeedDamaged              = 267   ; EA: 200
  MinSpeed                  = 100
  Acceleration              = 675
  Braking                   = 0
  TurnRate                  = 540
  MaxThrustAngle            = 45
  AllowAirborneMotiveForce  = Yes
  Appearance                = THRUST
  PreferredHeight           = 900   ; EA: 240
  PreferredHeightDamping    = 0.7
  ThrustRoll                = 0.06
  ThrustWobbleRate          = 0.008
  ThrustMinWobble           = -0.040
  ThrustMaxWobble           = 0.040
  CloseEnoughDist3D         = Yes
End

Object ScudStormMissile
  ReplaceModule ModuleTag_04
    Behavior = MissileAIUpdate ModuleTag_04_High
      TryToFollowTarget             = No
      FuelLifetime                  = 0
      InitialVelocity               = 0
      IgnitionFX                    = FX_ScudStormIgnition
      DistanceToTravelBeforeTurning = 750   ; EA: 500
      DistanceToTargetBeforeDiving  = 450   ; EA: 200
    End
    Locomotor = SET_NORMAL SCUDStormMissileHighLocomotor
  End
End

