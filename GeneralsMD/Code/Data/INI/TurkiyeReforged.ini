    End
    Locomotor = SET_NORMAL TurkiyeKarguDroneDiveLocomotor
  End
End

; The Alpagu operator's drone (TurkiyeInfantryAlpagu), a quadcopter: the Nuke Cannon's shell, so a
; Bezier path (DumbProjectileBehavior) and not a missile. The first inner point sits straight above
; the launch, 240 over the highest ground on the way at full range, so it leaves the ground going
; straight up: a fifth of the way in it is 107 up and only 25 along. The second sits 130 up and 65% of
; the way along, so the drone comes off its climb and dives down the line from there into the target
; with its speed on, arriving at 170 to 190 against the weapon's 155. HeightScaleDistance scales both
; heights with the shot's run along the ground, full at 350 and a third at 117, never under 35%
; (HeightScaleMinimum), so a near shot climbs less and dives at the angle a far one does: 46 degrees
; at 350, 45 from 250 down to 150, 47 at 110, 52 at 93 and 57 at 75. With the heights fixed it peaked
; at 143 at every range and fell almost straight down on anything close, a tall lob. It peaks at 143
; at 350, 102 at 250 and 50 point blank, still a climb straight up first. The old path put the second
; point straight over the target, and the drone ran out of sideways speed and stopped above its victim
; before dropping onto it. The flight takes 3.1 s at 350, 2.3 at 250, 1.0 at 100.
; FlightPathAdjustDistPerSecond is the hand controller: the path
; follows a moving target 30 a second, which keeps up with walking infantry and loses a vehicle at
; speed. PROJECTILE only, like a shell: nothing aims at it. No sound of its own. Its model TRALPAGUDRN
; spins its rotors on a loop. OrientToFlightPath No: the logic only moves it along the path, never
; turns it. That also drops the raised-barrel rule (calcFlightPath's launch slope applies only to a
; shell that orients), so the climb holds whatever way the launch bone points. The Quad lines in its
; Draw block fly it as a quad on screen alone: it turns its nose to where it is heading, dips it
; setting off and keeps it down at speed, banks into a sideways pull and, diving, points its nose
; down the path (QuadMaxDiveTilt), all read off how it moved from frame to frame. It climbs nearly
; level, leans about 24 degrees nose down crossing at full range, and hits nose down at 38 to 46
; degrees at every range. A faint grey streak hangs on its body
; (ReforgedAlpaguDroneTrail in ParticleSystemReforged.ini), drawn only, so the logic never sees it.

ObjectReskin TurkiyeAlpaguDrone NukeCannonShell
End

Object TurkiyeAlpaguDrone
  SoundAmbient = NoSound
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Turkiye
      OkToChangeModelColor = Yes
      DefaultConditionState
        Model         = TRALPAGUDRN
        Animation     = TRALPAGUDRN.TRALPAGUDRN
        AnimationMode = LOOP
        ParticleSysBone = None ReforgedAlpaguDroneTrail
      End
      QuadMaxTilt     = 35   ; degrees, the most it ever leans
      QuadTiltGravity = 400  ; an acceleration of 400 a second squared leans it 45 degrees
      QuadTiltDrag    = 1.0  ; a steady speed leans it as an acceleration of that speed times this would
      QuadTiltTime    = 120  ; ms for the speed and the lean to follow
      QuadYawTime     = 300  ; ms for the nose to come round to the heading
      QuadMaxDiveTilt = 60   ; degrees; coming down, the nose follows the path down as far as this
    End
  End
  ReplaceModule ModuleTag_04
    Behavior = DumbProjectileBehavior ModuleTag_04_Turkiye
      FirstHeight                   = 240
      SecondHeight                  = 130
      HeightScaleDistance           = 350
      HeightScaleMinimum            = 35%
      FirstPercentIndent            = 0%
      SecondPercentIndent           = 65%
      OrientToFlightPath            = No
      FlightPathAdjustDistPerSecond = 30
    End
  End
End

