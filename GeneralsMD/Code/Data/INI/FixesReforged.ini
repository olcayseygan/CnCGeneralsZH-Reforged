; ==== Rangers of the right general ================================================================

; Paradrop and the Particle Uplink's rubble gave the three American generals the plain USA
; Ranger. They now use the per-general lists in ObjectCreationListReforged.ini.

Object AirF_AmericaCommandCenter
  ReplaceModule ModuleTag_22
    Behavior = OCLSpecialPower ModuleTag_22_Fix
      SpecialPowerTemplate        = SuperweaponParadropAmerica
      UpgradeOCL                  = SCIENCE_Paradrop3 AirF_SUPERWEAPON_Paradrop3
      UpgradeOCL                  = SCIENCE_Paradrop2 AirF_SUPERWEAPON_Paradrop2
      OCL                         = AirF_SUPERWEAPON_Paradrop1
      CreateLocation              = CREATE_AT_EDGE_NEAR_SOURCE
      OCLAdjustPositionToPassable = Yes
    End
  End
End

