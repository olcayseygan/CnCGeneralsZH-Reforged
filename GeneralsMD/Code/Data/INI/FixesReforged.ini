; ==== Scud Storm exploit ==========================================================================

; Every storm carried its missiles in PRIMARY, and a storm could be made to fire them before its
; timer was up. The weapon moves to SECONDARY on all seven storms that share
; SUPERWEAPON_ScudStorm, and ObjectCreationListReforged.ini points the power at that slot.
; The door is the weapon chooser: an attack on the ground, and an attack no slot is allowed to
; answer, both fall back to PRIMARY whatever AutoChooseSources says, so an empty PRIMARY is what
; closes it.
;
; The pad's draw module named its launch bone and its missile feedback for PRIMARY only, so from
; SECONDARY the nine missiles left the building's origin flat along its facing, flew 500 at ground
; height and all ended on the first thing in the way. Each storm's draw module is EA's with
; WeaponLaunchBone and ProjectileBoneFeedbackEnabledSlots on SECONDARY and the firing aliases on
; FIRING_B and BETWEEN_FIRING_SHOTS_B. The seven are the same module.

