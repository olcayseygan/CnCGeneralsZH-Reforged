; Zero Hour Reforged's Apocalypse mode: the zombies its director sends, loaded after
; TalentsReforged.ini with INI_LOAD_OVERWRITE, so every name here is new and is defined whole:
; locomotors and weapons first, then the objects that name them.
;
; The walker and the runner share one model on the Angry Mob pistol man's UIMOB01_SKL, so the mob's
; deaths and flails drive them, each on its own sheet: the zombie raw red, the runner a brighter fresh
; red. None is a ZHCA sheet, so they stay red whichever player owns them. The zombie's shamble, idle
; sway and claw are its own animations (ZBZOMB_WKA, ZBZOMB_STA, ZBZOMB_ATA); the runner runs on the
; mob's run. The brute has his own model on our Heavy rig since batch 2.
;
; A walk animation's number is the ground one played file covers, so the feet do not slide: the
; shamble covers 9.9 (9.6 in its 32 frame cycle), the mob run 17.9 measured off the file; a scaled
; model's number is its file's times its Scale.
;
; The claw lands at frame 15 of the 30 frame ZBZOMB_ATA loop. Each weapon's PreAttackDelay is that
; moment at the speed its draw plays the loop, and its DelayBetweenShots the loop's length, so every
; hit lands on a swing. SMALL_ARMS, not MELEE: the retail armours take nothing from MELEE on a vehicle
; or a building, and a wave has to wear both down.
;
; Nobody builds these: no cost, no prerequisite, no command set names them, and Side is Civilian so
; no faction's menus list them. Whoever the director gives them to owns them.
;
; The roster (docs/plans/APOCALYPSE-ZOMBIES.md) is scaled to this walker: a type's health is the
; plan's number times 2.2 and its damage a second times 2, so the plan's ratios hold. ExperienceValue
; is 10 a threat point for reading; the general's skill points for a kill come from the director
; (APOCALYPSE_SKILL_PER_POINT in ApocalypseDirector.h), one number for every type. Each new type is
; its own model: Man types on UIMOB01_SKL with our own clips, the Carrion Bat and the Screecher on our
; own ZBWING_SKL. A flyer is AIRCRAFT and VEHICLE, since an anti-air gun aims only at an airborne
; vehicle or infantryman (WeaponSet.cpp), and falls when it dies: no locomotor works for the dead
; unless it says LocomotorWorksWhenDead.
;
; Order inside: locomotors, armours, effects, weapons and their projectiles, then the objects. An
; armour or a weapon is looked up by name as an object is read, so it has to come first.
;
; This file lands in the multiplayer INI checksum.

