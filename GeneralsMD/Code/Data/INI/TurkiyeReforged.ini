  ; the weekly market. A steel frame on a paved plinth, a barrel-vaulted nave over a clerestory band
  ; between two lower monopitch aisles, the columns, fascias and gutters in team colour, market
  ; tables under team tarps in the open +X aisle, roller shutters along the closed -X loading side, a
  ; plain board over the entrance steps. TRKAPALI and its damaged, burning and rubble states
  ; TRKAPALI_D, _E and _R, and the construction scaffold TRKAPALI_SC in Code/Data/Art/W3D, the
  ; TRKapali_*.tga and ZHCA_TRKapali.tga textures in Code/Data/Art/Textures. Two draw modules take
  ; the place of retail's three: night and snow draw the day model, construction sinks the hall into
  ; the ground as retail's does with the delivery van (VAN) hidden until it is finished, and the
  ; scaffold stands at full height round it. The GLA rugs, banners and tents go. Fortified
