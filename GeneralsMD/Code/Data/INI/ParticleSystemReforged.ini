; White exhaust behind the rockets that EA drew as a thin additive streak and nothing else: the Tank
; Hunter's and the Missile Defender's, the Comanche's and Raptor's pods, the Patriot. The streak
; already spends its one slave on the lens flare, so the smoke hangs off the flare (ParticleSys.cpp
; feeds a slave's slave from the master's particle). BurstCount is the points laid along the path
; between two bursts of the streak. The name holds no "smoke", so -smoke leaves it alone.
;
; It started as a grey cloud 6 to 9 across growing to about 30, which read as a smoke screen
; behind every rocket. Billboarded puffs small enough to read as a line came apart into beads: a
; Patriot covers 27 between two feeds, and a puff 3 across cannot close that. So it is a STREAK
; now, a ribbon drawn through its points, and the gaps are gone whatever the speed. EXCloud01 is a
; grey texture (130 of 255 under its alpha), so white on it drew grey; EXJetSmoke, the strip EA
; drew the jets' smoke with, is white (255). Its drift matches MissileExhaust's, so the ribbon stays
; on the fire line instead of rising off it as the puffs did at 0.15 a frame. A ribbon casts no
; smoke shadow on the ground.
;
; Every number below is fixed rather than a range: a ribbon takes its width and opacity from each
; point, so a random size or alpha per point draws a lumpy line. 1.2 wide at the nozzle, 4.6 at 36
; frames. EXJetSmoke's alpha across the strip is a broad hump (5% at the edge, 25% an eighth in, 75%
; in the middle), so a wide ribbon read as a faint grey slab around the fire line; this one is
; narrow enough that the slab is the line. The newest point is transparent and the ribbon reaches
; full opacity at frame 3, so the head fades in behind the fire line instead of ending in a square
; cut. Peak 0.45 rather than 0.8: six Tank Hunters' ribbons on top of each other came out as one
; solid white bar. MissileExhaust and HeroicMissileExhaust below feed it every frame, so it bends
; every 7.5 units of a 225-a-second rocket's path instead of every 15. BurstCount 2 laid a second
; point on the straight line between feeds and could never round a corner, so it is 1.
; WEAPON_EXPLOSION is the lowest priority there is, so near the particle cap, or under dynamic LOD
; once the frame rate drops below 25, this ribbon is the first to go and the streak and its flare stay.

ParticleSystem MissileExhaustTrail
