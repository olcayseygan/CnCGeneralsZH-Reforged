; ---- GLA 9A Rebel Ambush +4 Rebels, 9B Anthrax Bomb area +25% (all four generals) ----
; Power cards on every GLA Command Center (ObjectCreationListReforged.ini has the lists). EA's
; modules restated whole with the talent's lines on top; a line is inert for anyone without its
; science, and without the power's own tier the card adds nothing. The Toxin and Demolitions
; Command Centers carry the plain ambush, which the computer buys and fires, beside their own
; (FixesReforged.ini's ModuleTag_11Chem_Fix and ModuleTag_11Demo_Fix); both get the card.

Object GLACommandCenter
  ReplaceModule ModuleTag_11
    Behavior = OCLSpecialPower ModuleTag_11_GLATalent
      SpecialPowerTemplate        = SuperweaponRebelAmbush
      UpgradeOCL                  = SCIENCE_GLATalent9A SCIENCE_RebelAmbush3 SUPERWEAPON_RebelAmbushTalent3
      UpgradeOCL                  = SCIENCE_GLATalent9A SCIENCE_RebelAmbush2 SUPERWEAPON_RebelAmbushTalent2
      UpgradeOCL                  = SCIENCE_GLATalent9A SUPERWEAPON_RebelAmbushTalent1
      UpgradeOCL                  = SCIENCE_RebelAmbush3 SUPERWEAPON_RebelAmbush3
      UpgradeOCL                  = SCIENCE_RebelAmbush2 SUPERWEAPON_RebelAmbush2
      OCL                         = SUPERWEAPON_RebelAmbush1
      CreateLocation              = CREATE_AT_LOCATION
      OCLAdjustPositionToPassable = Yes
    End
  End
  ReplaceModule ModuleTag_13
    Behavior = OCLSpecialPower ModuleTag_13_GLATalent
      SpecialPowerTemplate = SuperweaponAnthraxBomb
      UpgradeOCL           = SCIENCE_GLATalent9B SUPERWEAPON_AnthraxBombTalent
      OCL                  = SUPERWEAPON_AnthraxBomb
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    End
  End
End

