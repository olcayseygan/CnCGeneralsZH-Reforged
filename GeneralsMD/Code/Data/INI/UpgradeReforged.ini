; Zero Hour Reforged upgrade fixes, loaded after Upgrade.ini. An upgrade named here is edited in
; place, so a block holds only the fields that change; a new name is added.
;
; This file lands in the multiplayer INI checksum.

; EVA has a line for each of these three and nothing plays it: the upgrade names no ResearchSound
; and falls back to the generic "upgrade complete".

Upgrade Upgrade_AmericaMOAB
  ResearchSound = EvaUSA_UpgradeMoab
End

Upgrade Upgrade_AmericaSentryDroneGun
  ResearchSound = EvaUSA_UpgradeSentryDrone
End

Upgrade Upgrade_ChinaNeutronShells
  ResearchSound = EvaChina_UpgradeNeutronShell
End

