; ----------------------------------------------------------------------------------------------
; Beta layers (2026-11-21). The owner compared the leaked Generals beta (builds 115 to 225) with
; Zero Hour and wanted two of its looks on top of retail's, not instead of it. Both ride a slave
; chain, since the FXLists that would place them are in the multiplayer checksum: every system
; down the chain is laid at each particle of the master, in its own look, size and velocity.
;
; GLA light vehicle deaths (FX_BuggyNewDeathExplosion, the Demolition General's copy, and the
; Technical's and Rocket Buggy's landing after an air death): EA's orange glow ring and fireball
; stay, and the beta's ground ring of grey-brown dust (its BuggyNewExplosionShockwave, 200 cards for
; 200 frames) races out under them, with the beta's dirty smoke ball on top (its
; BuggyNewAirDeathSubExplosionSmoke: small EXSmokePuf07 puffs going cream to soot). EA's buggy
; smoke lays ten cards and the landing smoke five to nine, each feeding this chain: fifteen ring
; cards and six puffs a feed, so 75 to 150 ring cards where the beta had 200, and 30 to 60 puffs
; where it had 75 to 135. Each card fades out on a frame of its own, as in the beta, whose cards
; ran from a third of a second to seven (ring) and ten (smoke) seconds: here both run from one to
; three seconds.

ParticleSystem BuggyNewExplosionFlameSlave
  SlaveSystem = ReforgedBuggyDustRing
End

