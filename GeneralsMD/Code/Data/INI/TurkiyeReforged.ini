Object TurkiyeVehicleBayraktar
  Side       = Turkiye
  DisplayName = OBJECT:TurkiyeVehicleBayraktar
  RemoveModule ModuleTag_TrainingParts
  BuildCost  = 900
  BuildTime  = 14.0
  VisionRange         = 550
  ShroudClearingRange = 550
  SpotterSight        = Yes
  CommandSet = TurkiyeAircraftCommandSet
  Prerequisites
    Object = TurkiyeAirfield
  End
  ; Fuel Cell raises CRATEUPGRADE_ONE, more munitions per sortie; Swarm Software raises
  ; PLAYER_UPGRADE, munitions that pick the dearest target in reach. A helicopter has no fuel, so its
  ; time over the target is its rack.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarMunition
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = CRATEUPGRADE_ONE
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarMunitionFuel
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarSwarm
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE CRATEUPGRADE_ONE
    Weapon = PRIMARY TurkiyeBayraktarGun
    PreferredAgainst = PRIMARY INFANTRY
    Weapon = SECONDARY TurkiyeBayraktarSwarmFuel
    PreferredAgainst = SECONDARY VEHICLE STRUCTURE
  End
  ReplaceModule ModuleTag_04
    Body = ActiveBody ModuleTag_04_Turkiye
    MaxHealth              = 180.0
    InitialHealth          = 180.0
    End
  End
  ; Its own model, the TB2 off its three-view: a slim pod with the camera ball under the nose, a
  ; long straight wing on top, two thin booms and the inverted V tail joining over the pusher
  ; propeller. TRBAYRAKTAR, its damaged state TRBAYRAKTAR_D, the wreck TRBAYRAKTAR_D1 and the
  ; thrown blade TRBAYRAKTAR_D2 in Code/Data/Art/W3D; ZHCA_TRBayraktar*.tga and TRBayraktar_*.tga in
  ; Code/Data/Art/Textures. The bones keep the Comanche's names at the TB2's own places, so the
  ; Comanche's logic finds them and the shots leave where this model puts them:
  ; the loop spins the propeller on PROPELLER01, the death bursts it there and SPECIAL_DAMAGED hides
  ; its mesh PROP. The gun's fire comes off the camera ball (Muzzle01), the munitions leave from
  ; under the wings (WeaponA01). The Comanche's MissileUpgrade has no counterpart: the TB2 always
  ; carries its four.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Turkiye
      DefaultConditionState
        Model             = TRBAYRAKTAR
        Animation         = TRBAYRAKTAR.TRBAYRAKTAR
        AnimationMode     = LOOP
        WeaponFireFXBone  = PRIMARY Muzzle
        WeaponFireFXBone  = SECONDARY WeaponA
        WeaponLaunchBone  = SECONDARY WeaponA
      End
      ConditionState      = REALLYDAMAGED
        Model             = TRBAYRAKTAR_D
        Animation         = TRBAYRAKTAR_D.TRBAYRAKTAR_D
        AnimationMode     = LOOP
      End
      ConditionState      = RUBBLE
        Model             = TRBAYRAKTAR_D
        Animation         = TRBAYRAKTAR_D.TRBAYRAKTAR_D
        AnimationMode     = LOOP
      End
      ConditionState      = RUBBLE SPECIAL_DAMAGED
        Model             = TRBAYRAKTAR_D
        Animation         = TRBAYRAKTAR_D.TRBAYRAKTAR_D
        AnimationMode     = LOOP
        HideSubObject     = PROP
      End
      OkToChangeModelColor = Yes
    End
  End
  ; The Comanche's death with the drone's own pieces: the smoke trail off the engine, its own blades
  ; thrown where it hits and its own wreck left. The Comanche's values otherwise, its pilot ejection
  ; included (whether a drone should eject a pilot is the owner's call).
  ReplaceModule ModuleTag_08
    Behavior = HelicopterSlowDeathBehavior ModuleTag_08_Turkiye
      DestructionDelay                = 99999999
      SpiralOrbitTurnRate             = 140.0
      SpiralOrbitForwardSpeed         = 350.0
      SpiralOrbitForwardSpeedDamping  = .9999
      MaxBraking                      = 190
      SoundDeathLoop                  = ComancheDamagedLoop
      MinSelfSpin                     = 100
      MaxSelfSpin                     = 300
      SelfSpinUpdateDelay             = 100
      SelfSpinUpdateAmount            = 10
      FallHowFast                     = 12.0%
      MinBladeFlyOffDelay             = 1500
      MaxBladeFlyOffDelay             = 1500
      AttachParticle                  = SootySmokeTrail
      AttachParticleBone              = Propeller02
      BladeBoneName                   = Propeller01
      OCLEjectPilot                   = OCL_EjectPilotViaParachute
      FXBlade                         = FX_HelicopterBladeExplosion
      OCLBlade                        = OCL_HelicopterBladeExplosion
      FXHitGround                     = FX_HelicopterHitGround
      OCLHitGround                    = OCL_TurkiyeBayraktarHitGround
      FXFinalBlowUp                   = FX_GroundedHelicopterBlowUp
      OCLFinalBlowUp                  = OCL_GroundedHelicopterBlowUp
      DelayFromGroundToFinalDeath     = 1500
      FinalRubbleObject               = TurkiyeBayraktarHulk
    End
  End
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_TurkiyeFuelCell
      TriggeredBy   = Upgrade_TurkiyeFuelCell
      WeaponSetFlag = CRATEUPGRADE_ONE
    End
  End
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_TurkiyeSwarmSoftware
      TriggeredBy   = Upgrade_TurkiyeSwarmSoftware
      WeaponSetFlag = PLAYER_UPGRADE
    End
  End
  ; Inertial Guidance's mark, as on the Firtina
  AddModule
    Behavior = StatusBitsUpgrade ModuleTag_TurkiyeGuidance
      TriggeredBy = Upgrade_TurkiyePrecisionGuidance
    End
  End
  ; Lazer Isaretleme: what the drone attacks, out to its sight, counts as radar coverage
  AddModule
    Behavior = RadarCoverageBehavior ModuleTag_TurkiyeLaserDesignation
      Radius           = 550
      PaintsTargetOnly = Yes
      RequiredUpgrade  = Upgrade_TurkiyeLaserDesignation
      ClassifyUpgrade  = Upgrade_TurkiyeTargetClassification
    End
  End
End

