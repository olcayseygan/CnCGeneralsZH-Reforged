; Zero Hour Reforged's Turkey faction, loaded after FixesReforged.ini with INI_LOAD_MULTIFILE.
;
; Every Turkey object is an ObjectReskin of an existing one, followed by a patch block on the new
; name. The reskin copies the source template whole, as Balance and Fixes left it, and the patch
; then sets Side = Turkey and whatever the plan (docs/plans/TURKIYE-FRAKSIYON-KONSEPT.md in the
; workspace, section 5) changes: cost, build time, health, vision, the weapon set and the command
; set. The weapons are new and live in TurkeyWeaponReforged.ini, which loads before every object.
;
; A reskin counts as its source wherever the engine asks ThingTemplate::isEquivalentTo: a Turkey
; War Factory meets a prerequisite that names AmericaWarFactory, and a Turkey factory asked for an
; America-named unit by the skirmish scripts makes the Turkey one its button names
; (BuildAssistant::findBuildButtonTemplate). That is what lets a Turkey AI run the SkirmishAmerica
; scripts unchanged, so the units the scripts ask for by name are reskins of exactly those American
; units: Mehmetcik of the Ranger, Altay of the Crusader, Firtina of the Tomahawk and so on. The few
; that are not (the engineer, the supply truck, the radar tower, the anti-air site, the mine) the AI
; reaches through the dozer and harvester scans or its build list.
;
; ThingFactory::newObject turns any object made for a Turkey player into the one Turkey reskin of
; it, so there is never more than one Turkey reskin of a source template.
;
; These are placeholders: the source models, voices and cameos under Turkish names.
;
; This file lands in the multiplayer INI checksum.

; ==== Buildings ===================================================================================

ObjectReskin TurkeyCommandCenter AmericaCommandCenter
End

Object TurkeyCommandCenter
  Side       = Turkey
  DisplayName = OBJECT:TurkeyCommandCenter
  CommandSet = TurkeyCommandCenterCommandSet
  ; the Rank 1 minefield (ScienceReforged.ini, SpecialPowerReforged.ini)
  AddModule
    Behavior = OCLSpecialPower ModuleTag_TurkeyMinefield
      SpecialPowerTemplate = SuperweaponTurkeyMinefield
      OCL                  = SUPERWEAPON_TurkeyMinefield
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    End
  End
  ; Rank 3: one loitering munition on the dearest target in a small circle, and the radar blackout
  AddModule
    Behavior = SwarmStrikeSpecialPower ModuleTag_TurkeySwarmMunition
      SpecialPowerTemplate = SuperweaponTurkeySwarmMunition
      Radius               = 150
      TargetCount          = 1
      Weapon               = TurkeySwarmMunitionWeapon
      TargetFX             = WeaponFX_ComancheAntiTankMissileDetonation
    End
  End
  AddModule
    Behavior = RadarJamSpecialPower ModuleTag_TurkeyElectronicBlinding
      SpecialPowerTemplate = SuperweaponTurkeyElectronicBlinding
      Radius               = 300
      Duration             = 30000
      FX                   = WeaponFX_EMPPulseImpact
    End
  End
  ; Rank 5: the swarm, one munition on each of the ten dearest targets in a wide circle
  AddModule
    Behavior = SwarmStrikeSpecialPower ModuleTag_TurkeySwarmStrike
      SpecialPowerTemplate = SuperweaponTurkeySwarmStrike
      Radius               = 400
      TargetCount          = 10
      Weapon               = TurkeySwarmStrikeWeapon
      TargetFX             = WeaponFX_ComancheAntiTankMissileDetonation
    End
  End
End

