; ---- tank guns pitch onto their target -----------------------------------------------------------
;
; The shell flew the line, but EA's tank turrets only turn, so the barrel stayed level and the shell
; left the muzzle at an angle to it: 13 degrees down at a Dozer 28 away, and a target on a ridge
; was shot at by a barrel pointing at the ridge's foot. The turret now pitches, 120 degrees a second
; and down to the 15 below that the gun's own MinTargetPitch allows, and AimFromMuzzle lays the
; barrel on the line from its muzzle to the middle of the target, the line the shell flies. The
; drawn barrel pitches on TurretPitch: the Scorpion has an elevation bone (TurretEl, TurretEl01 on
; the big turret); the Crusader, Paladin and Battlemaster pitch the barrel bone that also recoils.
; StabilizedTurretPitch holds the drawn barrel on that line while the drawn hull tilts on the ground
; and rocks with each shot, which the logic's hull never does. BarrelArtPitch is the angle the barrel
; is modelled at against level, read off the mesh: AVLeopard's rises 4.4 degrees, AVPaladin's 3.4
; (bone 5 up, mesh 1.6 down in it); the Battlemaster's, the Scorpion's and the laser Crusader's lie
; within half a degree of level.
;
; The Overlord, the Emperor and the Marauder keep a level gun. Each has a turret with two barrels on
; two bones (the Marauder's after its second upgrade), and a turret pitches one bone.

Object AmericaTankCrusader
  ReplaceModule ModuleTag_01
    Draw = W3DTankDraw ModuleTag_01_Reforged
      StabilizedTurretPitch = Yes
      BarrelArtPitch        = 4.4
      DefaultConditionState
        Model               = AVLeopard
        Turret              = Turret
        TurretPitch         = Barrel01
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY TurretFX
        WeaponLaunchBone    = PRIMARY TurretMS
      End
      ConditionState        = REALLYDAMAGED
        Model               = AVLeopard_D
      End
      ConditionState        = RUBBLE
        Model               = AVLeopard_D
      End
      TrackMarks              = EXTnkTrack.tga
      TreadAnimationRate      = 2.0
      TreadDriveSpeedFraction = 0.3
      TreadPivotSpeedFraction = 0.6
      OkToChangeModelColor    = Yes
    End
  End
  ReplaceModule ModuleTag_03
    Behavior = AIUpdateInterface ModuleTag_03_Reforged
      Turret
        TurretTurnRate        = 180
        TurretPitchRate       = 120
        AllowsPitch           = Yes
        AimFromMuzzle         = Yes
        MinPhysicalPitch      = -15
        ControlledWeaponSlots = PRIMARY
      End
      AutoAcquireEnemiesWhenIdle = Yes
    End
  End
End

