; Zero Hour Reforged ranks, loaded after Rank.ini. A rank number Rank.ini already has is edited in
; place; a new one has to be the next number.
;
; Ranks 6 to 10 are the talent ranks: no general's points, one talent pick each, the cards named in
; each general's TalentSciences (PlayerTemplate). A card asks for its rank's science.
;
; This file lands in the multiplayer INI checksum.

