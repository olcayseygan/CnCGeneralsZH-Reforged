; ==== Plane crashes ===============================================================================

; A plane shot down hit the ground with a flash and a few flying parts and hurt nobody. Where it
; lands now it blows up and the spot burns on for six seconds, flames and smoke, setting alight
; any enemy or neutral that stands in it. The crash objects take the plane's team, so its own
; player and allies are spared. A fighter's crash is Reforged_JetCrashImpact (80 EXPLOSION
; across 35) and one Reforged_JetCrashFire (EA's napalm fire field kept burning longer); a big
; plane's is Reforged_BigJetCrashImpact (160 across 70) and four of those fires laid along its line
; of flight, 30 apart. The objects are in BalanceReforged.ini, the blasts in WeaponReforged.ini.
;
; A fighter's crash goes only on a list it plays after coming down out of the air, never on the one
; it plays when killed parked or taxiing: one dead jet on an airfield would otherwise set off every
; jet parked beside it. For the Raptor and the MiG that is EA's hit-ground list. The A-10 and the
; Spectre share EA's A-10 hit-ground debris, so theirs goes on the final blow-up 200 ms after the
; hit, which they play only after a fall. The Aurora, the Stealth Fighter and the big planes had
; no hit-ground list and get the two new ones below from BalanceReforged.ini. EA's debris and hulks
; in the four lists are unchanged.

ObjectCreationList OCL_Reforged_JetCrash
  CreateObject
    ObjectNames = Reforged_JetCrashImpact
    Disposition = ON_GROUND_ALIGNED
  End
  CreateObject
    ObjectNames = Reforged_JetCrashFire
    Disposition = ON_GROUND_ALIGNED
  End
End

; The offsets turn with the plane, so the four fires lie along the fuselage whichever way it fell.
ObjectCreationList OCL_Reforged_BigJetCrash
  CreateObject
    ObjectNames = Reforged_BigJetCrashImpact
    Disposition = ON_GROUND_ALIGNED
  End
  CreateObject
    ObjectNames = Reforged_JetCrashFire
    Offset      = X:-45.0 Y:0.0 Z:0.0
    Disposition = ON_GROUND_ALIGNED
  End
  CreateObject
    ObjectNames = Reforged_JetCrashFire
    Offset      = X:-15.0 Y:0.0 Z:0.0
    Disposition = ON_GROUND_ALIGNED
  End
  CreateObject
    ObjectNames = Reforged_JetCrashFire
    Offset      = X:15.0 Y:0.0 Z:0.0
    Disposition = ON_GROUND_ALIGNED
  End
  CreateObject
    ObjectNames = Reforged_JetCrashFire
    Offset      = X:45.0 Y:0.0 Z:0.0
    Disposition = ON_GROUND_ALIGNED
  End
End

