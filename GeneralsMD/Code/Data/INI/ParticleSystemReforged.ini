; top of it, a spray of clods out to about 30 either side, and a low dark smoke that hangs for five
; seconds. The EMP mine throws no earth, so the two read apart: a blue ring across the ground, a
; crackle of blue sparks for most of a second, a short blue flash about 100 across and the smoke. EA's EMP mine used NeutronFlare there, a white
