; The nukes' flame columns (owner, 2026-11-14: the tall thin flames shooting up beside the cap read
; as unreal; "sütunlar", the columns). They were single stretched jet cards (ReforgedNukeJet) chained
; off the ground ring. Now each is a billowing plume of fire that erupts from the ground past the cap's
; edge and climbs while it widens and cools to soot. The ground ring (NukeRing, NukeCannonRing) makes
; one carrier system as its slave, which emits on its own clock (SlaveEmitsOnItsOwn) from the blast:
; three waves of two invisible carriers, 12 frames apart from 0.9 s (the cannon's 10 apart from 0.45
; s), each thrown out and stopped hard (a quarter a frame lost) so it lands past the cap's edge, then
; drifting up for its life. Each carrier drags its own plume (PerParticleAttachedSystem): a fireball
; card every second frame where the carrier is, from the fork's fireball atlas (one of its four runs,
; mirrored at random), ALPHA drawn Emissive in orange-gold keys, growing and rising a little and burning
; down to soot over about a second. A carrier lives a random 20 to 45 frames (the cannon's 15 to 35),
; so the plumes stand to different heights; nothing is stretched, nothing is white. The old jets, their
; dark puffs and their dust skirt are no longer fed.
; Round 24: the plumes stayed low in the dust and too small beside a cap card of about 200. The
; carriers climb 3 a frame (the cannon's 1.4), the plume lays its first card only once its carrier
; has landed (InitialDelay 6) instead of along the throw through the dust, and the cards are about
; twice as big (55 to 75 growing by some 40; the cannon's 22 to 28) and rise faster themselves.
; Round 25: the carriers die no more at birth (a size-0 particle steering a plume now lives its
; lifetime, source 28419d74), so the plumes draw for the first time. Measured against the cap (its
; edge near 70 out): the missile's carriers land 110 to 130 out and its cards are 45 to 60 growing
; by some 30, so a plume's inner edge stays about at the cap's rim; the cannon's land 60 to 70 out
; against a rim near 22 with cards of 22 to 28.
; Round 26: the missile's plumes showed only at about 2 s, half buried in the dust ring, never above
; the cap's lower third. The carriers start 12 frames after the blast (were 40), climb 4.5 a frame
; for 30 to 55 frames (were 3 for 20 to 45), and the cards are 65 to 85 growing by some 40, live 60
