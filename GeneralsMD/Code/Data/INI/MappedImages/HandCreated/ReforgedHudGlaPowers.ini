; Pieces the code lays out itself, drawn by Tools/hud_command_bar.py: the idle column's three buttons
; under the worker's, the radar's frame round the map's own shape (RadarFrameImage: the corners' sizes
; are its thickness, the edges and the centre stretch), the general's powers tray (PowerTrayImage: an
; 80x70 cell under each power, edges 8 wide and 6 at the foot, the step where a short row meets a
; longer one), the five more pieces the production and superweapon trays take where the powers tray's
; would face the wrong way (the right edge and corners, the step mirrored and the step for rows going
; down, each drawn and lit in its own tray) and the plate under a cell's readout (InGameUI.cpp,
; hudCellStyle).  Each has a one texel gutter of its own edge round it, so a stretched piece filters
; against itself.

