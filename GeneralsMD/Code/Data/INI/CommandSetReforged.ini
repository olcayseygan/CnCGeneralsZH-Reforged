; Corrections to EA's command buttons and command sets. ControlBar::init loads this after
; CommandSet.ini with INI_LOAD_MULTIFILE: a button block edits EA's button in place and names
; only what changes, and a set block replaces the set whole. GameEngine::init adds its bytes to
; the multiplayer INI CRC, as it does for CommandSet.ini.

; ==== Buttons =====================================================================================

; The Nuke MiG upgrade is the one China tank and silo upgrade that cannot be started on low power;
; Neutron Shells, sold from the same silo, carries IGNORES_UNDERPOWERED.

CommandButton Command_UpgradeChinaTacticalNukeMig
  Options = IGNORES_UNDERPOWERED
End

; Force Attack: the bar button that arms the same targeting Ctrl has always given. Combat sets
; already leave slot 12 empty under Attack Move; ControlBar::populateCommand fills that hole from
; this button, and so does the launcher's Hotkeys page. Slot 12 already used (China CC mines) stays.

CommandButton Command_ForceAttack
  Command          = FORCE_ATTACK
  Options          = OK_FOR_MULTI_SELECT
  TextLabel        = CONTROLBAR:ForceAttack
  ButtonImage      = SNForceAttack
  ButtonBorderType = SYSTEM
  DescriptLabel    = CONTROLBAR:ToolTipForceAttack
End

; The idle buttons beside the command grid, under EA's idle worker: their tooltips. A click is
; ControlBarSystem's, the same cycle the Next Idle Infantry, Vehicle and Aircraft keys run.

CommandButton NonCommand_IdleInfantry
  TextLabel     = CONTROLBAR:IdleInfantry
  DescriptLabel = CONTROLBAR:IdleInfantryDescription
End

CommandButton NonCommand_IdleVehicle
  TextLabel     = CONTROLBAR:IdleVehicle
  DescriptLabel = CONTROLBAR:IdleVehicleDescription
End

CommandButton NonCommand_IdleAircraft
  TextLabel     = CONTROLBAR:IdleAircraft
  DescriptLabel = CONTROLBAR:IdleAircraftDescription
End

; Vehicle transports unload where the player points. No set names this button: EA's own Evacuate
; buttons stay on every bar, and ControlBar::processCommandUI arms this one in their place when the
; selection holds a vehicle transport and Alt is up. The click sends MSG_EVACUATE with the spot, and
; AIGroup::groupEvacuate drives or flies the transport there, lands it if it flies and empties it.
; Alt with the button or its key empties it where it stands, and buildings always do.

CommandButton Command_EvacuateAt
  Command           = EVACUATE
  Options           = OK_FOR_MULTI_SELECT NEED_TARGET_POS
  DescriptLabel     = CONTROLBAR:ToolTipEvacuateAt
  CursorName        = Move
  InvalidCursorName = GenericInvalid
End

