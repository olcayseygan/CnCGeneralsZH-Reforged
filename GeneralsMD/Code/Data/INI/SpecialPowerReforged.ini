; Zero Hour Reforged special powers, loaded after SpecialPower.ini. A power EA defined is edited
; in place and a block holds only what changes; a new name is a new power.
;
; This file lands in the multiplayer INI checksum.

; Frenzy is a buff on your own troops and left a 250 radius window open for 30 seconds wherever
; it was clicked, so a Frenzy fired into the fog scouted an enemy base. Emergency Repair, the
; other buff, opens nothing.

SpecialPower SuperweaponFrenzy
  ViewObjectDuration = 0
  ViewObjectRange    = 0
End

SpecialPower Early_SuperweaponFrenzy
  ViewObjectDuration = 0
  ViewObjectRange    = 0
End

; The Demolitions General's Rebel Ambush, behind his own sciences in ScienceReforged.ini. The
; computer still buys the plain science and fires the plain power, which his Command Center keeps.

SpecialPower Demo_SuperweaponRebelAmbush
  Enum                    = SPECIAL_AMBUSH
  ReloadTime              = 240000
  RequiredScience         = Demo_SCIENCE_RebelAmbush1
  PublicTimer             = No
  InitiateAtLocationSound = RebelAmbushActivated
  SharedSyncedTimer       = Yes
  RadiusCursorRadius      = 50
  ShortcutPower           = Yes
  AcademyClassify         = ACT_SUPERPOWER
End

; Turkiye's own rank powers. The Enum only has to be one no other power on the Turkiye Command
; Center uses (and no other Turkiye object, since the shortcut bar finds a power's source by its
; enum); what the power does is its module (TurkiyeReforged.ini). AIFiresWhenReady lets the
; skirmish AI, which runs America's scripts, fire them (AIPlayer::doReadySpecialPowers) at the
; dearest enemy spot. The radar powers leave the fog as it is.

; SIHA Kesfi: a recon area, 300 across, for 30 seconds. The spy satellite's enum, which can be aimed
; anywhere on the map, shroud or not; the Turkiye Command Center no longer carries the scan.
SpecialPower SuperweaponTurkiyeUavRecon
  Enum                    = SPECIAL_SPY_SATELLITE
  ReloadTime              = 120000
  RequiredScience         = SCIENCE_TurkiyeUavRecon
  InitiateAtLocationSound = SpySatellite
  PublicTimer             = No
  SharedSyncedTimer       = Yes
  RadiusCursorRadius      = 300
  ShortcutPower           = Yes
  AcademyClassify         = ACT_SUPERPOWER
  AIFiresWhenReady        = Yes
End

; SIHA Surusu, one to five loitering munitions on the dearest targets in the circle
SpecialPower SuperweaponTurkiyeSwarmMunition
  Enum                = SPECIAL_ARTILLERY_BARRAGE
  ReloadTime          = 180000
  RequiredScience     = SCIENCE_TurkiyeSwarmMunition
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  ViewObjectDuration  = 10000
  ViewObjectRange     = 200
  RadiusCursorRadius  = 200
  ShortcutPower       = Yes
  AcademyClassify     = ACT_SUPERPOWER
  AIFiresWhenReady    = Yes
End

; Uydu Gudum: no target, the whole map is radar coverage for 45 seconds. CIA Intelligence's enum,
; the one no-target power the click path knows (ActionManager::canDoSpecialPower); the Harekat
; Merkezi drops the CIA module it inherits from the Strategy Center so the shortcut finds this one.
SpecialPower SuperweaponTurkiyeSatelliteGuidance
  Enum                = SPECIAL_CIA_INTELLIGENCE
  ReloadTime          = 300000
  RequiredScience     = SCIENCE_TurkiyeSatelliteGuidance
  InitiateSound       = CIAIntelligenceActivate
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  ShortcutPower       = Yes
  AcademyClassify     = ACT_SUPERPOWER
  AIFiresWhenReady    = Yes
End

