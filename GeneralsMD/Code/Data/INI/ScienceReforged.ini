; Zero Hour Reforged sciences, loaded after Science.ini. Only new names: one EA already defined
; stops the load.
;
; This file lands in the multiplayer INI checksum.

; The Demolitions General's Rebel Ambush brings 4, 6 and 10 rebels, and he bought it through the
; plain GLA science, whose description promises 4, 8 and 16. A science carries its own description,
; so his ambush gets sciences of its own.

Science Demo_SCIENCE_RebelAmbush1
  PrerequisiteSciences = SCIENCE_GLA SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush1
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
End

Science Demo_SCIENCE_RebelAmbush2
  PrerequisiteSciences = Demo_SCIENCE_RebelAmbush1 SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush2
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
End

Science Demo_SCIENCE_RebelAmbush3
  PrerequisiteSciences = Demo_SCIENCE_RebelAmbush2 SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush3
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
End

; Turkiye's side science, the way SCIENCE_AMERICA marks the Americans. FactionTurkiye holds it beside
; SCIENCE_AMERICA (PlayerTemplateReforged.ini), so it buys the American powers today and a power of
; its own can name this as its prerequisite later. PlayerTemplateReforged.ini loads after this file
; and needs the name to exist.

Science SCIENCE_Turkiye
  PrerequisiteSciences = None
  SciencePurchasePointCost = 0  ; not purchasable, as for SCIENCE_AMERICA
  IsGrantable = No
End

; Turkiye's rank tree is a radar army's: every tier 1 is one point, and a column of three is EA's
; chained tier pattern (each tier asks for the one before it). Passives are sciences that grant a
; free player upgrade at purchase (GrantsUpgrade); the radar modules in TurkiyeReforged.ini key on
; those upgrades.

