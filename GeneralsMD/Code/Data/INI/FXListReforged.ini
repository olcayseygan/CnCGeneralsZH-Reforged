; armours take 150 to 300% of it, yet EA gave it one carpet bomb's fireball, smaller than the
; missile's. The ReforgedAurora* systems in ParticleSystemReforged.ini are EA's carpet bomb, Scud
; Launcher and Artillery Barrage systems grown so the blast reads two to two and a half times the
; Scud's across: fire arms flung twice as far, four big napalm puffs, a 210-wide shock ring, a dust
; ring, fourteen clods and a smoke column, all gone in about two seconds. Only this weapon plays
; it: the plain Aurora of every American general.
