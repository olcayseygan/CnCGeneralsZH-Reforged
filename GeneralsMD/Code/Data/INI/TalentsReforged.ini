; The 10A bombs: EA's Fuel Air Bomb, its gas cloud and the MOAB, each blowing up with the talent's
; wider blast (WeaponReforged.ini).
ObjectReskin DaisyCutterBombTalent DaisyCutterBomb
End

Object DaisyCutterBombTalent
  ReplaceModule ModuleTag_03
    Behavior = CreateObjectDie ModuleTag_03_USATalent
      CreationList = OCL_DaisyCutterExplodeTalent
    End
  End
End

ObjectReskin DaisyCutterGasTalent DaisyCutterGas
End

Object DaisyCutterGasTalent
  ReplaceModule ModuleTag_04
    Behavior = SlowDeathBehavior ModuleTag_04_USATalent
      DestructionDelay         = 1000
      DestructionDelayVariance = 100
      FX                       = INITIAL FX_DaisyCutterIgnite
      FX                       = FINAL FX_DaisyCutterFinalExplosion
      Weapon                   = MIDPOINT DaisyCutterFlameWeaponTalent
      Weapon                   = FINAL DaisyCutterDetonationWeaponTalent
    End
  End
End

ObjectReskin MOABTalent MOAB
End

Object MOABTalent
  ReplaceModule ModuleTag_10
    Behavior = FireWeaponWhenDeadBehavior ModuleTag_10_USATalent
      DeathWeapon  = MOABDetonationWeaponTalent
      StartsActive = Yes
    End
  End
End

