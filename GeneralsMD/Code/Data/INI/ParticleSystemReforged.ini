; A tank fight on simulated flipbooks (Tools/smoke_flipbook.py: Mantaflow sims in Blender, rendered
; in Cycles, 8 by 8 atlases). These blocks come last so they win over every block above for the same
; name, and each names only what it changes. A flipbook card plays once over its particle's life, so
; a Lifetime here is how long the whole burn or billow takes, not how long one picture fades.
;
; ReforgedFireball is a fuel burst burning out: a hot core and ragged flame tongues cooling to deep
; red, eaten by the soot they make, which is all that is left at the end. It is drawn ALPHA and
; Emissive, so the flame covers what is behind it and the soot darkens it, which an additive card
; cannot do. FireLook goes off, since the flipbook cools on its own and the fire look's ramp would
; paint it over. ReforgedFireballB is a second sim from other lumps. A tank's or a building's blast
; throws cards of both (B as a slave, at its own place in the burst), EA's generic blast and a jet's
; fall play B, a shell's landing A, and every card is turned and sized at random, so no two blasts
; are the same picture. The additive hot cores the fork hangs on the shell and generic blasts as
; slaves stay for the flash. The raymarched fireball of v3.3.0 was one smooth opaque ball.

; A tank shell landing (WeaponFX_GenericTankShellDetonation), and EA's other uses of the buggy's
; blast: rockets, Scorpion and Marauder shells.
