; The Alpagu operator kneels, sets a fixed-wing kamikaze drone on the ground in front of him and flies
; it with a hand controller: it goes straight up, crosses to the target and drops onto it from above
; (TurkiyeAlpaguDrone, TurkiyeAlpaguDroneWeapon). He sees 200 like the Sungur and the drone 350, so
; past 200 he needs someone else's eyes, a Gozcu or a radar tower, as the artillery does;
; AcquiresBeyondVision then lets him pick his own targets out to 350 from what the team sees. No line
; of sight needed: the drone flies over the hill.
; He is a reskin of the Air Force General's Missile Defender, not EA's: a second Turkiye reskin of
; AmericaInfantryMissileDefender would be the Sungur's equal (ThingTemplate::isEquivalentTo, reskins
; of one source), and a spawn or build that asks for either could get the other. Nobody asks for the
; Air Force copy. The Missile Defender's laser ability stays in the body and has no button.
; He keeps the Missile Defender's body under the Mehmetcik's look: its locomotor, death and voices.
; PREATTACK_A is the kneel-and-place, stretched by the engine to the weapon's PreAttackDelay; FIRING_A
; and RELOADING_A are the controller pose, held while the drone flies and the next one is readied. A
; move order ends the attack and he walks off; the drone flies on to its target without him.

ObjectReskin TurkiyeInfantryAlpagu AirF_AmericaInfantryMissileDefender
End

Object TurkiyeInfantryAlpagu
