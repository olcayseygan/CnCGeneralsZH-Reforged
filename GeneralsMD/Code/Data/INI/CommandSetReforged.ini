; Corrections to EA's command buttons and command sets. ControlBar::init loads this after
; CommandSet.ini with INI_LOAD_MULTIFILE: a button block edits EA's button in place and names
; only what changes, and a set block replaces the set whole. GameEngine::init adds its bytes to
; the multiplayer INI CRC, as it does for CommandSet.ini.

; ==== Buttons =====================================================================================

; The Nuke MiG upgrade is the one China tank and silo upgrade that cannot be started on low power;
; Neutron Shells, sold from the same silo, carries IGNORES_UNDERPOWERED.

CommandButton Command_UpgradeChinaTacticalNukeMig
  Options = IGNORES_UNDERPOWERED
End

; ==== China Command Centers after Mines ===========================================================

; Buying Mines swaps the Command Center to its Upgrade set, and the Infantry and Nuke copies of that
; set were written from other sets: the Infantry one lost Frenzy and put the plain Carpet Bomb and
; Napalm Strike in place of the general's own, which it cannot use, and the Nuke one lost Frenzy.
; Each is now its general's normal set with EMP Mines in slot 12.

