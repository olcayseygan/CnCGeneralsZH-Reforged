; The named setup the drawing harnesses measure: tree-check.ps1, dx11-check.ps1, shadow-check.ps1 and
; gate-60hz.ps1 copy this file to Options.ini in their own user data folder. No Options.ini is the
; Classic game since 2026-10-31. These lines are the High preset with Classic Graphics off plus the
; fork's other rows on, which is what a first run was before that. Every row the High column of the
; quality table sets is named and GraphicsQuality is here, so an exe from before that day and one
; after it load the same values. A line must not hold an equals sign unless it is a setting.
ClassicGraphics = no
StaticGameLOD = High
GraphicsQuality = 7
LightingStyle = 1
UseCloudMap = yes
ShadowsForProjectiles = yes
DebrisTrails = yes
SmokeFireLighting = yes
TeamGlow = yes
WaterFoam = yes
CloudStyle = 1
ParticleBounce = yes
UseShadowVolumesForSkins = yes
VolumetricSmokeShadows = yes
MSAA = 2
TextureFilter = 2
Bloom = 2
Anisotropy = 16
ShadowsForParticles = yes
ShadowsForProps = yes
ShadowQuality = 1
MapLight = no
Smoke = 0
SmoothMotion = yes
HealthBars = 0
OrderLines = yes
ShowNetBox = yes
FormationDrag = yes
BuildWithoutWorker = yes
EdgeScrollInWindowedMode = yes
CameraBoundaryMargin = 200
ChromaLighting = yes
DynamicMusic = yes
LegacySound = no
AmbientVolume = 40
