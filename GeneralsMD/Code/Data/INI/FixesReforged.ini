; The lasers the dying SupW uplink throws, pink like its beam. EA's model names one texture,
; EXLaser2.tga, and ReforgedLaserPink.tga is the same gradient with the blue turned magenta.
; A reskin keeps the lifetime, body and death of SDILasers and swaps only the draw module.
ObjectReskin SupW_SDILasers SDILasers
  Draw                     = W3DModelDraw ModuleTag_01_Pink
    OkToChangeModelColor   = Yes
    ReplaceTexture         = EXLaser2.tga ReforgedLaserPink.tga
    ConditionState         = NONE
      Model                = ABSDILink_L
      Animation            = ABSDILink_L.ABSDILink_L
      AnimationMode        = ONCE
    End
  End
End

; ==== Alpha Aurora bomb ===========================================================================

; The fuel-air bomb died 15 above the ground or above any roof it passed, and a 12 radius let it
; hit buildings early, so the fuel-air blast went off in the air over the target instead of on it.
; Its drag was also sixteen times the plain Aurora bomb's, and it hung for a frame or two before
; landing. The blast now comes from the impact, as the plain bomb's does. The weapon's 400 damage
; was never dealt, since a bomb killed in the air does not detonate, and stays out.

Weapon SupW_AuroraFuelBombWeapon
  PrimaryDamage           = 0.0
  ProjectileDetonationOCL = SupW_OCL_FuelAirBomb
  ProjectileDetonationFX  = AirF_FX_AuroraBombExplode
End

Object SupW_AuroraFuelAirBomb
  RemoveModule ModuleTag_03
  RemoveModule ModuleTag_04
  RemoveModule ModuleTag_07
  ReplaceModule ModuleTag_05
    Behavior = PhysicsBehavior ModuleTag_05_Fix
      Mass                = 75.0
      AerodynamicFriction = 2
      ForwardFriction     = 2
      CenterOfMassOffset  = 2
    End
  End
  GeometryMajorRadius = 2.0
End

; ==== Apocalypse zombie ===========================================================================

; The walker the Apocalypse mode sends in. For now it is a Rebel under another name: the same model,
; body and machine gun. A reskin takes only draw and geometry fields, so the block after it patches
; the new template like any other. Its AI module is replaced so the Rebel's keeps its locomotor, and
; the zombie shambles on the angry mob's walk, 13 against the Rebel's 20. No command set builds it.

ObjectReskin ApocalypseZombie GLAInfantryRebel
End

Object ApocalypseZombie
  DisplayName = OBJECT:ApocalypseZombie
  ReplaceModule ModuleTag_03
    Behavior = AIUpdateInterface ModuleTag_03_Zombie
      AutoAcquireEnemiesWhenIdle = Yes
    End
    Locomotor = SET_NORMAL AngryMobWanderLocomotor
  End
End

