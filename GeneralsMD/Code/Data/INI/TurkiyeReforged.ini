; The Kargu base's drone, drawn as the STM Kargu quadcopter. It is a jet on the MiG's frame (no other
; Turkiye object is a MiG, and ThingFactory::newObject wants one Turkiye reskin per source), so it
; rolls out of its hangar and down the runway, lifts off and climbs (JetAIUpdate's takeoff) to 300,
; the camera's ceiling (GameData MaxCameraHeight 310), and flies at its target up there on a jet's
; banked turns. Its one weapon lets go of the diving drone below 250 short of the target and the jet
; is gone the same frame (KamikazeRange); with its target dead on the way it takes the dearest enemy
; within 350 of where it was sent instead. Nobody can select it, so nobody can call it home, and it
; is UNATTACKABLE, like the Scud Storm's missiles: no weapon can aim at it on the way in.
; Should anything still kill it, it falls and bursts like a scout drone, without its warhead.

Locomotor TurkiyeKarguDroneLocomotor
  Surfaces = AIR
  Speed = 160
  SpeedDamaged = 120
  MinSpeed = 60
  TurnRate = 120
  TurnRateDamaged = 90
  Acceleration = 120
  AccelerationDamaged = 60
  Lift = 200
  LiftDamaged = 80
  Braking = 10
  MinTurnSpeed = 100
  PreferredHeight = 300
  AllowAirborneMotiveForce = Yes
  ZAxisBehavior = SURFACE_RELATIVE_HEIGHT
  CirclingRadius = 80
  Appearance = WINGS
  PitchInDirectionOfZVelFactor = 1.0
  PitchStiffness = 0.5
  RollStiffness = 0.4
  PitchDamping = 0.9
  RollDamping = 0.8
  ForwardVelocityPitchFactor = 0
  LateralVelocityRollFactor = 0.2
  Apply2DFrictionWhenAirborne = Yes
  AirborneTargetingHeight = 30
