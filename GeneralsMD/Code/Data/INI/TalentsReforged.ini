; ---- Stealth 10A Technical and Rocket Buggy stealthed ----
; GLA Camouflage on the Rebel, made the card's own. A GPS Scrambler hides any vehicle that has a
; stealth module, and the plain chassis is every GLA general's Technical, so the module also asks
; for STATUS_RIDER1, which only the card sets here (otherwise a bike's rider flag, read by nothing
; else on a Technical). Hidden while driving, seen when it fires.

Object GLAVehicleTechnicalChassisOne
  AddModule
    Behavior = StealthUpdate ModuleTag_StealthTalent10A
      StealthDelay                         = 2500
      StealthForbiddenConditions           = ATTACKING USING_ABILITY
      MoveThresholdSpeed                   = 3
      InnateStealth                        = No
      RequiredStatus                       = STATUS_RIDER1
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
  AddModule
    Behavior = StatusBitsUpgrade ModuleTag_StealthTalent10AStatus
      TriggeredBy = Upgrade_StealthTalent10A
      StatusToSet = CAN_STEALTH STATUS_RIDER1
    End
  End
End

