; Zero Hour Reforged's own announcer lines, loaded by Eva::init right after EA's Eva.ini. Eva is the
; client's and this file is in no checksum.
;
; A block here names an event Eva.ini already defined and is parsed into it: its SideSounds are added
; after EA's and every field it leaves out (Priority, the timings) stays as Eva.ini set it. Before
; this file Turkiye had no side of its own here and spoke with America's announcer, the side it is
; built on (Eva::update falls back to the base side). Now it has one line for each of the 36 events
; America has a real line for; the ones America leaves silent (BuildingLost, a superweapon ready
; for an ally or an enemy) stay silent. The lines are DialogEvents at the end of VoiceReforged.ini.

EvaEvent LowPower
  SideSounds
    Side = Turkiye
    Sounds = EvaTurkiye_LowPower
  End
End

