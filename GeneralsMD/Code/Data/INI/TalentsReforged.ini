; ---- America 9A A-10 Strike +1 aircraft, 9B Paradrop +4 Rangers, USA 10A Fuel Air Bomb area +25% ----
; Power cards on every America Command Center (ObjectCreationListReforged.ini has the lists). EA's
; modules restated whole with the talent's lines on top; a line is inert for anyone without its
; science, and without the power's own tier the card adds nothing. The Air Force, Laser and
; Superweapon Command Centers' paradrop is FixesReforged.ini's ModuleTag_22_Fix, which the
; ReplaceModule has to name or the old module stays beside the new one. The Air Force's A-10 power
; has its own template and tier sciences. USA 10A covers the MOAB as well, the same power once the
; Strategy Center's MOAB upgrade is bought.

Object AmericaCommandCenter
  ReplaceModule ModuleTag_26
    Behavior = OCLSpecialPower ModuleTag_26_AmericaTalent
      SpecialPowerTemplate = SuperweaponA10ThunderboltMissileStrike
      UpgradeOCL           = SCIENCE_AmericaTalent9A SCIENCE_A10ThunderboltMissileStrike3 SUPERWEAPON_A10ThunderboltMissileStrikeTalent3
      UpgradeOCL           = SCIENCE_AmericaTalent9A SCIENCE_A10ThunderboltMissileStrike2 SUPERWEAPON_A10ThunderboltMissileStrikeTalent2
      UpgradeOCL           = SCIENCE_AmericaTalent9A SUPERWEAPON_A10ThunderboltMissileStrikeTalent1
      UpgradeOCL           = SCIENCE_A10ThunderboltMissileStrike3 SUPERWEAPON_A10ThunderboltMissileStrike3
      UpgradeOCL           = SCIENCE_A10ThunderboltMissileStrike2 SUPERWEAPON_A10ThunderboltMissileStrike2
      OCL                  = SUPERWEAPON_A10ThunderboltMissileStrike1
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    End
  End
  ReplaceModule ModuleTag_22
    Behavior = OCLSpecialPower ModuleTag_22_AmericaTalent
      SpecialPowerTemplate        = SuperweaponParadropAmerica
      UpgradeOCL                  = SCIENCE_AmericaTalent9B SCIENCE_Paradrop3 SUPERWEAPON_ParadropTalent3
      UpgradeOCL                  = SCIENCE_AmericaTalent9B SCIENCE_Paradrop2 SUPERWEAPON_ParadropTalent2
      UpgradeOCL                  = SCIENCE_AmericaTalent9B SUPERWEAPON_ParadropTalent1
      UpgradeOCL                  = SCIENCE_Paradrop3 SUPERWEAPON_Paradrop3
      UpgradeOCL                  = SCIENCE_Paradrop2 SUPERWEAPON_Paradrop2
      OCL                         = SUPERWEAPON_Paradrop1
      CreateLocation              = CREATE_AT_EDGE_NEAR_SOURCE
      OCLAdjustPositionToPassable = Yes
    End
  End
  ReplaceModule ModuleTag_20
    Behavior = OCLSpecialPower ModuleTag_20_USATalent
      SpecialPowerTemplate = SuperweaponDaisyCutter
      UpgradeOCL           = SCIENCE_USATalent10A SCIENCE_MOAB SUPERWEAPON_MOABTalent
      UpgradeOCL           = SCIENCE_USATalent10A SUPERWEAPON_DaisyCutterTalent
      UpgradeOCL           = SCIENCE_MOAB SUPERWEAPON_MOAB
      OCL                  = SUPERWEAPON_DaisyCutter
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    End
  End
End

