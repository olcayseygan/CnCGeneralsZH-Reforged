; Every shell and missile landing that plays EA's BuggyMissileExplosion: the tank shells (Crusader,
; Paladin, Battlemaster, Overlord, Marauder, Altay), the Inferno shell, the Rocket Buggy's and
; Scorpion's rockets, the Stinger, the Tunnel Defender, the Patriot and Sungur missiles. Its three
; fireball cards each feed the chain below, so a hit gets three of every layer: a rising fire twin, a
; roll of dust and a puff of smoke that climbs, and about one ember in four hits.
;
; The first trial hung the chain on TankStruckDebris, the two dirt clods of a shell hit. On film its
; rising smoke came out as hard charcoal balls, worst on snow. Three causes, all fixed here: the
; puff was drawn on EXSmokNew1, which is EA's soot sprite (about 54 of 255 where it is opaque, so a
; key of 120 drew 25); four of them and the dust were stacked at one point at 0.6 opacity, which
; the sun's smoke map reads as a thick cloud and shades to near black; and the clods also play on
; every tank that takes a hit (FX_DamageTankStruck), so a duel stacked them twice. The smoke is on
; the fork's own soft smoke sprite now (a mid grey of about 145, its alpha a veil that tops out at
; 0.77) with grey-brown keys near 150, a third of the opacity per puff, thrown apart before it shows,
; and the chain rides the fireball, which only the detonation plays.
;
; A slave sized from its master: ReforgedHotCoreShell is ReforgedHotCoreFireball's warm copy and the
; chain hangs off it. A shell that hits a hull bursts at the hull's centre, not on the ground, so
