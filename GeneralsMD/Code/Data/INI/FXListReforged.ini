;//////////////////////////////////////////////////////////////////////////////
;FILE: FXListReforged.ini //////////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;
; Muzzle and detonation light.  EA's explosions throw particles and sound but no
; light, so a shell landing at night lit nothing around it.  Each FXList below is
; EA's own, re-declared with one LightPulse added; FXListStore::parseFXListDefinition
; clears an entry before re-reading it, so a whole block has to be repeated to
; change one line of it.
;
; Loaded after Data\INI\FXList.ini and folded into the multiplayer INI CRC, so
; every machine in a game has to have this file - it ships in the release zip and
; the build copies it next to generals.exe.  Editing it changes that CRC: rebuild,
; repackage, and hand the same zip to everyone.
;
; Generated once from a loose FXList.ini override; the 89 entries are the ones that
; differed from the shipped file.
;//////////////////////////////////////////////////////////////////////////////

; ----------------------------------------------
FXList ScudStormMissileDetonation
  ParticleSystem
    Name = ReforgedBlastShardsLarge
  End
  ; the picture drawn into the blast, then a ring pushing it out (Direct3D 11 post chain only)
  ScreenDistortion
    Radius = 180
    PullTime = 180
    WaveTime = 1200
    PullStrength = 10%
    WaveStrength = 11%
    WaveWidth = 16%
  End
  ViewShake
    Type = STRONG
  End

  Sound
    Name = ExplosionScudExplosive
  End

  ParticleSystem
    Name = ScudMissleExplosionArms
    Offset = X:0.0 Y:0.0 Z:2.0
  End

  ParticleSystem
    Name = ScudMissleLenzFlare
    Offset = X:0.0 Y:0.0 Z:1.0
  End

  ParticleSystem
    Name = ScudMissleExplosionTrailArms
    InitialDelay = 100 100 UNIFORM   ;In milliseconds
    Offset = X:0.0 Y:0.0 Z:25.0
  End

  ParticleSystem
    Name = ReforgedHotCoreHuge
    Offset = X:0.0 Y:0.0 Z:12.0
  End

  ParticleSystem
    Name = ReforgedHeatRingHuge
    Offset = X:0.0 Y:0.0 Z:4.0
  End

  TerrainScorch
    Type = RANDOM
    Radius = 45
  End

  LightPulse
    Color = R:255 G:120 B:40
    Radius = 200
    IncreaseTime = 0
    DecreaseTime = 1100
  End
End

