; ----------------------------------------------
; The blast follows the hull: FootprintBox spreads a system over a flat box this fraction of the
; dying vehicle's length and width, turned to its heading, so a long tank blasts long and a small
; one small.  The flash, the shockwave and the smoke column stay round, at the centre.
FXList FX_GenericTankDeathExplosion
  ParticleSystem
    Name = ReforgedVehicleShrapnel
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = MammothTankExplosionSmoke
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = MammothTankSubExplosionSmoke
    FootprintBox = 1.0
    Height = 0 20 UNIFORM
    InitialDelay = 167 667 UNIFORM
  End
  ; a column of dark smoke climbing from the wreck after EA's fireball
  ParticleSystem
    Name = ReforgedTankSmoke
    Offset = X:0.0 Y:0.0 Z:6.0
  End
  ParticleSystem
    Name = MammothTankExplosionDebris
    FootprintBox = 0.8
  End
  ; its own flash, sparks and torn fire, so the howitzer blasts that share EA's flare keep theirs
  ParticleSystem
    Name = ReforgedTankDeathLenzflare
    Offset = X:0.0 Y:0.0 Z:10.0
  End
  ParticleSystem
    Name = ReforgedTankBlastFire
    Offset = X:0.0 Y:0.0 Z:8.0
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = ReforgedTankBlastSparks
    Offset = X:0.0 Y:0.0 Z:10.0
    FootprintBox = 0.6
  End
  ParticleSystem
    Name = MammothTankExplosionShockwave
  End
  ViewShake
    Type = STRONG
  End
  TerrainScorch
    Type = RANDOM
    Radius = 15
  End
  Sound
    Name = TankDie
  End
  LightPulse
    Color = R:255 G:150 B:70
    Radius = 85
    IncreaseTime = 0
    DecreaseTime = 450
  End
End

