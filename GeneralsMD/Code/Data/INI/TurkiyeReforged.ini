; The Kargu base, Turkiye's superweapon: a drone airfield whose swarm of sixteen kamikaze drones
; flies out to the sixteen dearest targets in a wide circle and dives into them. With fewer than
; sixteen targets in the circle the spare drones go round them again, dearest first. The drones are
; jets (TurkiyeKarguDrone): each one starts on the threshold of one of the two runways, rolls down
; it and climbs away, the runways in turn, one drone every quarter second, so the last is rolling
; under four seconds after the call (ParkingPlaceBehavior::scramble). It is China's airfield, so it looks nothing like Turkiye's own,
; the American one, and it carries what the Particle Cannon lent it before: price, build time,
; power draw, health and armour, the superweapon limit and the public countdown. The Harekat
; Merkezi opens it, as the Strategy Center opens the cannon. It is no FS_AIRFIELD: with it the computer held the base back as an
; extra airfield its jets did not need yet and never built it, no jet lands here and the
; select-airfields key leaves it out. A jet takes off from a superweapon's parking as from an
; airfield's (JetAIUpdate's getPP). The power's enum is the Scud Storm's, the nearest EVA has: the
; announcements say Scud Storm until Turkiye has voices of its own.

ObjectReskin TurkiyeKarguBase ChinaAirfield
End

Object TurkiyeKarguBase
  Side       = Turkiye
  DisplayName = OBJECT:TurkiyeKarguBase
  CommandSet = TurkiyeKarguBaseCommandSet
  Prerequisites
    Object = TurkiyeHarekatMerkezi
  End
  BuildCost        = 5000
  BuildTime        = 60.0
  EnergyProduction = -10
  ShroudRevealToAllRange = 60
  ArmorSet
    Conditions = None
    Armor      = StructureArmorTough
    DamageFX   = StructureDamageFXNoShake
  End
  ExperienceValue       = 400 400 400 400
  MaxSimultaneousOfType = DeterminedBySuperweaponRestriction
  MaxSimultaneousLinkKey = Superweapon
  VoiceSelect = AirfieldUSASelect
  KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE CAPTURABLE FS_TECHNOLOGY POWERED MP_COUNT_FOR_VICTORY FS_SUPERWEAPON
  ReplaceModule ModuleTag_09
    Body = StructureBody ModuleTag_09_Turkiye
      MaxHealth       = 4000.0
      InitialHealth   = 4000.0
      SubdualDamageCap = 4200
      SubdualDamageHealRate = 500
      SubdualDamageHealAmount = 100
    End
  End
  ; China's airfield, but a drone's climb out ends at 30 rather than 50, and a space for each of the
  ; sixteen drones: they start on the runways, eight to a runway, so only the runway of a space counts
  ReplaceModule ModuleTag_10
    Behavior = ParkingPlaceBehavior ModuleTag_10_Turkiye
      HealAmountPerSecond = 10
      NumRows             = 8
      NumCols             = 2
      HasRunways          = Yes
      ApproachHeight      = 30
      ParkInHangars       = Yes
    End
  End
  AddModule
    Behavior = BaseRegenerateUpdate ModuleTag_TurkiyeKarguRegenerate
    End
  End
  AddModule
    Behavior = SpecialPowerCreate ModuleTag_TurkiyeKarguPowerCreate
    End
  End
  AddModule
    Behavior = SwarmStrikeSpecialPower ModuleTag_TurkiyeKarguSwarm
      SpecialPowerTemplate = SuperweaponTurkiyeKarguSwarm
      Radius               = 350
      TargetCount          = 16
      RepeatTargets        = Yes
      Drone                = TurkiyeKarguDrone
    End
  End
End

