; ---- GLA 10A Scud Storm area +25% ----
; Not a third weapon slot: the storm's draw module launches from SECONDARY only, and a TERTIARY
; missile would leave the building's origin flat into the first thing in the way. The card raises a
; second weapon set on the same SECONDARY slot (WeaponReforged.ini has the weapons); PRIMARY stays
; empty, so the fork's exploit fix holds. The science swaps the power's list for one with the wider
; marker.

Object GLAScudStorm
  WeaponSet
    Conditions                 = PLAYER_UPGRADE
    Weapon                     = SECONDARY ScudStormWeaponTalent
    AutoChooseSources          = SECONDARY NONE
    WeaponLockSharedAcrossSets = Yes
  End
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_GLATalent10A
      TriggeredBy = Upgrade_GLATalent10A
    End
  End
  ReplaceModule ModuleTag_10
    Behavior = OCLSpecialPower ModuleTag_10_GLATalent
      SpecialPowerTemplate = SuperweaponScudStorm
      UpgradeOCL           = SCIENCE_GLATalent10A SUPERWEAPON_ScudStormTalent
      OCL                  = SUPERWEAPON_ScudStorm
    End
  End
End

