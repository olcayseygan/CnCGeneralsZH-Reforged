FXList WeaponFX_GenericTankShellDetonation
  Sound
    Name = ExplosionRocketBuggyMissile
  End
  ParticleSystem
    Name = BuggyMissileExplosion
    UseCallersRadius = Yes ; Override the radius with the damage radius of the weapon.
  End
  ParticleSystem
    Name = BuggyMissileExplosionSmoke
  End
  ; a shell landing throws EA's dirt clods and sparks, which only a tank being struck used to show
  ParticleSystem
    Name = TankStruckDebris
  End
  ParticleSystem
    Name = TankStruckSparks
    Height = 4 4 CONSTANT
  End
  LightPulse
    Color = R:255 G:150 B:70
    Radius = 85
    IncreaseTime = 0
    DecreaseTime = 450
  End
End

