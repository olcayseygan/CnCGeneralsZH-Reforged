; The Kargu drone's one shot, itself (TurkiyeKarguBase, TurkiyeKarguDrone): 250 short of its target
; and 300 above it the jet lets go of the diving drone, a projectile, and is gone, so the dive comes
; down from the ceiling as a Scud Storm missile's does. It can be seen coming and, like the Scud's,
; not shot down. 700 kills any tank but the Overlord and the Emperor, and sixteen of them are the
; Scud Storm's nine missiles spread over a wider circle.
; RETURN_TO_BASE with a clip of one is what tells the jet it has fired (JetAIUpdate KamikazeRange).
Weapon TurkiyeKarguDroneWeapon
  PrimaryDamage               = 700.0
  PrimaryDamageRadius         = 20.0
  SecondaryDamage             = 150.0
  SecondaryDamageRadius       = 50.0
  AttackRange                 = 250.0
  AcceptableAimDelta          = 30
  DamageType                  = EXPLOSION
  DeathType                   = EXPLODED
  WeaponSpeed                 = 99999
  FireSound                   = TomahawkWeapon
  ProjectileObject            = TurkiyeKarguDroneDive
  ProjectileDetonationFX      = WeaponFX_BombTruckDefaultBombDetonation
  AutoReloadsClip             = RETURN_TO_BASE
  ; NOT_SIMILAR: a drone's blast took the swarm's drones beside it out of the air
  RadiusDamageAffects         = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
  ClipSize                    = 1
  AntiAirborneVehicle         = No
  AntiAirborneInfantry        = No
End

