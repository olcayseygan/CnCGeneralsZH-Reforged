; ==== Weapons ====================================================================================
;
; The Turkiye weapons that fire a sound of their own; the FireSound lines in
; TurkiyeWeaponReforged.ini that name them are in the checksum, these are not. Generated with
; ElevenLabs (eleven_text_to_sound_v2), cut to one shot, 44100 Hz mono 16-bit like the rate and
; channels of EA's weapon files, and set so three of them 100 ms apart, the rifle's clip, are as
; loud as EA's Ranger burst (-12.5 LUFS). Each event keeps every field of the EA event it replaces;
; the weapon plays it once a round, so a clip is three shots where the Ranger's sound was a burst
; a round. Wavs are <code>we<letter> for the rifle and <code>wm<letter> for the MPT-76.

; ---- Mehmetcik (imeh), after RangerWeapon -------------------------------------------------------

AudioEvent TurkiyeMehmetcikWeapon
  Sounds = imehwea imehweb imehwec imehwed
  Control = random
  Priority = normal
  PitchShift = -2 2
  VolumeShift = -15
  Limit = 3
  Volume = 60
  Type = world shrouded everyone
End

