; ---- tank shells glow in flight -------------------------------------------------------------------
;
; Looks only, nothing a shell does changes. EA's cannon shell is AVTankShel, a grey sliver about as
; long as a rifleman's head is wide, and at the default camera a Crusader's shot was invisible
; between the flash and the blast. Each shell that draws it now carries ReforgedTankShellTracer
; (ParticleSystemReforged.ini), a short hot streak behind it. "None" is no bone, so the system sits
; at the shell's origin, the way EA hangs SparksMedium and MissileExhaust on its projectiles. The
; Inferno, Nuke Cannon, barrage and Bender shells draw the same model and are artillery, so they
; keep EA's look.
;
; The streak also showed EA's path, a curve ten over the highest ground between the tank and its
; victim: on flat ground a Crusader's shell left twelve degrees above the barrel, climbed seven over
; the line and came down on the target at twenty five, so every shot read as a lob.
; StraightWhenClear flies the line instead when no ground rises into it, and the old curve is left
; for a shot over a hill. Each block below is EA's DumbProjectileBehavior with that line added.

Object GenericTankShell
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Reforged
      ConditionState = NONE
        Model = AVTankShel
        ParticleSysBone = None ReforgedTankShellTracer
      End
    End
  End
  ReplaceModule ModuleTag_04
    Behavior = DumbProjectileBehavior ModuleTag_04_Reforged
      FirstHeight = 10
      SecondHeight = 10
      FirstPercentIndent = 50%
      SecondPercentIndent = 90%
      FlightPathAdjustDistPerSecond = 100
      StraightWhenClear = Yes
    End
  End
End

