; a better mushroom, in the game's own tones). Two families of EA systems draw them, and the FXLists
; that place them are in the checksum, so this changes only the systems.
;   The Nuclear Missile (FX_Nuke, SupW_FX_Nuke): NukeFlare at 90 high (a lens flare growing 150 a
;   frame), NukeMushroomExplosion at 90 from 0.2 s (125 fire cards over 100 frames, the cap's
;   fireball), NukeShockwave from 0.2 s (250 cloud puffs on a 200 ring, ten seconds of ground cloud),
;   NukeBlastWave and NukeShockwaveInverted from 0.3 s, NukeMushroomRing at 50 from 1 s (the fire ring
;   round the stem), and from 2 s NukeMushroomStem (puffs drawn in from a 75 ring and lifted a unit a
;   frame for six seconds) and NukeMushroomCloudRing at 105 (the cap's cloud, fifty puffs growing to
;   about sixty); NukeRing is the flat fire ring on the ground at once.
;   The mini nukes (the Nuke Cannon's shell, its and the Nuke General's, the Nuke Cannon's death, the
;   Nuclear Reactor's meltdown, the Nuke General's Overlord's death weapon): the same staging at about
;   a third, NukeCannonFlare, ...MushroomExplosion, ...MushroomCloudRing, ...MushroomStem,
;   ...MushroomRing, ...ShockwaveInverted, ...BlastWave, NukeCannonRing, and the reactor's
;   NukeCannonShockwave ground cloud. The neutron shell has its own Neutron systems and is left alone.
; The fire cards (the cap's fireball and the fire ring) burn on the fire flipbook, ALPHA drawn Emissive,
; and leave the fire look, so they keep their yellow-orange instead of stacking to white; the cream
; EXCloud01 clouds are the smoke and dust flipbooks in dark grey-brown, the warm light of the fire on
; them from the smoke lighting; the white flare and the flat white ground waves are warm and smaller.
; The mushroom is three atlases played once over a card's life, no longer a pile of puffs: the cap
; (ReforgedNukeCap, a ball of fire that rolls over itself and cools to soot) is one card where EA's
; fireball threw 125, with two more behind it from the cloud ring for bulk, each mirrored at random
; and ending with the first; the stem (ReforgedNukeStem, foot at 0.95 of its cell) is one card with
; its foot on the ground, big enough from its first frame that its top reaches the cap's underside,
; growing a little while the cap rises slowly off its seat; the flame jets round the foot are
; ReforgedNukeJet (root at 0.93), thrown up out of the ground and stopping with their root on it.
; A billboard's side is its Size, and a world height shows at about 0.8 of itself on screen at the
; game camera's tilt, which the stems' offsets and drifts below are worked from. The mini nukes are
; the same at about 0.45, timed for the Nuke Cannon's shell (stem at 0.2 s); the reactor's meltdown
; (FX_ChinaPowerPlantDeath) uses these same NukeCannon systems with its stem at 2 s.
ParticleSystem NukeFlare
  SizeRate = 60.00 60.00
  Lifetime = 90.00 90.00
  Color2 = R:235 G:180 B:120 2
  Color3 = R:0 G:0 B:0 90
End

