  ; pale family with a slight tint each, no throb, the ticks and the scale turning very slowly.
  ; Additive light reads louder the darker the ground, so the opacity is as written where flat ground
  ; is lit LightReference bright (the map's ambient plus its sun on level ground, 0 to about 1.5) and
