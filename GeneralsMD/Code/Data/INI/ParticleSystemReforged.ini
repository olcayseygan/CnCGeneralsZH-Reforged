; A tank gun's muzzle flash. EA's was twelve additive EXexplo03 cards thrown 6 to 70 units down the
; barrel and growing to 20 across, plus a white lens flare: a round puff in front of the gun, and
; under the Glow gain and the bloom the frames after a shot went white (fx-bisect, 2026-11-14: about
; 3400 texels over 230 in every channel on the Crusader's first frame of firing). A burn of 64
; frames would play as a smear over the eight a flash is seen, so ReforgedMuzzleFlash
; (Tools/muzzle_flipbook.py) is sixteen different flame lobes, each a ray-marched volume of hot gas
; torn into tongues, and each card keeps the one it starts on (FlipbookRandomStart, and a
; FlipbookRate so slow it never turns a frame). The direction comes from how the cards are thrown:
; a jet of six down the barrel that stops dead (velocity damped to a quarter a frame), shrinks and
; is gone in five frames, so it never floats ahead of the gun as a second blast; a hot core sits on
; the muzzle. Side petals were tried and did not read at play zoom. The cards are ALPHA drawn
; Emissive, so a stack of them converges on the lobes' own orange with a pale yellow core instead
; of adding up to white, and the Glow gain, which multiplies only additive draws, leaves them alone.
; The soot is the smoke flipbook above, rising at the muzzle over four frames as the flame goes.
; Measured with fx-bisect's scenario
; (experiments/proofs/2026-11-14/muzzle-flipbook): white texels in front of the Crusader's gun over
