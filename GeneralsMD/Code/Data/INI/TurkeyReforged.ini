  Side       = Turkey
  DisplayName = OBJECT:TurkeyVehicleFirtina
  SpeedScale = 0.6
  BuildCost  = 1400
  BuildTime  = 22.0
  VisionRange         = 100
  ShroudClearingRange = 100
  AcquiresBeyondVision = Yes
  Prerequisites
    Object = TurkeyWarFactory
