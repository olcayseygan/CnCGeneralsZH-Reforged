; Zero Hour Reforged balance, loaded after every Object, Weapon and Armor file.
;
; An Object or Weapon block here edits the template EA's files built: the fields it names are
; written over, the rest stay as EA wrote them. A module is changed with ReplaceModule and a new tag.
; An Armor block replaces that armor whole, so it carries every line.
;
; This file lands in the multiplayer INI checksum.
;
; Defender's advantage, 2026-09-24. Measured with 528 staged sieges a round, every stock defence
; against 22 attackers at one and two times its price from two directions (Tools/Balance/siege.py).
; EA's numbers let a main battle tank take a defence for less than the defence cost:
; tanks lost 0.27 of a Gattling Cannon's price killing it, 0.75 of a Stinger Site's, 0.89 of a
; Patriot's. Tank shells now do half damage to the three defence armors, which puts every one of
; them at 1.1 to 1.3 against tanks. Long-range artillery still takes any defence for nothing; the
; Rocket Buggy's reach is cut at the end of this file.

