; ----------------------------------------------------------------------------------------------
; The fire look. Under Direct3D 11 the billboards of these systems run a temperature ramp over each
; particle's life, white through yellow, orange and red to soot, burn away from their thin edges in
; rather than only fading flat, and flicker where two noise fields bend the card's texture. -d3d9
; and the Classic graphics setting draw them as before. A block that names a system already defined
; edits it in place, so these name FireLook alone and every other field stays retail's, a mod's or
; the fork's own block above. The list is every billboarded additive or alpha system drawn with
; EA's flame and fireball textures (EXExplo, EXFire, EXFireball, EXFThrower, EXSmolderingFire),
; less the green fires of toxin and anthrax and the Particle Cannon's, which the ramp would turn
; orange, and less muzzle flashes, sparks and embers, gone before a ramp shows.
; ----------------------------------------------------------------------------------------------

