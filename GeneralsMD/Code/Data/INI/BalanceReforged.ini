; ---- a player's idle hacker goes to work -------------------------------------------------------
;
; A hacker left standing ten seconds goes into the nearest own Internet Center with a seat within
; 150, or else starts hacking where it stands. Any order starts the ten seconds over, and a stop or
; an exit the player ordered keeps it standing until his next order. The computer already does this
; for its own (AIPlayer's putToHacking), so the module skips every non-human player.
;
; Every HackInternetAIUpdate field is EA's, the delay inside an Internet Center differing per general as
; it does in EA's data. No Locomotor line: a replaced AIUpdate keeps the object's sets.

Object ChinaInfantryHacker
  ReplaceModule ModuleTag_03
    Behavior = HackInternetAIUpdate ModuleTag_03_Reforged
      UnpackTime                = 7300
      PackTime                  = 5133
      CashUpdateDelay           = 2000
      CashUpdateDelayFast       = 1800
      RegularCashAmount         = 5
      VeteranCashAmount         = 6
      EliteCashAmount           = 8
      HeroicCashAmount          = 10
      XpPerCashUpdate           = 1
      PackUnpackVariationFactor = 0.5
    End
  End
  AddModule
    Behavior = IdleHackerUpdate ModuleTag_IdleHacker
      IdleTime    = 10000
      CenterRange = 150.0
    End
  End
End

