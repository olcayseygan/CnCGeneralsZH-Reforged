; Zero Hour Reforged's Turkey faction, loaded after FixesReforged.ini with INI_LOAD_MULTIFILE.
;
; Every Turkey object is an ObjectReskin of the American one it is named after, followed by a
; patch block on the new name. The reskin copies the American template whole, as Balance and Fixes
; left it, and the patch then sets Side = Turkey and, where the building or dozer builds something,
; a Turkey command set. Nothing else is restated, so a later change to the American object reaches
; the Turkish one on the next load.
;
; A reskin counts as its source wherever the engine asks ThingTemplate::isEquivalentTo: a Turkey
; War Factory meets a prerequisite that names AmericaWarFactory, and a Turkey factory asked for an
; America-named unit by the skirmish scripts makes the Turkey one its button names
; (BuildAssistant::findBuildButtonTemplate). That is what lets a Turkey AI run the SkirmishAmerica
; scripts unchanged. Every American unit and building a skirmish player can own has a Turkey copy;
; the campaign's (the battleship, the carrier, the CINE_ units) do not.
;
; These are placeholders: American models, weapons, names and cameos under Turkish template names.
;
; This file lands in the multiplayer INI checksum.

ObjectReskin TurkeyCommandCenter AmericaCommandCenter
End

Object TurkeyCommandCenter
  Side       = Turkey
  CommandSet = TurkeyCommandCenterCommandSet
End

ObjectReskin TurkeyPowerPlant AmericaPowerPlant
End

Object TurkeyPowerPlant
  Side       = Turkey
End

; The Supply Center's free Chinook is a Turkey one.

ObjectReskin TurkeySupplyCenter AmericaSupplyCenter
End

Object TurkeySupplyCenter
  Side       = Turkey
  CommandSet = TurkeySupplyCenterCommandSet
  ReplaceModule ModuleTag_12
    Behavior            = SpawnBehavior ModuleTag_12_Turkey
      SpawnNumber       = 1
      SpawnReplaceDelay = 9999
      SpawnTemplateName = TurkeyVehicleChinook
      OneShot           = Yes
      CanReclaimOrphans = No
      SlavesHaveFreeWill = Yes
    End
  End
End

