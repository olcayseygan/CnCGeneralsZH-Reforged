  ; The four shelter doors, shut by default; damage leaves them as they are, rubble has no doors,
  ; construction draws none (their team panels would stand outside the scaffold). Every door state
  ; names its damaged forms outright, or damage alone would match the AWAITING_CONSTRUCTION DAMAGED
