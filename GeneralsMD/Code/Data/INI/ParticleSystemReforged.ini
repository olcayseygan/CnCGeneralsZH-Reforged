; The smoke column a tank's or a medium building's death leaves climbing after EA's fireball
; (FX_GenericTankDeathExplosion and FX_StructureMediumDeath in FXListReforged.ini): puffs of EA's
; dark EXSmokNew1, two at a time, rising and swelling into one plume. From v3.3.0 to v3.4.1 these
; two blasts and a shell's landing drew a raymarched flipbook fireball and smoke instead of EA's
; fireball; the fireball was one smooth, opaque, slowly swelling orange ball and each smoke puff the
; same hard-edged round blob, so a building going down looked like modelling clay and cotton wool.
; EA's photographed fireballs are back, and the column kept its shape on EA's soft smoke. EXCloud01
; was tried first: its alpha is too thin for a column, which all but vanished. The column hung for
; almost seven seconds on a tank and ten on a building, near-black over a fight that had moved on, so
; both now stop emitting early and the last puff is out about three seconds after the blast.

