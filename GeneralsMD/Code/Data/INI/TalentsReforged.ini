; ---- 9A UAV Swarm +2 drones, 9B Gokbey Landing +4 soldiers, 10A Tayfun area +25% ----
; Power cards. A science-keyed line names the talent and the tier it adds to, and every science on
; it must be owned. The lines are tried top to bottom and the first owned one wins, so the talent's
; lines sit above the tiers', tier 3 first; the talent alone is its line for tier 1, which the
; power itself asks for. The modules are TurkiyeReforged.ini's, restated whole with these lines on
; top, since a module's fields cannot be added to from here.

Object TurkiyeCommandCenter
  ; SIHA Surusu: 1, 3 and 5 munitions become 3, 5 and 7
  ReplaceModule ModuleTag_TurkiyeSwarmMunition
    Behavior = SwarmStrikeSpecialPower ModuleTag_TurkiyeSwarmMunitionTalent
      SpecialPowerTemplate = SuperweaponTurkiyeSwarmMunition
      Radius               = 200
      TargetCount          = 1
      UpgradeTargetCount   = SCIENCE_TurkiyeTalent9A SCIENCE_TurkiyeSwarmMunition3 7
      UpgradeTargetCount   = SCIENCE_TurkiyeTalent9A SCIENCE_TurkiyeSwarmMunition2 5
      UpgradeTargetCount   = SCIENCE_TurkiyeTalent9A 3
      UpgradeTargetCount   = SCIENCE_TurkiyeSwarmMunition3 5
      UpgradeTargetCount   = SCIENCE_TurkiyeSwarmMunition2 3
      Weapon               = TurkiyeSwarmMunitionWeapon
      TargetFX             = WeaponFX_ComancheAntiTankMissileDetonation
    End
  End
  ; Gokbey Indirmesi: 6, 10 and 14 men become 10, 14 and 18 (ObjectCreationListReforged.ini)
  ReplaceModule ModuleTag_22_Turkiye
    Behavior = OCLSpecialPower ModuleTag_22_TurkiyeTalent
      SpecialPowerTemplate = SuperweaponTurkiyeRapidDeployment
      UpgradeOCL           = SCIENCE_TurkiyeTalent9B SCIENCE_TurkiyeRapidDeployment3 SUPERWEAPON_TurkiyeRapidDeploymentTalent3
      UpgradeOCL           = SCIENCE_TurkiyeTalent9B SCIENCE_TurkiyeRapidDeployment2 SUPERWEAPON_TurkiyeRapidDeploymentTalent2
      UpgradeOCL           = SCIENCE_TurkiyeTalent9B SUPERWEAPON_TurkiyeRapidDeploymentTalent
      UpgradeOCL           = SCIENCE_TurkiyeRapidDeployment3 SUPERWEAPON_TurkiyeRapidDeployment3
      UpgradeOCL           = SCIENCE_TurkiyeRapidDeployment2 SUPERWEAPON_TurkiyeRapidDeployment2
      OCL                  = SUPERWEAPON_TurkiyeRapidDeployment
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
      OCLAdjustPositionToPassable = Yes
    End
  End
  ; Tayfun has one tier: the warhead's 50 and 90 become 62.5 and 112.5 (WeaponReforged.ini), and
  ; the power's targeting circle 100 to 125 (SpecialPowerReforged.ini)
  ReplaceModule ModuleTag_TurkiyeTayfun
    Behavior = OCLSpecialPower ModuleTag_TurkiyeTayfunTalent
      SpecialPowerTemplate = SuperweaponTurkiyeTayfun
      UpgradeOCL           = SCIENCE_TurkiyeTalent10A SUPERWEAPON_TurkiyeTayfunTalent
      OCL                  = SUPERWEAPON_TurkiyeTayfun
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
End

; The 10A Tayfun's missile: the plain one with the wider warhead and its delivery decal to match.
ObjectReskin TurkiyeTayfunMissileTalent TurkiyeTayfunMissile
End

Object TurkiyeTayfunMissileTalent
  ReplaceModule ModuleTag_03_Turkiye
    Behavior = NeutronMissileUpdate ModuleTag_03_TurkiyeTalent
      DistanceToTravelBeforeTurning = 200
      MaxTurnRate = 7200
      ForwardDamping = 0.1
      RelativeSpeed = 2.0
      LaunchFX = FX_NeutronMissileLaunch
      IgnitionFX = FX_NeutronMissileIgnition
      TargetFromDirectlyAbove = 10
      SpecialAccelFactor = 1
      SpecialSpeedTime = 1500
      SpecialSpeedHeight = 160
      SpecialJitterDistance = 0.4
      DeliveryDecalRadius = 112.5
      DeliveryDecal
        Texture           = SCCNuclearMissile_China
        Style             = SHADOW_ALPHA_DECAL
        OpacityMin        = 25%
        OpacityMax        = 50%
        OpacityThrobTime  = 500
        Color             = R:255 G:0 B:0 A:255
        OnlyVisibleToOwningPlayer = Yes
      End
    End
  End
  ReplaceModule ModuleTag_09_Turkiye
    Behavior = FireWeaponWhenDeadBehavior ModuleTag_09_TurkiyeTalent
      DeathWeapon  = TurkiyeTayfunWarheadTalent
      StartsActive = Yes
    End
  End
End

