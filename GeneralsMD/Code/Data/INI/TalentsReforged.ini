; The 9B field. EA's bomb lays a mine group at the centre and a ring of groups around it, the ring a
; group's diameter out (GenerateMinefieldBehavior); a second ring comes only once the field passes
; DistanceAroundObject, and at 80 that never happens: any value up to 120 lays the same eight groups.
; So the card spreads the groups instead, each 30 to 34.2 wide, which puts the ring at 68.4, not 60,
; and the field's edge at 102.6, not 90: a third more ground (x1.30), every group's own trigger
; wider by as much.
ObjectReskin ChinaClusterMineTalent ChinaClusterMine
End

Object ChinaClusterMineTalent
  GeometryMajorRadius = 34.2
End

ObjectReskin ClusterMinesBombTalent ClusterMinesBomb
End

Object ClusterMinesBombTalent
  ReplaceModule ModuleTag_05
    Behavior = GenerateMinefieldBehavior ModuleTag_05_ChinaTalent
      MineName                = ChinaClusterMineTalent
      DistanceAroundObject    = 80
      GenerateOnlyOnDeath     = Yes
      SmartBorder             = Yes
      SmartBorderSkipInterior = No
      AlwaysCircular          = Yes
      GenerationFX            = WeaponFX_ClusterMineImpact
    End
  End
End

