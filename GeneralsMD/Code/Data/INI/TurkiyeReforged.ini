; The Supply Center's free gatherer is a Turkiye supply truck. Turkiye has no supply drop zone,
; hacker or black market, so the center itself pays a trickle, a black market's: 20 every 2
; seconds. Without it a Hard Turkiye AI earned 77% of what America's did per minute, 50% of China's
; and 32% of GLA's.

ObjectReskin TurkiyeSupplyCenter AmericaSupplyCenter
End

Object TurkiyeSupplyCenter
  Side       = Turkiye
  DisplayName = OBJECT:TurkiyeSupplyCenter
  CommandSet = TurkiyeSupplyCenterCommandSet
  AddModule
    Behavior = AutoDepositUpdate ModuleTag_TurkiyeIncome
      DepositTiming       = 2000
      DepositAmount       = 20
      InitialCaptureBonus = 0
    End
  End
  ReplaceModule ModuleTag_12
    Behavior            = SpawnBehavior ModuleTag_12_Turkiye
      SpawnNumber       = 1
      SpawnReplaceDelay = 9999
      SpawnTemplateName = TurkiyeVehicleSupplyTruck
      OneShot           = Yes
      CanReclaimOrphans = No
      SlavesHaveFreeWill = Yes
    End
  End
  ; Its own model: a present-day logistics depot on the American footprint. A long prefab steel
  ; warehouse (cream panels, a window band under the eave, a red-brown steel gable roof, roller
  ; shutters) behind a concrete loading platform, a two-storey prefab office, a container stack in
  ; a HESCO corner, and the truck bay under a gantry crane whose team-coloured girder runs from the
  ; bay to the platform. TRSUPCTR and its damaged and burnt-out states TRSUPCTR_D and _E, the crane
  ; TRSUPCTR_CR and the construction site TRSUPCTR_SC in Code/Data/Art/W3D, the TRSupCtr_*.tga and
  ; ZHCA_TRSupCtr*.tga textures in Code/Data/Art/Textures. The object keeps retail
  ; AmericaSupplyCenter's footprint and GeometryHeight, and every depot state carries the dock bones
  ; (DOCKSTART, DOCKACTION, DOCKEND and the nine DOCKWAITING) with ABSUPPLYCT's bytes. Three draw modules take
