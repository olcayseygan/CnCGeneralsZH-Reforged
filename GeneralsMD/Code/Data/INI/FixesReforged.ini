; The Toxin demo trap fires its charge from FireWeaponWhenDead modules, which go off at the moment
; of death with no construction exemption: before the one second warning, and from a scaffold the
; enemy shot down. The charge goes back into the slow death, as on the plain trap, with a status
; bit choosing Gamma.

