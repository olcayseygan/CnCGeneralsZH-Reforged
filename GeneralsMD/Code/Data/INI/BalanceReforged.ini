; ---- artillery shells land on time ---------------------------------------------------------------
;
; EA's artillery shell flew a fixed curve at a speed: the arc's height came from the shell, the
; barrel's angle from the turret, and the two never met. A Fire Base drew its barrel at 46 degrees
; and its shell left along it, came down at 70 and peaked anywhere from 36 to 62 over the line; an
; Inferno's barrel sat at 45 whatever the range. With BallisticFlightTime the shell flies a true
; parabola that lands that long after it left, at any range, peaking BallisticPeakHeight over the
; line, and the turret raises the barrel to the parabola's launch angle before it fires. A close
; target gets a steep lob, a far one a flatter shot, and barrel, launch and flight agree. Each time
; is the old shot's average over the weapon's range (EA's flight in brackets, min to max range), so
; a moving target gets as long to walk out of the blast as it had. The battleships' fixed fire
; pitch (12 to 20 degrees) goes the same way.

Weapon FireBaseHowitzerGun
  BallisticFlightTime = 1200   ; EA: 0.9 s at 50 to 1.67 s at 275
  BallisticPeakHeight = 50
End

Weapon InfernoCannonGun
  BallisticFlightTime = 1600   ; EA: 2.07 s at 50 to 1.47 s at 300
  BallisticPeakHeight = 75
End

Weapon InfernoCannonGunUpgraded
  BallisticFlightTime = 1600
  BallisticPeakHeight = 75
End

Weapon NukeCannonGun
  BallisticFlightTime = 1600   ; EA: 1.13 s at 150 to 2.03 s at 350
  BallisticPeakHeight = 80
End

Weapon NukeCannonNeutronWeapon
  BallisticFlightTime = 1600
  BallisticPeakHeight = 80
End

Weapon BattleShipGunReal
  BallisticFlightTime = 800    ; EA: 500 a second, 0.8 s at 400
  BallisticPeakHeight = 30
End

Weapon BattleshipDemoGun
  BallisticFlightTime = 800
  BallisticPeakHeight = 30
End

Weapon BattleshipUSSBenderGun
  BallisticFlightTime = 750    ; EA: 0.7 to 0.75 s on its lane
  BallisticPeakHeight = 60
End

; ---- a tank shell does its damage to the man it hits ---------------------------------------------
;
; HumanArmor took armor-piercing at 10%, so a Crusader's 60 did 6 to a Ranger with 180 health:
; thirty connecting hits. The gun already scatters up to 10 against infantry and the blast is 5
; across, which is what keeps a tank from mowing a squad. 3.4.0 let a landed shell do the full 60,
; and an Overlord then cut a Red Guard down in 0.6 s: players called it a different game. 30% is
; 18 a shell, ten hits on a Ranger and seven on a Red Guard, three times EA's and well short of
