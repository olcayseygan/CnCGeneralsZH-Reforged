  ; AKKOR, the War Factory's active protection: once the player has it, every Altay bursts one
  ; incoming missile or rocket every three seconds with TurkiyeAkkorCharge (TurkiyeWeaponReforged.ini).
  ; The Paladin's point defense, scanning out to 120 and firing inside 65, idle until the upgrade.
  AddModule
    Behavior = PointDefenseLaserUpdate ModuleTag_TurkiyeAkkor
      WeaponTemplate              = TurkiyeAkkorCharge
      PrimaryTargetTypes          = BALLISTIC_MISSILE SMALL_MISSILE
      ScanRate                    = 500
      ScanRange                   = 120.0
      PredictTargetVelocityFactor = 3.0
      RequiredUpgrade             = Upgrade_TurkiyeAkkor
    End
  End
  ; Its own model: a long low hull on seven road wheels under full side skirts, a low welded turret
  ; with flat add-on blocks on its front and cheeks and armour panels on its sides, a long bustle with
  ; a stowage basket, the 120 mm gun with its thermal sleeve and fume extractor, a remote weapon
  ; station and the commander's sight on the roof. TRALTAY and its damaged state TRALTAY_D, the hulk
  ; TRALTAY_D1 and the turret and gun it throws, TRALTAY_D2 and _D3, in Code/Data/Art/W3D; the
  ; ZHCA_TRAltay*.tga and TRAltay_*.tga textures in Code/Data/Art/Textures; all made by
  ; experiments/proofs/2026-11-02/tank in the workspace. The bones keep the Crusader's names, so the
  ; draw is the Crusader's with the models swapped; the gun is modelled level, so BarrelArtPitch is 0.
  ; It dies into its own wreck: the hulk, its turret and its gun (ObjectCreationListReforged.ini);
  ; all three are hulk objects (below) that sink into the ground before they go.
  ReplaceModule ModuleTag_01_Reforged
    Draw = W3DTankDraw ModuleTag_01_Turkiye
      StabilizedTurretPitch = Yes
      BarrelArtPitch        = 0.0
      DefaultConditionState
        Model               = TRALTAY
        Turret              = Turret
        TurretPitch         = Barrel01
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY TurretFX
        WeaponLaunchBone    = PRIMARY TurretMS
      End
      ConditionState        = REALLYDAMAGED
        Model               = TRALTAY_D
        Turret              = Turret
        TurretPitch         = Barrel01
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY TurretFX
        WeaponLaunchBone    = PRIMARY TurretMS
      End
      ConditionState        = RUBBLE
        Model               = TRALTAY_D
        Turret              = Turret
        TurretPitch         = Barrel01
      End
      TrackMarks              = EXTnkTrack.tga
      TreadAnimationRate      = 2.0
      TreadDriveSpeedFraction = 0.3
      TreadPivotSpeedFraction = 0.6
      OkToChangeModelColor    = Yes
    End
  End
  ReplaceModule ModuleTag_10
    Behavior = SlowDeathBehavior ModuleTag_10_Turkiye
      DeathTypes               = ALL -CRUSHED -SPLATTED
      ProbabilityModifier      = 50
      DestructionDelay         = 500
      DestructionDelayVariance = 100
      FX                       = INITIAL FX_GenericTankDeathEffect
      OCL                      = MIDPOINT OCL_TurkiyeAltayDeathEffect
      FX                       = FINAL FX_GenericTankDeathExplosion
    End
  End
  ReplaceModule ModuleTag_11
    Behavior = SlowDeathBehavior ModuleTag_11_Turkiye
