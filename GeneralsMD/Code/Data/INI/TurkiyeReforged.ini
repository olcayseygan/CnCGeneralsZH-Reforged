  ; Its own model: the T-122 Sakarya, a 6x6 truck with a flat cab, a generator box behind it, a
  ; turntable over the first rear axle carrying two pods of twenty 122 mm tubes, and the stabiliser
  ; legs stowed at the rear corners. TRSAKARYA and its damaged state TRSAKARYA_D, the hulk
