; Zero Hour Reforged factions, loaded after PlayerTemplate.ini with INI_LOAD_MULTIFILE: a new name
; is added after EA's templates, an existing one is edited in place.
;
; This file lands in the multiplayer INI checksum.

; Turkey is built on the American tree (TurkeyReforged.ini) and plays like an American general:
; BaseSide USA, the American sciences on top of its own SCIENCE_Turkey, and America's load screen,
; music and pictures until it has its own.

PlayerTemplate FactionTurkey
  Side              = Turkey
  BaseSide          = USA
  PlayableSide      = Yes
  StartMoney        = 0
  PreferredColor    = R:255 G:0 B:0
  IntrinsicSciences = SCIENCE_AMERICA SCIENCE_Turkey
  PurchaseScienceCommandSetRank1  = SCIENCE_Turkey_CommandSetRank1
  PurchaseScienceCommandSetRank3  = SCIENCE_Turkey_CommandSetRank3
  PurchaseScienceCommandSetRank8  = SCIENCE_Turkey_CommandSetRank8
  SpecialPowerShortcutCommandSet  = SpecialPowerShortcutTurkey
  SpecialPowerShortcutWinName     = GenPowersShortcutBarUS.wnd
  SpecialPowerShortcutButtonCount = 10
  DisplayName       = INI:FactionTurkey
  StartingBuilding  = TurkeyCommandCenter
  StartingUnit0     = TurkeyVehicleDozer
  ScoreScreenImage  = America_ScoreScreen
  LoadScreenImage   = SAFactionLogoPage_US
  LoadScreenMusic   = Load_USA
  ScoreScreenMusic  = Score_USA
  FlagWaterMark     = WatermarkUSA
  EnabledImage      = SSObserverUSA
  BeaconName        = MultiplayerBeacon
  SideIconImage     = GameinfoAMRCA
  GeneralImage      = USA_Logo
  OldFaction        = No
  ArmyTooltip       = TOOLTIP:BioStrategyLong_Turkey
  Features          = GUI:BioFeatures_Turkey
  MedallionRegular  = USAGeneral_slvr
  MedallionHilite   = USAGeneral_blue
  MedallionSelect   = USAGeneral_orng
End
