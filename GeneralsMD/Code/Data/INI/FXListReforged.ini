; ----------------------------------------------
; Only the Overlord and its generals' copies (the Emperor among them) die on this. Its blast follows
; the hull the way FX_GenericTankDeathExplosion's does; the hull is twice a Crusader's area, so the
; shrapnel and the dirt come twice. The flash and the shockwave stay round, at the centre.
