; ----------------------------------------------------------------------------------------------
; Fragments that fly out of a blast and draw smoke behind them. FXListReforged.ini plays the
; ReforgedBlastShards tiers on hits and blasts by their size and ReforgedVehicleShrapnel on vehicle
; deaths. Each fragment carries
; its own trail (PerParticleAttachedSystem), which lives as long as the fragment. The trail is a
; STREAK on EXJetSmoke, a ribbon through its points like MissileExhaustTrail: billboarded puffs a
; few units across, laid every second frame behind a fragment covering 3 a frame, came out as beads
; on a string. Every ribbon number is fixed, since a random width or alpha per point draws a lumpy
; line. Fragments and trails sit at the lowest priorities their blasts allow, so the particle cap
; and the detail setting take them first and the blast itself stays. None of the names hold
; "smoke", so -smoke leaves them alone.
;
; Four tiers, one pair of systems each, thrown up a wide cone so the lines fan around the blast,
; climb, and curve down. The first cut threw them low and sideways at about 25 high, inside the
; fireball. The next threw them in a tight 20-degree cone, and on a projectile's hit leaned that
; cone back toward the gun (OrientToObject, RotateY -55): every trail went the same way and the
; white ribbons sat on the picture. The cone is about 45 degrees now, world-up on every blast, and
; the ribbons are thinner, darker and fewer. Heights are v*v/2g in retail frames.
;
;   Small   (kept; unused on live hits)           2 sparks, 17 to 34 high, line 0.8 s
;   Medium  (kept; unused on live hits)           3 sparks, 34 to 69 high, line 0.7 s
;   Large   (bombs, heavy shells, buildings)      5 sparks, 90 to 160 high, line 1.8 s
;   Huge    (nukes, MOAB, Daisy Cutter, big
;            buildings)                           8 sparks, 227 to 384 high, line 2.7 s
;
; Huge was 95 to 165 high with 3-wide lines at first and came out as a ring of short arcs a fifth
; the width of a nuke's fireball. Small lays a point every second frame, the others every third:
; ribbons bend at each point, and a fragment's arc is smooth enough at that spacing while the point
; count drops by a third. At most about 25, 20, 80 and 180 trail points alive per blast. Medium's
; line was 1.2 s and then 1 s; over a busy fight the hits' lines stood in the air together like
; rain, so it fades in 0.7 s.
;
; Orange sparks rather than white: white ones born inside the white of the blast could not be
; told from it. The ribbons are near-black, the same as the vehicle shrapnel's, so they read as
; smoke and not as a second fireball.
; ----------------------------------------------------------------------------------------------

