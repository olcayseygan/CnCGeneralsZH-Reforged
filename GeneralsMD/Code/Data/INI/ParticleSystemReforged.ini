; bounce once where they land and burn down from yellow through orange to nothing in two seconds.
; Each draws a ribbon of near-black smoke that greys as it thins and hangs for a little over a
; second. The piece itself is the fire, so the fire is always at the head of the smoke and never
; comes apart from it. Two earlier tries hung the fire on the ribbon as its slave: billboarded
; flames three times the ribbon's width came out as a string of separate fireballs fifty pixels
; apart, which read as fireworks, and a slave STREAK drew each segment as a hard-edged glowing card.
