; ==== Wreckage ====================================================================================

; More and heavier pieces when tanks, vehicles and buildings die. Every list below is EA's own with
; pieces added, all from models EA already throws somewhere else: the seven largest Power Plant chunks
; (ABPwrPlant_d03, d15, d16, d21, d24, d25, d29, by their mesh bounds 280 to 660 cubic units against
; 10 to 70 for the small ones), the five broad Mammoth hull plates (GXMammoth_d06 to d10) and the
; AVScrap bits the Humvee and Battlemaster already scatter. Force is divided by mass, so the big
; chunks carry Mass 60 against EA's 40 and hop lower and shorter. GenericDebris itself, and how long
; a piece lies on the ground, is in FixesReforged.ini.
;
; Pieces per death, EA then here: Crusader and the other GenericTankDeathEffect tanks 12 to 19,
; Battlemaster 6 to 9, Overlord 3 to 9, Scorpion 3 to 8, Marauder 3 to 8, Paladin 2 to 7, Humvee
