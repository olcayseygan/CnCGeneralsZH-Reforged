; Zero Hour Reforged general's talents, loaded after TurkiyeReforged.ini.
;
; A talent is a science with SciencePurchasePointCost 0 and its rank's science (SCIENCE_Rank6 to
; SCIENCE_Rank10) as a prerequisite, named in its general's TalentSciences (PlayerTemplate) as one
; of ten cards in the order 6A 6B 7A 7B 8A 8B 9A 9B 10A 10B. Picking one card of a rank loses the
; other. The sciences are in ScienceReforged.ini, since PlayerTemplateReforged.ini is read before
; this file and a MULTIFILE science list skips a name it does not know yet. This file holds what a
; card does to objects, added with AddModule (the route BalanceReforged.ini and TurkiyeReforged.ini
; take), keyed on the PLAYER upgrade the card grants (UpgradeReforged.ini).
;
; This file lands in the multiplayer INI checksum.

; ==== Turkiye ======================================================================================

; ---- 6A buildings cost 15% less, 6B infantry costs 15% less ----
; CostModifierUpgrade holds only while its object stands, and a (KindOf, percent) pair counts once
; however many carry it, so the discount sits on the Command Center, the Combat Engineer, the
; Barracks and the War Factory and lasts until the last of them is gone. A carrier finished after
; the pick takes it up on completion. INFANTRY covers the Engineer and the Maroon Beret too.

Object TurkiyeCommandCenter
  AddModule
    Behavior = CostModifierUpgrade ModuleTag_TurkiyeTalent6A
      TriggeredBy  = Upgrade_TurkiyeTalent6A
      EffectKindOf = STRUCTURE
      Percentage   = -15%
    End
  End
  AddModule
    Behavior = CostModifierUpgrade ModuleTag_TurkiyeTalent6B
      TriggeredBy  = Upgrade_TurkiyeTalent6B
      EffectKindOf = INFANTRY
      Percentage   = -15%
    End
  End
End

