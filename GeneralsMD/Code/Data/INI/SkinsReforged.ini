; Zero Hour Reforged unit skins, an online player's account entitlement (TankSkin.h).
;
; Skin <id>: the id is the one zerohour.gg uses and never changes or comes back for another skin.
; Unit names the unit, and a loadout holds one skin a unit.  Model lists every model the skin
; dresses, damaged states included.  Texture is a pair: a sheet one of those models draws, then the
; sheet drawn in its place.  A replacement missing on disk keeps the original, so the rebuilt models'
; sheets (*_R) and the retail ones (Classic Graphics, Detailed Models off) each swap only where their
; skin sheets are installed.  House colour sheets (ZHC*) are never swapped.
;
; Drawing only: loaded without the multiplayer INI checksum, and the logic never reads it.

; Crusader, the Superweapon General's too, 1K gold.  Not the Laser General's (the owner's call), and
; not the wreck: DeadCrusaderHulk's AVLeopard_D1 is what a crushed Paladin, Medic or Scud leaves too.
Skin 1
  Unit    = Crusader
  Model   = AVLeopard AVLeopard_D
  Texture = AVCrusader_R.tga   Skin1K_AVCrusader_R.tga
  Texture = AVCrusaderD_R.tga  Skin1K_AVCrusaderD_R.tga
  Texture = avleopard.tga      Skin1KC_avleopard.tga
  Texture = avleopard_d.tga    Skin1KC_avleopard_d.tga
End

