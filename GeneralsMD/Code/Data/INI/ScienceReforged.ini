; Zero Hour Reforged sciences, loaded after Science.ini as a MULTIFILE patch. A new name is added.
; A name already defined is edited in place: only the fields the block names change, every other
; one keeps its loaded value, and the root sciences are worked out again from the prerequisites it
; ends with (ScienceStore::friend_parseScienceDefinition). So a block that only adds a line holds
; only that line.
;
; This file lands in the multiplayer INI checksum.

; The Demolitions General's Rebel Ambush brings 4, 6 and 10 rebels, and he bought it through the
; plain GLA science, whose description promises 4, 8 and 16. A science carries its own description,
; so his ambush gets sciences of its own.

Science Demo_SCIENCE_RebelAmbush1
  PrerequisiteSciences = SCIENCE_GLA SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush1
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
  GrantsUpgrade = Upgrade_PowerProp_RebelAmbush1
End

Science Demo_SCIENCE_RebelAmbush2
  PrerequisiteSciences = Demo_SCIENCE_RebelAmbush1 SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush2
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
  GrantsUpgrade = Upgrade_PowerProp_RebelAmbush2
End

Science Demo_SCIENCE_RebelAmbush3
  PrerequisiteSciences = Demo_SCIENCE_RebelAmbush2 SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush3
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
  GrantsUpgrade = Upgrade_PowerProp_RebelAmbush3
End

