Object TurkiyeAirfield
  Side       = Turkiye
  DisplayName = OBJECT:TurkiyeAirfield
  CommandSet = TurkiyeAirfieldCommandSet
  ; Its own model: concept C, the hardened fortress field. Four earth-covered hardened shelters
  ; hold the hangar spots, each behind an up-and-over steel door in team-coloured panels; in the far
  ; corner a whitewashed stone keep on a battered foot with a crown portal, crenellated parapets
  ; and a square stone control tower whose glazed cab sits under a lead pyramid, an approach radar
  ; turning on a lattice mast on the keep's roof; a crew kiosk under a red-tile hip by the helipad.
  ; TRAIRFLD and its damaged, burning and rubble states TRAIRFLD_D, _E and _R, the four doors
  ; TRAIRFLD_DR1 to _DR4 and the construction scaffold TRAIRFLD_SC in Code/Data/Art/W3D, the
  ; TRAirfld_*.tga and ZHCA_TRAirfld.tga textures in Code/Data/Art/Textures, all made by
  ; experiments/proofs/2026-11-02/airfield in the workspace. The logic is retail AmericaAirfield's
  ; untouched: every model carries the 17 public bones where ABArFrcCmd has them, the footprint,
  ; GeometryHeight, ParkingPlaceBehavior and ProductionUpdate (four doors, 2 s to open) stay.
  ; Five draw modules take the place of retail's nine: the field, the four doors (DOOR_1 to DOOR_4,
  ; the parking spaces in ParkingPlaceBehavior's order), the scaffold. Night and snow draw the day
  ; models. Construction sinks the field into the ground as retail's does, with the painted stands
  ; (MARKS) and the radar hidden and the doors not drawn, inside a scaffold round the keep and a cage
  ; round the tower. The blinking production lights, the American fence and crane go.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Turkiye
      ExtraPublicBone = Runway1Parking1
      ExtraPublicBone = Runway1Parking2
      ExtraPublicBone = Runway2Parking1
      ExtraPublicBone = Runway2Parking2
      ExtraPublicBone = Runway1Park1Han
      ExtraPublicBone = Runway1Park2Han
      ExtraPublicBone = Runway2Park1Han
      ExtraPublicBone = Runway2Park2Han
      ExtraPublicBone = Runway1Prep1
      ExtraPublicBone = Runway1Prep2
      ExtraPublicBone = Runway2Prep1
      ExtraPublicBone = Runway2Prep2
      ExtraPublicBone = RunwayStart1
      ExtraPublicBone = RunwayStart2
      ExtraPublicBone = RunwayEnd1
      ExtraPublicBone = RunwayEnd2
      ExtraPublicBone = HeliPark01
      OkToChangeModelColor = Yes
      ConditionState       = NONE
        Model              = TRAIRFLD
        Animation          = TRAIRFLD.TRAIRFLD
        AnimationMode      = LOOP
        ShowSubObject      = MARKS RADAR
      End
      ConditionState       = AWAITING_CONSTRUCTION
        Model              = NONE
      End
      AliasConditionState  = AWAITING_CONSTRUCTION DAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION REALLYDAMAGED
      AliasConditionState  = SOLD
      AliasConditionState  = SOLD DAMAGED
      AliasConditionState  = SOLD REALLYDAMAGED
      ConditionState       = DAMAGED
        Model              = TRAIRFLD_D
        Animation          = TRAIRFLD_D.TRAIRFLD_D
        AnimationMode      = LOOP
        ShowSubObject      = MARKS RADAR
      End
      ConditionState       = REALLYDAMAGED
        Model              = TRAIRFLD_E
        ShowSubObject      = MARKS RADAR
      End
      ConditionState       = RUBBLE
        Model              = TRAIRFLD_R
      End
      AliasConditionState  = REALLYDAMAGED RUBBLE
      ; the same models as the finished states, so those show what these hid
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
        Model              = TRAIRFLD
        Animation          = TRAIRFLD.TRAIRFLD
        AnimationMode      = LOOP
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
        HideSubObject      = MARKS RADAR
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED DAMAGED
        Model              = TRAIRFLD_D
        Animation          = TRAIRFLD_D.TRAIRFLD_D
        AnimationMode      = LOOP
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
        HideSubObject      = MARKS RADAR
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED REALLYDAMAGED
        Model              = TRAIRFLD_E
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
        HideSubObject      = MARKS RADAR
      End
    End
