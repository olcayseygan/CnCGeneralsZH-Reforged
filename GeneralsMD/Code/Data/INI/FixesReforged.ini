; The EMP Patriot's missiles leave this sphere where they burst. Patch 1.01 commented out its
; DoesNotAffect = ALLIES, so it spared only its owner's buildings: its own and allied vehicles in the
; sphere were disabled, and its own and allied aircraft in the sky were killed. The EMP mines' sphere
; kept the line. EMPUpdate now asks it before the aircraft branch.

Object EMPPatriotEffectSpheroid
  ReplaceModule ModuleTag_02
    Behavior = EMPUpdate ModuleTag_02_Fix
      DisabledDuration    = 10000
      Lifetime            = 500
      StartFadeTime       = 100
      StartScale          = 0.01
      TargetScaleMin      = 2.00
      TargetScaleMax      = 3.00
      StartColor          = R:0 G:255 B:255
      EndColor            = R:0 G:128 B:128
      EffectRadius        = 10
      DisableFXParticleSystem = EMPSparks
      DoesNotAffect       = ALLIES
      DoesNotAffectMyOwnBuildings = Yes
    End
  End
End

