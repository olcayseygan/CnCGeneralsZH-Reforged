      OCL                      = FINAL OCL_TurkiyeAltayDeathEffect
      FX                       = FINAL FX_GenericTankDeathExplosion
    End
  End
  ReplaceModule ModuleTag_15
    Behavior = CreateObjectDie ModuleTag_15_Turkiye
      DeathTypes   = NONE +CRUSHED +SPLATTED
      CreationList = OCL_TurkiyeAltayCrushEffect
    End
  End
End

