  ; cordon and a team coping, an arched door to the camera; the turntable turns on TURRET01 with its
  ; radar face, and the four-canister launcher rests level on TURRETEL until the natural pitch
  ; raises it, its muzzles WEAPONA01-04. TRPATRIOT, its damaged and burning states TRPATRIOT_D and
