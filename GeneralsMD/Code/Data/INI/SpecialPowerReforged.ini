; Zero Hour Reforged special powers, loaded after SpecialPower.ini. A power EA defined is edited
; in place and a block holds only what changes; a new name is a new power.
;
; This file lands in the multiplayer INI checksum.

; Frenzy is a buff on your own troops and left a 250 radius window open for 30 seconds wherever
; it was clicked, so a Frenzy fired into the fog scouted an enemy base. Emergency Repair, the
; other buff, opens nothing.

SpecialPower SuperweaponFrenzy
  ViewObjectDuration = 0
  ViewObjectRange    = 0
End

SpecialPower Early_SuperweaponFrenzy
  ViewObjectDuration = 0
  ViewObjectRange    = 0
End

; China's 9B talent card spreads the Cluster Mines field's edge 90 to 102.6 (TalentsReforged.ini),
; and the targeting circle grows with it, 100 to 114.

SpecialPower SuperweaponClusterMines
  UpgradeRadiusCursorRadius = SCIENCE_ChinaTalent9B 114
End

; USA's 10A talent card widens the Fuel Air Bomb and the MOAB by a quarter (TalentsReforged.ini),
; and the targeting circle the two share grows with them, 170 to 212.5.

SpecialPower SuperweaponDaisyCutter
  UpgradeRadiusCursorRadius = SCIENCE_USATalent10A 212.5
  AIFiresWhenReady          = Yes   ; the strikes below say why
End

; GLA's 9B talent card widens the Anthrax Bomb by a quarter, the GLA general's 10A the Scud Storm,
; and the Stealth General's 10B the GPS Scrambler by half (TalentsReforged.ini). The targeting
; circles grow with them. All four Scud Storms share the one power; only the card's owner sees 250.

SpecialPower SuperweaponAnthraxBomb
  UpgradeRadiusCursorRadius = SCIENCE_GLATalent9B 250
  AIFiresWhenReady          = Yes   ; the strikes below say why
End

SpecialPower SuperweaponScudStorm
  UpgradeRadiusCursorRadius = SCIENCE_GLATalent10A 250
End

SpecialPower Slth_SuperweaponGPSScrambler
  UpgradeRadiusCursorRadius = SCIENCE_StealthTalent10B 150
End

; The rank strikes the skirmish AI fires on its own the moment they are ready, at the dearest enemy
; spot it has seen (AIPlayer::doReadySpecialPowers), on every side. The scripts fired them on Normal
; when ready, on Hard only while an attack was going out, and never on Easy, so a player who walled
; himself in was never hit between waves. The Fuel Air Bomb (the MOAB is its upgrade) and the
; Anthrax Bomb are flagged in their blocks above. EMP Pulse is here because it switches off the
; defences it lands on. The Nuke and Early China carpet bombers and the Air Force carpet bomb answer
; sciences the AI's skill sets never buy, and fire only if one is bought. Left out: the superweapons
; (doSuperweapons and the scripts have them), Cluster Mines (aimed at our own base's entrances),
; the paradrops and Rebel Ambush (they would land troops on his guns), Sneak Attack (its spot needs
; the construction zone search only the script action does), Cash Hack (it needs a building to
; target), the buffs and repairs (Frenzy, Emergency Repair, GPS Scrambler, Crate Drop, aimed at
; the enemy they would do nothing), Leaflet Drop (it stops units, and a turtle's defences are
; buildings) and Napalm Strike (SCIENCE_NapalmStrike cannot be bought).

SpecialPower SuperweaponA10ThunderboltMissileStrike
  AIFiresWhenReady = Yes
End

SpecialPower AirF_SuperweaponA10ThunderboltMissileStrike
  AIFiresWhenReady = Yes
End

SpecialPower SuperweaponSpectreGunship
  AIFiresWhenReady = Yes
End

SpecialPower AirF_SuperweaponSpectreGunship
  AIFiresWhenReady = Yes
End

SpecialPower AirF_SuperweaponCarpetBomb
  AIFiresWhenReady = Yes
End

SpecialPower SuperweaponChinaCarpetBomb
  AIFiresWhenReady = Yes
End

SpecialPower Early_SuperweaponChinaCarpetBomb
  AIFiresWhenReady = Yes
End

SpecialPower Nuke_SuperweaponChinaCarpetBomb
  AIFiresWhenReady = Yes
End

SpecialPower SuperweaponArtilleryBarrage
  AIFiresWhenReady = Yes
End

SpecialPower SuperweaponEMPPulse
  AIFiresWhenReady = Yes
End

; The Demolitions General's Rebel Ambush, behind his own sciences in ScienceReforged.ini. The
; computer still buys the plain science and fires the plain power, which his Command Center keeps.

SpecialPower Demo_SuperweaponRebelAmbush
  Enum                    = SPECIAL_AMBUSH
  ReloadTime              = 240000
  RequiredScience         = Demo_SCIENCE_RebelAmbush1
  PublicTimer             = No
  InitiateAtLocationSound = RebelAmbushActivated
  SharedSyncedTimer       = Yes
  RadiusCursorRadius      = 50
  ShortcutPower           = Yes
  AcademyClassify         = ACT_SUPERPOWER
End

; Turkiye's own rank powers. The Enum only has to be one no other power on the Turkiye Command
; Center uses (and no other Turkiye object, since the shortcut bar finds a power's source by its
; enum); what the power does is its module (TurkiyeReforged.ini). AIFiresWhenReady lets the
; skirmish AI, which runs America's scripts, fire them (AIPlayer::doReadySpecialPowers) at the
; dearest enemy spot. The radar powers leave the fog as it is.

; SIHA Kesfi: a recon area, 300 across, for 30 seconds. The spy satellite's enum, which can be aimed
; anywhere on the map, shroud or not; the Turkiye Command Center no longer carries the scan.
SpecialPower SuperweaponTurkiyeUavRecon
  Enum                    = SPECIAL_SPY_SATELLITE
  ReloadTime              = 120000
  RequiredScience         = SCIENCE_TurkiyeUavRecon
  InitiateAtLocationSound = SpySatellite
  PublicTimer             = No
  SharedSyncedTimer       = Yes
  RadiusCursorRadius      = 300
  ShortcutPower           = Yes
  AcademyClassify         = ACT_SUPERPOWER
  AIFiresWhenReady        = Yes
End

; SIHA Surusu, one to five loitering munitions on the dearest targets in the circle
SpecialPower SuperweaponTurkiyeSwarmMunition
  Enum                = SPECIAL_ARTILLERY_BARRAGE
  ReloadTime          = 180000
  RequiredScience     = SCIENCE_TurkiyeSwarmMunition
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  ViewObjectDuration  = 10000
  ViewObjectRange     = 200
  RadiusCursorRadius  = 200
  ShortcutPower       = Yes
  AcademyClassify     = ACT_SUPERPOWER
  AIFiresWhenReady    = Yes
End

; Uydu Gudum: no target, the whole map is radar coverage for 45 seconds. CIA Intelligence's enum,
; the one no-target power the click path knows (ActionManager::canDoSpecialPower); the Harekat
; Merkezi drops the CIA module it inherits from the Strategy Center so the shortcut finds this one.
SpecialPower SuperweaponTurkiyeSatelliteGuidance
  Enum                = SPECIAL_CIA_INTELLIGENCE
  ReloadTime          = 300000
  RequiredScience     = SCIENCE_TurkiyeSatelliteGuidance
  InitiateSound       = CIAIntelligenceActivate
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  ShortcutPower       = Yes
  AcademyClassify     = ACT_SUPERPOWER
  AIFiresWhenReady    = Yes
End

; Tayfun: the Superweapon General's cruise missile path with its own missile and warhead. The napalm
