; China's mine fields. EXAMineGroup has eight mine bones and no mesh at all, so EA's field was a
; white lens flare blinking on each bone every second and a half and nothing else. MineFX and
; MineFXPurple keep that: no mine is drawn, only an arming light over each bone, red on the standard
; and cluster mines and blue on the EMP mines. A steel plate under it was tried and taken out again;
; it looked laid on the ground rather than buried in it, worst on desert sand. The light is two
; systems. MineFX is a dot two and a half across lying flat, ReforgedMineLedRed.tga or
; ReforgedMineLedBlue.tga, a coloured lens with a near-white middle in a dark bezel, alpha blended so
; it keeps its colour on grass, sand or snow. Its slave MineFXGlow is an additive glow seven across
; facing the camera, ReforgedMineGlow*.tga, a white-hot point in a saturated glow; a slave's Size
; scales its master's, so 2.8 over the dot's 1.25 is 3.5, and its own SlavePosOffset places it
; against the dot. The dot sits one over the bone and the glow 2.4, high enough that the ground
; behind each along the player's line of sight, which looks down at about 39 degrees, is further
; than its half width: the soft particle fade thins a sprite over its half width wherever the ground
; is closer behind it than that, and a 30-across glow lying on the ground came out at about a tenth
; of its colour. Raised straight up the light showed about 8 px above the bone from the opening
; camera, so each is also moved towards that camera (south, -Y, the opening view's yaw being 0) by
; its height over the tangent of the 37.5 degree pitch. A player who turns the camera sees it drift
; off the spot. The dot's line volume is one point, which is how a master is offset from its bone.
; The light comes on at full strength, holds for eight frames and is gone two frames later, then
; stays dark for a second and a half, each bone starting at a random point of that: the lens flare
; it replaced was a soft blob that swelled and faded over 24 frames.
;
; The systems hang off the field's model, so they keep its stealth: the owner and his allies see
; them, an enemy only while the field is detected.

