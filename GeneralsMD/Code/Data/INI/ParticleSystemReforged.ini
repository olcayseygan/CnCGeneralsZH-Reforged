; ----------------------------------------------------------------------------------------------
; Explosions. A blast opens on a white-hot core that cools through yellow and orange to nothing
; in a third of a second, then EA's fireball carries on. Additive particles fade by colour, not
; alpha, so every core runs white to black.
;
; The two slave cores ride EA's own systems (SlaveSystem below), one core per master particle.
; ParticleSystem::mergeRelatedParticleSystems multiplies a slave's Size, SizeRate and
; SizeRateDamping onto the master particle's, so the numbers here are factors and a core comes
; out as large as the blast it sits in: a tank shell's is about 15 across, a tank death's or a
; Scud launcher's about 40 to 45. They go on EA's blast lens flares, which open most
; vehicle, structure and bomb deaths, and on the three fireballs that hits use without a flare
; (tank shells and rockets, cars, sticky bombs). One slave particle per master particle, short
; lived, so the extra particle count is a few per blast.
;
; The bloom pass (dx11post.cpp) keeps whatever is over 1.0 in some channel, and one EA fireball
; does not get there. A white core on top of the fireball does, for its first few frames only.
; ----------------------------------------------------------------------------------------------

