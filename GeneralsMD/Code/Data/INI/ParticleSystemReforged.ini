; ----------------------------------------------------------------------------------------------
; ZH Enhanced techniques, 2026-11-16
;
; ZH Enhanced gets its explosions from stock INI keys alone: more layers per blast, each born a few
; frames after the last, smoke that is born fire-lit orange and cools to grey, a rising twin over
; every fireball and smoke ball, flat dust on the ground, slow embers, fireballs that fade by colour
; with no white core, and heat haze. The FXLists that would place new layers are in the multiplayer
; checksum, so everything here rides systems they already play: a new layer hangs off one of them as
; its slave or as the chain behind an invisible relay (a slave of a slave lays its own burst at the
; feed point, in its own size and velocity, ParticleSys.cpp), and a second wave that has to come late
; is held invisible by its first alpha keys, since a chained layer is fed the moment its master
; emits. Every new layer is at WEAPON_EXPLOSION, the lowest priority, so the particle cap drops it
; first. No ZH Enhanced texture is used; only EA's and the fork's own.
;
; The sprites' brightness decides the colour keys. EXSmokNew1 is EA's soot (about 54 of 255 where
; opaque), EXSmokNew2 a pale puff (176), EXCloud01 a mid-grey cloud (130) and EXSmokePuff about 100:
; the screen colour is the key times that. A smoke layer here is keyed for a dark grey-brown of 70
; to 100 on screen.
;
; Colours are EA's (owner, 2026-11-16, after a before and after of this round: "renkler retaildaki
; gibi olsun, ruhunu degistirme"). Every EA system this round touched has EA's colour keys, blend
; mode and texture again, the keys stretched in time only where its life was shortened, and is out
; of the fire look list like EA drew it. The fork's painted single-frame sprites of the same day
; (fire in a saturated red-orange, blended and Emissive) are gone from every system: the fire layers
; are added again like EA's fireballs, the smoke and dust layers are on EXCloud01 or on the smoke
; flipbook. The layering, the delays, the shorter lives and the counts stay.
;
; Variety comes from flipbooks drawn in EA's colours (Tools/sprite_flipbook.py): ReforgedBlastV,
; four different balls of 16 frames back to back in one 8 by 8 atlas, played once over a particle's
; life and added like EXexplo03; ReforgedSmokeLoop, 64 frames of a churning puff in EXCloud01's grey;
; ReforgedFireLoop, 64 frames of a licking flame in EXFire01's colours. Every blast card picks one of
; the four balls at birth (FlipbookVariants = 4), so the cards of one blast differ among themselves.
; The loops start each particle on a frame of its own (FlipbookRandomStart). Blasts, smoke and fire
; alike draw about half their cards flipped left to right (FlipbookMirror), and every card is turned
; at random.
;
; The systems named ReforgedZ... further down are placed by FXListReforged.ini lines rather than
; hung on anything; under Classic graphics they are read as systems that emit nothing.
; ----------------------------------------------------------------------------------------------

; Muzzle flashes. EA's tank cannon flame is a burst of small fireball cards thrown along the barrel;
; it gets a few more (TankMuzzleFlashFlame 15, the small gun's 8, the heroic 15, the Nuke Cannon's
; 14) in EA's colour. The cannon smoke gets a second, slower puff behind it (ReforgedMuzzleSmokeLate,
; its slave), invisible for ten frames so it blooms about a third of a second after the shot and
; hangs about two and a half seconds. EA's ground ring under the muzzle (TankMuzzleWave) feeds a low
; ring of dust kicked up off the ground (ReforgedMuzzleDustRing) through an invisible relay.

ParticleSystem HeroicTankMuzzleFlashFlame
  BurstCount = 15.00 15.00
End

ParticleSystem HeroicTankMuzzleFlashSmoke
  SlaveSystem = ReforgedMuzzleSmokeLate
End

ParticleSystem TankMuzzleWave
  SlaveSystem = ReforgedMuzzleWaveAnchor
End

ParticleSystem NukeCannonMuzzleFlashFlame
