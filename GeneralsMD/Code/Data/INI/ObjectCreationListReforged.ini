; Object creation lists EA left out or got wrong. GameEngine::init loads this right after
; ObjectCreationList.ini with INI_LOAD_OVERWRITE, so a list named here is cleared and replaced
; whole and a new name is added. It lands in the multiplayer INI CRC.

; ==== Turkiye radar powers =========================================================================

; The markers the radar powers leave where they are aimed (TurkiyeReforged.ini): an object owned by
; the firing player that carries a RadarCoverageBehavior and nothing that sees, so the fog stays.
; SIHA Kesfi's at the point, Uydu Gudum's wherever the button puts it (its radius covers any map).

ObjectCreationList SUPERWEAPON_TurkiyeUavRecon
  CreateObject
    ObjectNames = TurkiyeUavReconMarker
    Count = 1
  End
End

ObjectCreationList SUPERWEAPON_TurkiyeSatelliteGuidance
  CreateObject
    ObjectNames = TurkiyeSatelliteGuidanceMarker
    Count = 1
  End
End

; Elektronik Harp's jamming field, Koral's JammerUpdate over the target area for 30 seconds, put down
; at the target point by the Command Center's RadarJamSpecialPower (TurkiyeReforged.ini).
ObjectCreationList SUPERWEAPON_TurkiyeElectronicWarfare
  CreateObject
    ObjectNames = TurkiyeElectronicWarfareMarker
    Count = 1
  End
End

; Tayfun: the Superweapon General's cruise missile path (SUPERWEAPON_CruiseMissile), fired from the
; Command Center. TurkiyeTayfunLaunch is radar-guided (TurkiyeWeaponReforged.ini).
ObjectCreationList SUPERWEAPON_TurkiyeTayfun
  FireWeapon
    Weapon = TurkiyeTayfunLaunch
  End
End

