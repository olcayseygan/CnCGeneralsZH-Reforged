  Armor = CRUSH             200%
  Armor = ARMOR_PIERCING    30%   ; EA: 10%, 3.4.0: 100%
  Armor = INFANTRY_MISSILE  10%
  Armor = FLAME             150%
  Armor = PARTICLE_BEAM     150%
  Armor = SNIPER            200%
  Armor = LASER             50%
  Armor = HAZARD_CLEANUP    0%
  Armor = KILL_PILOT        0%
  Armor = SURRENDER         100%
  Armor = SUBDUAL_MISSILE   0%
  Armor = SUBDUAL_VEHICLE   0%
  Armor = SUBDUAL_BUILDING  0%
