; Zero Hour Reforged sciences, loaded after Science.ini. Only new names: one EA already defined
; stops the load.
;
; This file lands in the multiplayer INI checksum.

; The Demolitions General's Rebel Ambush brings 4, 6 and 10 rebels, and he bought it through the
; plain GLA science, whose description promises 4, 8 and 16. A science carries its own description,
; so his ambush gets sciences of its own.

Science Demo_SCIENCE_RebelAmbush1
  PrerequisiteSciences = SCIENCE_GLA SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush1
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
End

Science Demo_SCIENCE_RebelAmbush2
  PrerequisiteSciences = Demo_SCIENCE_RebelAmbush1 SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush2
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
End

Science Demo_SCIENCE_RebelAmbush3
  PrerequisiteSciences = Demo_SCIENCE_RebelAmbush2 SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:GLARebelAmbush3
  Description = CONTROLBAR:Demo_ToolTipGLAScienceRebelAmbush
End

; Turkey's side science, the way SCIENCE_AMERICA marks the Americans. FactionTurkey holds it beside
; SCIENCE_AMERICA (PlayerTemplateReforged.ini), so it buys the American powers today and a power of
; its own can name this as its prerequisite later. PlayerTemplateReforged.ini loads after this file
; and needs the name to exist.

Science SCIENCE_Turkey
  PrerequisiteSciences = None
  SciencePurchasePointCost = 0  ; not purchasable, as for SCIENCE_AMERICA
  IsGrantable = No
End

; Turkey's first rank power of its own: a cargo plane sows a minefield (the plan's Rank 1 mayin
; tarlasi). China's Cluster Mines asks for SCIENCE_CHINA, so Turkey gets its own science for it.

Science SCIENCE_TurkeyMinefield
  PrerequisiteSciences = SCIENCE_Turkey SCIENCE_Rank1
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:TurkeyMinefield
  Description = CONTROLBAR:ToolTipTurkeyScienceMinefield
End

; Rank 1's fuel resupply is an upgrade, not a power: GrantsUpgrade completes the player upgrade the
; moment the science is bought, and the drones' weapon set upgrades take it from there.

Science SCIENCE_TurkeyFuelResupply
  PrerequisiteSciences = SCIENCE_Turkey SCIENCE_Rank1
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:TurkeyFuelResupply
  Description = CONTROLBAR:ToolTipTurkeyScienceFuelResupply
  GrantsUpgrade = Upgrade_TurkeyFuelResupply
End

Science SCIENCE_TurkeySwarmMunition
  PrerequisiteSciences = SCIENCE_Turkey SCIENCE_Rank3
  SciencePurchasePointCost = 1
  IsGrantable = Yes
  DisplayName = SCIENCE:TurkeySwarmMunition
  Description = CONTROLBAR:ToolTipTurkeyScienceSwarmMunition
End

Science SCIENCE_TurkeyElectronicBlinding
