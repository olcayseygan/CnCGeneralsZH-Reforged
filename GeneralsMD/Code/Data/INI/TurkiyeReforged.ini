; The drone's dive: the Tomahawk missile drawn as the drone, let go at the drone's height and speed
; and pointed at the target, so the swap from the jet does not show. It is let go 250 out and 300 up
; and comes down the Scud Storm missile's way: no dive distance short of its lock, so Locomotor's
; cruise curve takes it from level flight into a sixty degree dive, then 80 out the lock's straight
; run onto the target, which follows it as it drives. A lock at 10 skimmed in at tank height and
; missed a moving Crusader by a tank length. The Scud's thrust angle lets it bend that hard. It is
; UNATTACKABLE as the jet is, and no BALLISTIC_MISSILE: point defense lasers (PointDefenseLaserUpdate,
; the Avenger's and the Paladin's) pick their targets by that kind and never ask UNATTACKABLE, and
; one shot a dive down over the Avengers it was going for. No ignition flash, no smoke trail. The
; Tomahawk names no side, so a Firtina's missile stays a missile (ThingFactory::newObject).

Locomotor TurkiyeKarguDroneDiveLocomotor
  Surfaces = AIR
  Speed = 200
  MinSpeed = 120
  Acceleration = 300
  Braking = 0
  TurnRate = 540
  MaxThrustAngle = 45
  AllowAirborneMotiveForce = Yes
  Appearance = THRUST
  PreferredHeight = 300
  AirborneTargetingHeight = 30
  PreferredHeightDamping = 0.7
End

ObjectReskin TurkiyeKarguDroneDive TomahawkMissile
End

